<div class="intro">学习方法：先背意大利语，再看中文核对意思。答题时根据具体事件选择合适句子、调整顺序。注意：这些是通用表达积木，不代表每道应变题都要全部使用；具体措施必须服从题目情境和参考答案。</div>
<div id="content"></div><footer>共28句 · 8个功能组 · 每句意大利语与中文逐句对应</footer></main>
<script>const data=[{"group": "一、说明情况", "subtitle": "Spiegare la situazione", "zh": "首先，我会核实事情的经过和具体情况。", "it": "Innanzitutto, verificherò come si sono svolti i fatti e la situazione concreta."}, {"group": "一、说明情况", "subtitle": "Spiegare la situazione", "zh": "我会向游客如实说明目前的情况。", "it": "Spiegherò ai turisti la situazione attuale in modo sincero e chiaro."}, {"group": "一、说明情况", "subtitle": "Spiegare la situazione", "zh": "我会进一步了解问题发生的原因。", "it": "Cercherò di capire meglio le cause del problema."}, {"group": "一、说明情况", "subtitle": "Spiegare la situazione", "zh": "我会及时向游客通报事情的最新进展。", "it": "Terrò i turisti aggiornati sugli ultimi sviluppi della situazione."}, {"group": "二、道歉与安抚", "subtitle": "Scusarsi e rassicurare", "zh": "对于给游客带来的不便，我表示诚挚的歉意。", "it": "Mi scuso sinceramente con i turisti per il disagio arrecato."}, {"group": "二、道歉与安抚", "subtitle": "Scusarsi e rassicurare", "zh": "我会耐心倾听游客的意见和诉求。", "it": "Ascolterò con pazienza le opinioni e le richieste dei turisti."}, {"group": "二、道歉与安抚", "subtitle": "Scusarsi e rassicurare", "zh": "我会尽力安抚游客的情绪，请他们保持冷静。", "it": "Farò del mio meglio per rassicurare i turisti e chiedere loro di mantenere la calma."}, {"group": "二、道歉与安抚", "subtitle": "Scusarsi e rassicurare", "zh": "我会争取取得游客的理解和谅解。", "it": "Cercherò di ottenere la comprensione e il perdono dei turisti."}, {"group": "三、报告与请示", "subtitle": "Riferire e chiedere istruzioni", "zh": "我会第一时间向旅行社报告情况。", "it": "Riferirò immediatamente la situazione all’agenzia di viaggi."}, {"group": "三、报告与请示", "subtitle": "Riferire e chiedere istruzioni", "zh": "我会向旅行社请示，并按照相关指示处理。", "it": "Chiederò istruzioni all’agenzia di viaggi e agirò secondo le indicazioni ricevute."}, {"group": "三、报告与请示", "subtitle": "Riferire e chiedere istruzioni", "zh": "处理过程中，我会及时向负责人汇报进展。", "it": "Durante la gestione del problema, aggiornerò tempestivamente il responsabile."}, {"group": "三、报告与请示", "subtitle": "Riferire e chiedere istruzioni", "zh": "事情处理结束后，我会提交书面报告。", "it": "Al termine della gestione, presenterò una relazione scritta."}, {"group": "四、联系与协调", "subtitle": "Contattare e coordinare", "zh": "我会立即联系相关单位，了解并核实情况。", "it": "Contatterò immediatamente gli enti competenti per conoscere e verificare la situazione."}, {"group": "四、联系与协调", "subtitle": "Contattare e coordinare", "zh": "我会与旅行社保持密切联系。", "it": "Rimarrò in stretto contatto con l’agenzia di viaggi."}, {"group": "四、联系与协调", "subtitle": "Contattare e coordinare", "zh": "我会积极与游客、司机及相关工作人员沟通协调。", "it": "Comunicherò e mi coordinerò attivamente con i turisti, l’autista e il personale interessato."}, {"group": "四、联系与协调", "subtitle": "Contattare e coordinare", "zh": "在征求游客意见后，我会与有关方面协商解决办法。", "it": "Dopo aver chiesto il parere dei turisti, discuterò una soluzione con le parti interessate."}, {"group": "五、采取措施", "subtitle": "Adottare misure", "zh": "我会根据实际情况立即采取必要措施。", "it": "Adotterò immediatamente le misure necessarie in base alla situazione concreta."}, {"group": "五、采取措施", "subtitle": "Adottare misure", "zh": "我会优先保障游客的人身和财产安全。", "it": "Darò la priorità alla tutela dell’incolumità personale e dei beni dei turisti."}, {"group": "五、采取措施", "subtitle": "Adottare misure", "zh": "如果有人受伤，我会立即联系急救人员并协助就医。", "it": "Se qualcuno rimane ferito, contatterò immediatamente i soccorsi e aiuterò la persona a ricevere assistenza medica."}, {"group": "五、采取措施", "subtitle": "Adottare misure", "zh": "如果行程受到影响，我会在征求意见后妥善调整安排。", "it": "Se l’itinerario viene compromesso, riorganizzerò il programma in modo adeguato dopo aver consultato i turisti."}, {"group": "六、寻求帮助", "subtitle": "Chiedere aiuto", "zh": "必要时，我会向警方或有关部门寻求帮助。", "it": "Se necessario, chiederò aiuto alla polizia o agli enti competenti."}, {"group": "六、寻求帮助", "subtitle": "Chiedere aiuto", "zh": "我会协助游客办理所需手续。", "it": "Aiuterò i turisti a espletare le formalità necessarie."}, {"group": "六、寻求帮助", "subtitle": "Chiedere aiuto", "zh": "遇到紧急情况时，我会及时请求专业人员救援。", "it": "In caso di emergenza, richiederò tempestivamente l’intervento di personale specializzato."}, {"group": "七、保障权益", "subtitle": "Tutelare i diritti", "zh": "我会依法维护游客的合法权益。", "it": "Tutelerò i diritti e gli interessi legittimi dei turisti nel rispetto della legge."}, {"group": "七、保障权益", "subtitle": "Tutelare i diritti", "zh": "我会尊重游客的合理要求，并尽力提供帮助。", "it": "Rispetterò le richieste ragionevoli dei turisti e farò del mio meglio per aiutarli."}, {"group": "七、保障权益", "subtitle": "Tutelare i diritti", "zh": "处理问题时，我会坚持公平、合理的原则。", "it": "Nella gestione del problema, agirò secondo principi di equità e ragionevolezza."}, {"group": "八、后续处理", "subtitle": "Dare seguito e concludere", "zh": "我会持续跟进，直到问题得到妥善解决。", "it": "Seguirò la situazione fino a quando il problema non sarà risolto adeguatamente."}, {"group": "八、后续处理", "subtitle": "Dare seguito e concludere", "zh": "事情处理完毕后，我会做好善后工作，总结经验教训。", "it": "Una volta risolto il problema, mi occuperò delle questioni successive e trarrò insegnamento dall’esperienza."}];const box=document.getElementById('content');let n=0;let last='';data.forEach(x=>{if(x.group!==last){const sec=document.createElement('section');sec.className='group';const h=document.createElement('h2');h.textContent=x.group;sec.append(h);const s=document.createElement('div');s.className='sub';s.textContent=x.subtitle;sec.append(s);box.append(sec);last=x.group;}const sec=box.lastElementChild;const c=document.createElement('article');c.className='card';n++;const no=document.createElement('span');no.className='num';no.textContent='积木句 '+String(n).padStart(2,'0');const it=document.createElement('div');it.className='it';it.textContent=x.it;const zh=document.createElement('div');zh.className='zh';zh.textContent=x.zh;c.append(no,it,zh);sec.append(c);});</script></body></html>
