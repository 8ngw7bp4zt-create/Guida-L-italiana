<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guida Italiana｜答题模板</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#202538;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#244f48,#477b6b);color:white;padding:26px 18px}main{max-width:900px;margin:20px auto;padding:0 14px 40px}
h1{font-size:24px;margin:0 0 5px}header p{margin:0;color:#e3eee9}.intro{background:#fff;padding:14px 16px;border-radius:13px;margin-bottom:14px;color:#536071;font-size:14px}
.card{background:#fff;border:1px solid #e5e8ef;border-radius:14px;padding:16px;margin:12px 0}
h2{font-size:18px;margin:0 0 4px}.when{color:#697386;font-size:13px;margin-bottom:12px}
.pair{padding:9px 11px;background:#f7f8fa;border-radius:9px;margin:7px 0}.it{color:#285b50;font-weight:650}.zh{font-size:13px;color:#596477}
.example{font-size:13px;margin-top:12px}.note{font-size:13px;color:#6a5360;background:#fbf7f8;padding:9px 11px;border-radius:9px;margin-top:8px}
footer{font-size:12px;color:#778092;text-align:center;padding:18px}
</style></head><body><div style="max-width:960px;margin:10px auto;padding:0 14px"><a href="index.html" style="color:#315c50;text-decoration:none;font-size:13px">← 返回学习主页</a></div><header><h1>Guida Italiana｜答题模板</h1><p>Risposte per l’esame orale · 面试口头回答框架</p></header><main>
<div class="intro">使用方法：先判断题目属于哪种问法，再选对应框架。模板只负责组织语言，具体考点、数量、顺序和专名必须以200问原参考答案为准。应变题尤其不能机械套用同一套措施。</div>
<div id="cards"></div><footer>建议先熟悉每类开头句，再把原题答案中的关键词填入框架。</footer></main>
<script>const data=[{"title": "列举类", "when": "有哪些、包括哪几方面、分为哪几类？", "frame": ["Si possono distinguere in tre categorie: …", "主要可以分为三类：……", "I punti principali sono i seguenti: …", "主要有以下几点：……", "In particolare, …", "具体来说，……"], "example": "按业务范围划分，导游可分为哪几类？", "note": "先说总数或总类别，再逐项列举。数量、类别名称以原题参考答案为准。"}, {"title": "步骤／流程类", "when": "主要分为哪几个步骤、服务程序是什么？", "frame": ["Innanzitutto, …", "首先，……", "Successivamente, …", "接下来，……", "Infine, …", "最后，……"], "example": "旅游团抵达后，地陪导游的工作主要分为哪几个步骤？", "note": "按原答案顺序背诵，使用 innanzitutto、successivamente、infine 串联。"}, {"title": "处理／应对类", "when": "应如何处理、应如何应对？", "frame": ["Per prima cosa, bisogna verificare la situazione.", "首先，要核实情况。", "Poi, occorre informare tempestivamente l’agenzia di viaggi.", "然后，要及时通知旅行社。", "È necessario rassicurare i turisti e coordinare le misure da adottare.", "需要安抚游客，并协调采取相应措施。", "Infine, bisogna seguire la situazione fino alla sua risoluzione.", "最后，要持续跟进，直到问题解决。"], "example": "航班延误、行程变更、游客投诉等应变题。", "note": "这是通用表达框架，不是所有突发事件都能照搬。必须按具体题目的原参考答案调整措施和顺序。"}, {"title": "预防／避免类", "when": "如何防止、怎样预防、如何避免？", "frame": ["Per prevenire questo problema, …", "为了预防这一问题，……", "È importante controllare in anticipo …", "提前检查……很重要。", "Bisogna mantenere i contatti e prestare attenzione alla sicurezza.", "要保持联系并注意安全。"], "example": "地陪导游应如何防止漏接事故发生？", "note": "重点表达事前准备、核实信息、提前到达、保持联系等；具体考点依原题答案。"}, {"title": "职责／工作内容类", "when": "主要职责有哪些、应做好哪些工作？", "frame": ["La responsabilità principale della guida è …", "导游的主要职责是……", "Inoltre, deve …", "此外，还应当……", "Deve anche collaborare con …", "还应与……配合。"], "example": "全陪导游在陪同团队过程中，应做好哪些工作？", "note": "用 deve / è responsabile di 表达职责；逐条覆盖原答案，不要只说一句笼统的话。"}, {"title": "原则／要求类", "when": "应遵循哪些原则、有哪些基本要求？", "frame": ["È necessario rispettare i seguenti principi: …", "需要遵循以下原则：……", "Prima di tutto, bisogna …", "首先，应当……", "In ogni caso, è importante …", "无论如何，……都很重要。"], "example": "导游在处理旅游者的个别要求时，一般需要遵循哪些基本原则？", "note": "原则类题目适合先给总领句，再列出原则名称和简短解释。"}, {"title": "定义／概念类", "when": "什么是……、请解释……", "frame": ["Per … si intende …", "……是指……", "In altre parole, …", "换句话说，……", "Si tratta di …", "这属于／这是……"], "example": "什么是误机？", "note": "先给准确、简洁的定义，再按题目要求补充后果或处理要点。"}, {"title": "原因／意义类", "when": "为什么、具有什么意义、原因是什么？", "frame": ["Questo è importante perché …", "这很重要，因为……", "Da un lato, …; dall’altro, …", "一方面……；另一方面……", "Ciò contribuisce a …", "这有助于……"], "example": "推进文化和旅游深度融合发展具有什么重大意义？", "note": "意义类按原参考答案的层次表达；不要自行添加资料中没有的政策结论。"}, {"title": "特点／特色类", "when": "有哪些特点、核心内涵是什么？", "frame": ["Si caratterizza per …", "其特点是……", "L’aspetto principale è …", "其主要特点是……", "Comprende … e …", "包括……和……"], "example": "“锦绣天府·安逸四川”文旅品牌的核心内涵是什么？", "note": "文化品牌、旅游资源、景区特色题常用。专名和关键词要准确。"}, {"title": "简要介绍／景点介绍类", "when": "简要介绍某景区、景点或文化遗产。", "frame": ["Si trova a …", "它位于……", "È famoso/a per …", "它以……而闻名。", "È caratterizzato/a da …", "它的特色是……", "È una meta turistica importante per …", "它是……方面的重要旅游目的地。"], "example": "简要介绍兴文石海景区的特点。", "note": "介绍景点时按原题涉及的地理位置、形成原因、主要景观和特色组织，不要凭空补充。"}, {"title": "年份／数字／政策目标类", "when": "哪一年、具体日期、到某年达到什么目标、数字是多少？", "frame": ["Nel …, …", "在……年，……", "Entro il 2027, l’obiettivo è …", "到2027年，目标是……", "La cifra prevista è di …", "预计数字为……", "Secondo il documento, …", "根据该文件，……"], "example": "《决定》明确，到2027年的阶段性目标是什么？", "note": "年份、日期、金额、数量、文件全称必须照原资料记忆。意大利语表达可以简化，但数字和事实不能改。"}, {"title": "比较／区别类", "when": "有什么区别、如何区分、比较……", "frame": ["La differenza principale tra … e … è …", "……与……的主要区别是……", "Mentre …, …", "而……，……", "Da una parte …, dall’altra …", "一方面……，另一方面……"], "example": "当题目要求区分不同导游岗位或不同概念时使用。", "note": "先明确比较对象，再按相同维度逐项比较；仅在原题确实要求比较时使用。"}];const box=document.getElementById('cards');data.forEach(t=>{const c=document.createElement('section');c.className='card';const h=document.createElement('h2');h.textContent=t.title;c.append(h);const w=document.createElement('div');w.className='when';w.textContent='常见问法：'+t.when;c.append(w);t.frame.forEach((s,i)=>{const p=document.createElement('div');p.className='pair';const it=document.createElement('div');it.className='it';it.textContent=s;c.append(p);p.append(it);});const e=document.createElement('div');e.className='example';e.textContent='题目示例：'+t.example;c.append(e);const n=document.createElement('div');n.className='note';n.textContent='使用提醒：'+t.note;c.append(n);box.append(c)});</script></body></html>
