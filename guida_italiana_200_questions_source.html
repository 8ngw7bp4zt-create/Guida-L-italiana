</style></head><body><header><main style="margin:0 auto;padding:0"><a class="back" href="index.html">← 返回学习主页</a><h1>Guida Italiana｜200道面试原题库</h1><p>规范知识60题 · 应变能力60题 · 综合知识80题</p></main></header><main><div class="note">中文原题与参考答案均按资料保留。先看中文题干和关键词，尝试口头回答；卡住时再展开参考答案。熟悉度和收藏状态会保存在当前浏览器中。</div><div class="toolbar"><input id="search" class="search" placeholder="搜索中文题目、答案或意大利语关键词……"><div class="row filters" id="filters"></div><div class="row"><button class="action primary" id="self">自测模式：关</button><button class="action" id="random">🎲 随机抽一题</button><button class="action" id="unfamiliar">只看未熟悉</button><button class="action" id="favs">只看收藏</button><button class="action" id="reset">清除筛选</button></div><div class="stat" id="stat"></div><div class="progress"><i id="bar"></i></div><div class="mode" id="modehint">提示：先尝试不看答案，用意大利语说出来，再展开核对。</div></div><div id="list"></div></main><script>
const data=[{"category":"规范知识","number":1,"question":"按业务范围划分，导游可分为哪几类？","answer":"（1）出境旅游领队；\n\n（2）全陪导游；\n\n（3）地陪导游。","italian_answer":"Le guide turistiche, in base all’ambito di attività, si dividono in tre categorie:\n1. accompagnatore turistico per i viaggi all’estero;\n2. guida accompagnatrice per tutto il viaggio;\n3. guida locale.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"accompagnatore turistico per i viaggi all’estero;","chinese":"出境旅游领队；"},{"italian":"guida accompagnatrice per tutto il viaggio;","chinese":"全陪导游；"},{"italian":"guida locale.","chinese":"地陪导游。"}]},{"category":"规范知识","number":2,"question":"熟悉团队是导游带团的第一步，它主要包括哪几方面的内容？","answer":"（1）熟悉旅游团概况；\n\n（2）熟悉旅游团成员基本情况；\n\n（3）熟悉旅游线路和交通工具；\n\n（4）熟悉交通票据。","italian_answer":"La preparazione di una guida sul gruppo comprende quattro aspetti:\n1. conoscere le caratteristiche generali del gruppo;\n2. conoscere le informazioni di base sui partecipanti;\n3. conoscere l’itinerario e i mezzi di trasporto;\n4. conoscere i biglietti e i documenti di viaggio.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"conoscere le caratteristiche generali del gruppo;","chinese":"熟悉旅游团概况；"},{"italian":"conoscere le informazioni di base sui partecipanti;","chinese":"熟悉旅游团成员基本情况；"},{"italian":"conoscere l’itinerario e i mezzi di trasporto;","chinese":"熟悉旅游线路和交通工具；"},{"italian":"conoscere i biglietti e i documenti di viaggio.","chinese":"熟悉交通票据。"}]},{"category":"规范知识","number":3,"question":"在旅游团抵达的前一天，地陪导游应主要落实哪些接待事宜？","answer":"（1）核对日常安排；\n\n（2）与全陪导游或者领队联系；\n\n（3）落实接待车辆；\n\n（4）落实住房及用餐；\n\n（5）核实交通票据；\n\n（6）落实其他项目。","italian_answer":"Il giorno prima dell’arrivo del gruppo, la guida locale deve principalmente:\n1. verificare il programma giornaliero;\n2. contattare la guida accompagnatrice o il capogruppo;\n3. confermare il veicolo per il trasferimento;\n4. confermare l’alloggio e i pasti;\n5. verificare i biglietti e i documenti di viaggio;\n6. confermare gli altri servizi previsti.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"verificare il programma giornaliero;","chinese":"核对日常安排；"},{"italian":"contattare la guida accompagnatrice o il capogruppo;","chinese":"与全陪导游或者领队联系；"},{"italian":"confermare il veicolo per il trasferimento;","chinese":"落实接待车辆；"},{"italian":"confermare l’alloggio e i pasti;","chinese":"落实住房及用餐；"},{"italian":"verificare i biglietti e i documenti di viaggio;","chinese":"核实交通票据；"},{"italian":"confermare gli altri servizi previsti.","chinese":"落实其他项目。"}]},{"category":"规范知识","number":4,"question":"在旅游团抵达后，地陪导游的工作主要分为哪几个步骤？","answer":"（1）持证上岗；\n\n（2）迎接旅游团；\n\n（3）核实团队信息；\n\n（4）集中清点行李；\n\n（5）集合登车。","italian_answer":"Dopo l’arrivo del gruppo, la guida locale svolge principalmente queste attività:\n1. presentarsi in servizio con il tesserino;\n2. accogliere il gruppo;\n3. verificare le informazioni sul gruppo;\n4. raccogliere e contare i bagagli;\n5. riunire il gruppo e accompagnarlo al veicolo.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"presentarsi in servizio con il tesserino;","chinese":"持证上岗；"},{"italian":"accogliere il gruppo;","chinese":"迎接旅游团；"},{"italian":"verificare le informazioni sul gruppo;","chinese":"核实团队信息；"},{"italian":"raccogliere e contare i bagagli;","chinese":"集中清点行李；"},{"italian":"riunire il gruppo e accompagnarlo al veicolo.","chinese":"集合登车。"}]},{"category":"规范知识","number":5,"question":"地陪导游在团队用餐时应及时巡视团队就餐情况，巡视的主要内容有哪些？","answer":"（1）监督检查餐厅提供的餐食是否符合约定标准；\n\n（2）回答旅游者关于餐食方面的疑问；\n\n（3）了解旅游者对菜肴是否满意，以便以后有针对性地进行调整和完善。","italian_answer":"Durante i pasti del gruppo, la guida locale deve controllare principalmente tre aspetti:\n1. verificare che i pasti forniti dal ristorante rispettino gli standard concordati;\n2. rispondere alle domande dei turisti sui pasti;\n3. capire se i turisti sono soddisfatti dei piatti, così da poter apportare modifiche e miglioramenti mirati in seguito.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"verificare che i pasti forniti dal ristorante rispettino gli standard concordati;","chinese":"监督检查餐厅提供的餐食是否符合约定标准；"},{"italian":"rispondere alle domande dei turisti sui pasti;","chinese":"回答旅游者关于餐食方面的疑问；"},{"italian":"capire se i turisti sono soddisfatti dei piatti, così da poter apportare modifiche e miglioramenti mirati in seguito.","chinese":"了解旅游者对菜肴是否满意，以便以后有针对性地进行调整和完善。"}]},{"category":"规范知识","number":6,"question":"欢送词的主要内容包括哪几点？","answer":"（1）回顾语：回顾行程，加深旅游者对这次旅游经历的体验；\n\n（2）感谢语和致歉语：对旅游者及领队、全陪、司机的合作表示感谢，若服务有不尽如人意之处，借此机会表示真诚的歉意；\n\n（3）征求意见语：征求旅游者对本次旅游服务的意见和建议；\n\n（4）惜别语：表达友谊和惜别之情；\n\n（5）祝愿语：表达美好的祝愿，期盼重逢。","italian_answer":"Il discorso di congedo comprende cinque elementi:\n1. un riepilogo dell’itinerario, per rafforzare il ricordo dell’esperienza;\n2. ringraziamenti e scuse, rivolti ai turisti, al capogruppo, alla guida accompagnatrice e all’autista per la collaborazione, con scuse sincere per eventuali servizi insoddisfacenti;\n3. la richiesta di opinioni e suggerimenti sul servizio;\n4. parole di amicizia e di commiato;\n5. auguri e la speranza di incontrarsi di nuovo.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"un riepilogo dell’itinerario, per rafforzare il ricordo dell’esperienza;","chinese":"回顾语：回顾行程，加深旅游者对这次旅游经历的体验；"},{"italian":"ringraziamenti e scuse, rivolti ai turisti, al capogruppo, alla guida accompagnatrice e all’autista per la collaborazione, con scuse sincere per eventuali servizi insoddisfacenti;","chinese":"感谢语和致歉语：对旅游者及领队、全陪、司机的合作表示感谢，若服务有不尽如人意之处，借此机会表示真诚的歉意；"},{"italian":"la richiesta di opinioni e suggerimenti sul servizio;","chinese":"征求意见语：征求旅游者对本次旅游服务的意见和建议；"},{"italian":"parole di amicizia e di commiato;","chinese":"惜别语：表达友谊和惜别之情；"},{"italian":"auguri e la speranza di incontrarsi di nuovo.","chinese":"祝愿语：表达美好的祝愿，期盼重逢。"}]},{"category":"规范知识","number":7,"question":"旅游车赴景点途中，地陪应进行途中导游服务，主要包含哪些环节？","answer":"（1）宣布当日活动日程；\n\n（2）沿途风光导游；\n\n（3）组织途中活动；\n\n（4）景点概况介绍。","italian_answer":"Durante il tragitto in pullman verso un’attrazione, il servizio di guida comprende quattro fasi:\n1. comunicare il programma delle attività della giornata;\n2. illustrare il paesaggio lungo il percorso;\n3. organizzare attività durante il tragitto;\n4. presentare una panoramica dell’attrazione.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"comunicare il programma delle attività della giornata;","chinese":"宣布当日活动日程；"},{"italian":"illustrare il paesaggio lungo il percorso;","chinese":"沿途风光导游；"},{"italian":"organizzare attività durante il tragitto;","chinese":"组织途中活动；"},{"italian":"presentare una panoramica dell’attrazione.","chinese":"景点概况介绍。"}]},{"category":"规范知识","number":8,"question":"地陪导游在景区内的服务主要包含哪些环节？","answer":"（1）强调集合时间、地点，提醒游览注意事项；\n\n（2）购票或取票入园；\n\n（3）在景区内开展导游讲解，并注意清点团队人数；\n\n（4）处理突发事件；\n\n（5）景区游览时，地陪导游应全程随团服务。","italian_answer":"All’interno dell’area turistica, il servizio della guida locale comprende cinque aspetti:\n1. ricordare l’orario e il luogo dell’appuntamento e le precauzioni per la visita;\n2. acquistare o ritirare i biglietti ed entrare nell’area;\n3. fare la spiegazione guidata e contare i partecipanti;\n4. gestire gli imprevisti;\n5. accompagnare il gruppo per tutta la visita.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"ricordare l’orario e il luogo dell’appuntamento e le precauzioni per la visita;","chinese":"强调集合时间、地点，提醒游览注意事项；"},{"italian":"acquistare o ritirare i biglietti ed entrare nell’area;","chinese":"购票或取票入园；"},{"italian":"fare la spiegazione guidata e contare i partecipanti;","chinese":"在景区内开展导游讲解，并注意清点团队人数；"},{"italian":"gestire gli imprevisti;","chinese":"处理突发事件；"},{"italian":"accompagnare il gruppo per tutta la visita.","chinese":"景区游览时，地陪导游应全程随团服务。"}]},{"category":"规范知识","number":9,"question":"地陪导游提供的送行服务，主要包括哪些环节？","answer":"（1）致欢送词；\n\n（2）提前到达机场、车站或码头；\n\n（3）提醒注意事项；\n\n（4）协助办理离站手续；\n\n（5）送别旅游者；\n\n（6）安排好结算事宜。","italian_answer":"Il servizio di accompagnamento alla partenza comprende sei fasi:\n1. pronunciare il discorso di congedo;\n2. arrivare in anticipo all’aeroporto, alla stazione o al porto;\n3. ricordare ai turisti le precauzioni necessarie;\n4. assisterli nelle procedure di partenza;\n5. salutarli;\n6. organizzare le operazioni di saldo e pagamento.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"pronunciare il discorso di congedo;","chinese":"致欢送词；"},{"italian":"arrivare in anticipo all’aeroporto, alla stazione o al porto;","chinese":"提前到达机场、车站或码头；"},{"italian":"ricordare ai turisti le precauzioni necessarie;","chinese":"提醒注意事项；"},{"italian":"assisterli nelle procedure di partenza;","chinese":"协助办理离站手续；"},{"italian":"salutarli;","chinese":"送别旅游者；"},{"italian":"organizzare le operazioni di saldo e pagamento.","chinese":"安排好结算事宜。"}]},{"category":"规范知识","number":10,"question":"全陪导游在陪同团队过程中，应做好哪些工作？","answer":"（1）实施旅游接待计划；\n\n（2）做好联络工作；\n\n（3）做好组织协调工作；\n\n（4）维护安全，处理问题；\n\n（5）宣传、调研工作。","italian_answer":"Durante l’accompagnamento del gruppo, la guida che segue il viaggio dall’inizio alla fine deve:\n1. attuare il programma dei servizi turistici;\n2. curare i collegamenti e le comunicazioni;\n3. organizzare e coordinare le attività;\n4. tutelare la sicurezza e gestire i problemi;\n5. svolgere attività di informazione e ricerca.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"attuare il programma dei servizi turistici;","chinese":"实施旅游接待计划；"},{"italian":"curare i collegamenti e le comunicazioni;","chinese":"做好联络工作；"},{"italian":"organizzare e coordinare le attività;","chinese":"做好组织协调工作；"},{"italian":"tutelare la sicurezza e gestire i problemi;","chinese":"维护安全，处理问题；"},{"italian":"svolgere attività di informazione e ricerca.","chinese":"宣传、调研工作。"}]},{"category":"规范知识","number":11,"question":"导游在处理旅游者的个别要求时，一般需要遵循哪些基本原则？","answer":"（1）遵循法律、法规和标准的原则；\n\n（2）维护尊严原则；\n\n（3）尽量满足旅游者合理要求的原则；\n\n（4）尊重旅游者，不卑不亢的原则。","italian_answer":"Nel gestire le richieste individuali dei turisti, la guida deve seguire quattro principi:\n1. rispettare le leggi, i regolamenti e gli standard;\n2. tutelare la dignità;\n3. cercare di soddisfare, per quanto possibile, le richieste ragionevoli dei turisti;\n4. rispettare i turisti, mantenendo un atteggiamento dignitoso ed equilibrato.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"rispettare le leggi, i regolamenti e gli standard;","chinese":"遵循法律、法规和标准的原则；"},{"italian":"tutelare la dignità;","chinese":"维护尊严原则；"},{"italian":"cercare di soddisfare, per quanto possibile, le richieste ragionevoli dei turisti;","chinese":"尽量满足旅游者合理要求的原则；"},{"italian":"rispettare i turisti, mantenendo un atteggiamento dignitoso ed equilibrato.","chinese":"尊重旅游者，不卑不亢的原则。"}]},{"category":"规范知识","number":12,"question":"旅游活动计划和日程的变更主要表现为哪三种结果？","answer":"（1）延长在当地的旅游日程；\n\n（2）缩短在当地的游览日程；\n\n（3）被迫改变部分行程计划。","italian_answer":"Le modifiche al programma e all’itinerario turistico possono produrre tre risultati:\n1. prolungare il soggiorno nella località;\n2. abbreviare il periodo di visita nella località;\n3. modificare forzatamente una parte dell’itinerario previsto.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"prolungare il soggiorno nella località;","chinese":"延长在当地的旅游日程；"},{"italian":"abbreviare il periodo di visita nella località;","chinese":"缩短在当地的游览日程；"},{"italian":"modificare forzatamente una parte dell’itinerario previsto.","chinese":"被迫改变部分行程计划。"}]},{"category":"规范知识","number":13,"question":"地陪在首站赴饭店途中的导游服务主要包含哪些环节？","answer":"（1）致欢迎词；\n\n（2）行程介绍：说明行程相关事项；\n\n（3）沿途导游：介绍当地概况、沿途风光和下榻饭店。","italian_answer":"Durante il tragitto dalla prima località di visita all’hotel, il servizio della guida locale comprende:\n1. il discorso di benvenuto;\n2. la presentazione dell’itinerario e delle relative informazioni;\n3. la spiegazione lungo il percorso, con informazioni sulla località, sul paesaggio e sull’hotel in cui il gruppo alloggerà.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"il discorso di benvenuto;","chinese":"致欢迎词；"},{"italian":"la presentazione dell’itinerario e delle relative informazioni;","chinese":"行程介绍：说明行程相关事项；"},{"italian":"la spiegazione lungo il percorso, con informazioni sulla località, sul paesaggio e sull’hotel in cui il gruppo alloggerà.","chinese":"沿途导游：介绍当地概况、沿途风光和下榻饭店。"}]},{"category":"规范知识","number":14,"question":"出境旅游服务中，领队的主要职责有哪些？","answer":"（1）介绍情况、全程陪同；\n\n（2）带领旅游团队完成出入境通关手续；\n\n（3）落实旅游合同和把控服务质量；\n\n（4）沟通协调和应急处置；\n\n（5）文明引导与国家形象维护。","italian_answer":"Nel servizio dei viaggi all’estero, i principali compiti dell’accompagnatore turistico sono cinque:\n1. presentare le informazioni e accompagnare il gruppo per tutto il viaggio;\n2. guidare il gruppo nelle procedure di controllo alle frontiere in uscita e in entrata;\n3. attuare il contratto di viaggio e controllare la qualità dei servizi;\n4. comunicare, coordinare e gestire le emergenze;\n5. promuovere un comportamento civile e tutelare l’immagine del Paese.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"presentare le informazioni e accompagnare il gruppo per tutto il viaggio;","chinese":"介绍情况、全程陪同；"},{"italian":"guidare il gruppo nelle procedure di controllo alle frontiere in uscita e in entrata;","chinese":"带领旅游团队完成出入境通关手续；"},{"italian":"attuare il contratto di viaggio e controllare la qualità dei servizi;","chinese":"落实旅游合同和把控服务质量；"},{"italian":"comunicare, coordinare e gestire le emergenze;","chinese":"沟通协调和应急处置；"},{"italian":"promuovere un comportamento civile e tutelare l’immagine del Paese.","chinese":"文明引导与国家形象维护。"}]},{"category":"规范知识","number":15,"question":"导游可以从哪几个主要方面了解旅游者的心理？","answer":"（1）从国籍、职业、年龄、性别和社会地位了解旅游者的心理；\n\n（2）从旅游动机了解旅游者的心理；\n\n（3）从旅游活动不同阶段的表现了解旅游者的心理。","italian_answer":"La guida può comprendere la psicologia dei turisti da tre punti di vista:\n1. nazionalità, professione, età, sesso e posizione sociale;\n2. motivazioni del viaggio;\n3. comportamenti mostrati nelle diverse fasi dell’attività turistica.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"nazionalità, professione, età, sesso e posizione sociale;","chinese":"从国籍、职业、年龄、性别和社会地位了解旅游者的心理；"},{"italian":"motivazioni del viaggio;","chinese":"从旅游动机了解旅游者的心理；"},{"italian":"comportamenti mostrati nelle diverse fasi dell’attività turistica.","chinese":"从旅游活动不同阶段的表现了解旅游者的心理。"}]},{"category":"规范知识","number":16,"question":"团队中领队、全陪、地陪和司机该如何友好合作，才能更好地完成接待任务？","answer":"（1）尊重并支持彼此的工作；\n\n（2）保持有效沟通；\n\n（3）生活上互相照顾；\n\n（4）出现问题时，以合同为依据，据理分析，避免正面冲突。","italian_answer":"Per collaborare bene e portare a termine il servizio, il capogruppo, la guida che accompagna il viaggio, la guida locale e l’autista dovrebbero:\n1. rispettare e sostenere il lavoro gli uni degli altri;\n2. mantenere una comunicazione efficace;\n3. aiutarsi reciprocamente nella vita quotidiana;\n4. in caso di problemi, basarsi sul contratto, analizzare la situazione con ragioni fondate ed evitare lo scontro diretto.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"rispettare e sostenere il lavoro gli uni degli altri;","chinese":"尊重并支持彼此的工作；"},{"italian":"mantenere una comunicazione efficace;","chinese":"保持有效沟通；"},{"italian":"aiutarsi reciprocamente nella vita quotidiana;","chinese":"生活上互相照顾；"},{"italian":"in caso di problemi, basarsi sul contratto, analizzare la situazione con ragioni fondate ed evitare lo scontro diretto.","chinese":"出现问题时，以合同为依据，据理分析，避免正面冲突。"}]},{"category":"规范知识","number":17,"question":"在工作当中，导游会接触到各种不同类型的团队，主要有哪些团型？","answer":"（1）亲子团；\n\n（2）政务团；\n\n（3）商务团；\n\n（4）研学团；\n\n（5）老年团；\n\n（6）其他团型。","italian_answer":"Nel lavoro, le guide possono incontrare diversi tipi di gruppi, tra cui:\n1. gruppi familiari con bambini;\n2. delegazioni istituzionali;\n3. gruppi commerciali;\n4. gruppi di studio e apprendimento;\n5. gruppi di turisti anziani;\n6. altri tipi di gruppi.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"gruppi familiari con bambini;","chinese":"亲子团；"},{"italian":"delegazioni istituzionali;","chinese":"政务团；"},{"italian":"gruppi commerciali;","chinese":"商务团；"},{"italian":"gruppi di studio e apprendimento;","chinese":"研学团；"},{"italian":"gruppi di turisti anziani;","chinese":"老年团；"},{"italian":"altri tipi di gruppi.","chinese":"其他团型。"}]},{"category":"规范知识","number":18,"question":"作为政务型团队的导游，应在哪些方面多加留意？","answer":"（1）仪容仪表宜端庄；\n\n（2）接待礼仪宜规范；\n\n（3）讲解内容宜精要；\n\n（4）保密要求需重视。","italian_answer":"La guida di una delegazione istituzionale deve prestare particolare attenzione a quattro aspetti:\n1. mantenere un aspetto dignitoso e appropriato;\n2. rispettare le norme del protocollo di accoglienza;\n3. fornire spiegazioni concise ed essenziali;\n4. prestare attenzione agli obblighi di riservatezza.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"mantenere un aspetto dignitoso e appropriato;","chinese":"仪容仪表宜端庄；"},{"italian":"rispettare le norme del protocollo di accoglienza;","chinese":"接待礼仪宜规范；"},{"italian":"fornire spiegazioni concise ed essenziali;","chinese":"讲解内容宜精要；"},{"italian":"prestare attenzione agli obblighi di riservatezza.","chinese":"保密要求需重视。"}]},{"category":"规范知识","number":19,"question":"导游在研学团接待中应把握哪些服务要点？","answer":"（1）掌握必要的教育知识和教学方法；\n\n（2）区分讲解与研学指导的不同功能；\n\n（3）重视言传身教的作用；\n\n（4）牢记安全第一的理念。","italian_answer":"Nell’accoglienza di un gruppo di studio, la guida deve seguire quattro punti:\n1. possedere le conoscenze educative e i metodi didattici necessari;\n2. distinguere la funzione della spiegazione turistica da quella dell’accompagnamento didattico;\n3. dare importanza all’esempio personale e all’insegnamento attraverso il comportamento;\n4. ricordare sempre che la sicurezza viene prima di tutto.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"possedere le conoscenze educative e i metodi didattici necessari;","chinese":"掌握必要的教育知识和教学方法；"},{"italian":"distinguere la funzione della spiegazione turistica da quella dell’accompagnamento didattico;","chinese":"区分讲解与研学指导的不同功能；"},{"italian":"dare importanza all’esempio personale e all’insegnamento attraverso il comportamento;","chinese":"重视言传身教的作用；"},{"italian":"ricordare sempre che la sicurezza viene prima di tutto.","chinese":"牢记安全第一的理念。"}]},{"category":"规范知识","number":20,"question":"导游可以从哪几个方面做好银发旅游团队的服务工作？","answer":"（1）妥善安排行程；\n\n（2）多做提醒工作；\n\n（3）耐心做好讲解；\n\n（4）关注健康安全。","italian_answer":"Per assistere al meglio un gruppo di turisti anziani, la guida può intervenire in quattro modi:\n1. organizzare con cura l’itinerario;\n2. fornire più promemoria e avvertimenti;\n3. spiegare con pazienza;\n4. prestare attenzione alla salute e alla sicurezza.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"organizzare con cura l’itinerario;","chinese":"妥善安排行程；"},{"italian":"fornire più promemoria e avvertimenti;","chinese":"多做提醒工作；"},{"italian":"spiegare con pazienza;","chinese":"耐心做好讲解；"},{"italian":"prestare attenzione alla salute e alla sicurezza.","chinese":"关注健康安全。"}]},{"category":"规范知识","number":21,"question":"导游应善于激发旅游者的游玩兴致，常用方法有哪些？","answer":"（1）以具体形象激发游兴；\n\n（2）以讲解技巧激发游兴；\n\n（3）以文娱活动激发游兴；\n\n（4）以图文声像激发游兴。","italian_answer":"La guida dovrebbe saper stimolare l’interesse dei turisti alla visita. I metodi più comuni sono: usare immagini concrete; utilizzare tecniche di spiegazione; organizzare attività ricreative; servirsi di immagini, testi, audio e video.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"La guida dovrebbe saper stimolare l’interesse dei turisti alla visita. I metodi più comuni sono: usare immagini concrete; utilizzare tecniche di spiegazione; organizzare attività ricreative; servirsi di immagini, testi, audio e video.","chinese":"（1）以具体形象激发游兴；\n\n（2）以讲解技巧激发游兴；\n\n（3）以文娱活动激发游兴；\n\n（4）以图文声像激发游兴。"}]},{"category":"规范知识","number":22,"question":"面对纷繁复杂的旅游团队接待纠纷，导游应坚持哪些处理原则？","answer":"（1）遵循合同，防止矛盾扩大化，处理问题应有理、有利、有节；\n\n（2）做好记录，保存证据，以利善后工作；\n\n（3）尽量保障旅游团（者）后续行程的执行，减少企业经济损失。","italian_answer":"Di fronte a controversie complesse durante l’accoglienza di un gruppo, la guida deve seguire questi principi: rispettare il contratto e impedire che il conflitto si aggravi, gestendo la questione con ragionevolezza, vantaggio e misura; registrare i fatti e conservare le prove per la gestione successiva; cercare di garantire la prosecuzione dell’itinerario del gruppo e ridurre le perdite economiche dell’impresa.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Di fronte a controversie complesse durante l’accoglienza di un gruppo, la guida deve seguire questi principi: rispettare il contratto e impedire che il conflitto si aggravi, gestendo la questione con ragionevolezza, vantaggio e misura; registrare i fatti e conservare le prove per la gestione successiva; cercare di garantire la prosecuzione dell’itinerario del gruppo e ridurre le perdite economiche dell’impresa.","chinese":"（1）遵循合同，防止矛盾扩大化，处理问题应有理、有利、有节；\n\n（2）做好记录，保存证据，以利善后工作；\n\n（3）尽量保障旅游团（者）后续行程的执行，减少企业经济损失。"}]},{"category":"规范知识","number":23,"question":"导游应当善于运用不同的观景赏美方法，常用的观赏方法有哪些？","answer":"（1）动态观赏与静态观赏；\n\n（2）观赏角度与观赏距离；\n\n（3）观赏时机与观赏节奏。","italian_answer":"La guida dovrebbe utilizzare diversi metodi per apprezzare il paesaggio e la bellezza: osservazione dinamica e statica; scelta dell’angolo e della distanza di osservazione; scelta del momento e del ritmo della visita.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"La guida dovrebbe utilizzare diversi metodi per apprezzare il paesaggio e la bellezza: osservazione dinamica e statica; scelta dell’angolo e della distanza di osservazione; scelta del momento e del ritmo della visita.","chinese":"（1）动态观赏与静态观赏；\n\n（2）观赏角度与观赏距离；\n\n（3）观赏时机与观赏节奏。"}]},{"category":"规范知识","number":24,"question":"2018年1月1日起施行的《导游管理办法》第二十六条规定，导游在执业过程中，人格尊严受到尊重，人身安全不受侵犯，合法权益受到保障。导游有权拒绝旅行社和旅游者的哪些要求？","answer":"（1）侮辱其人格尊严的要求；\n\n（2）违反其职业道德的要求；\n\n（3）不符合我国民族风俗习惯的要求；\n\n（4）可能危害其人身安全的要求；\n\n（5）其他违反法律、法规和规章规定的要求。","italian_answer":"Ai sensi dell’articolo 26 del Regolamento sulla gestione delle guide turistiche, in vigore dal 1º gennaio 2018, durante l’attività professionale la dignità personale della guida deve essere rispettata, la sua sicurezza personale tutelata e i suoi diritti legittimi garantiti. La guida può rifiutare richieste che: offendano la sua dignità; violino l’etica professionale; non rispettino gli usi e i costumi delle etnie cinesi; possano mettere in pericolo la sua sicurezza personale; oppure violino altre leggi, regolamenti o disposizioni.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Ai sensi dell’articolo 26 del Regolamento sulla gestione delle guide turistiche, in vigore dal 1º gennaio 2018, durante l’attività professionale la dignità personale della guida deve essere rispettata, la sua sicurezza personale tutelata e i suoi diritti legittimi garantiti. La guida può rifiutare richieste che: offendano la sua dignità; violino l’etica professionale; non rispettino gli usi e i costumi delle etnie cinesi; possano mettere in pericolo la sua sicurezza personale; oppure violino altre leggi, regolamenti o disposizioni.","chinese":"（1）侮辱其人格尊严的要求；\n\n（2）违反其职业道德的要求；\n\n（3）不符合我国民族风俗习惯的要求；\n\n（4）可能危害其人身安全的要求；\n\n（5）其他违反法律、法规和规章规定的要求。"}]},{"category":"规范知识","number":25,"question":"导游进行文明旅游宣讲时，具体内容包括哪些？","answer":"（1）法律法规；\n\n（2）风俗禁忌；\n\n（3）绿色环保；\n\n（4）礼仪规范；\n\n（5）诚信善意。","italian_answer":"Quando promuove il turismo civile e responsabile, la guida deve trattare cinque temi: leggi e regolamenti; usi, costumi e divieti; tutela dell’ambiente; norme di comportamento; onestà e gentilezza.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Quando promuove il turismo civile e responsabile, la guida deve trattare cinque temi: leggi e regolamenti; usi, costumi e divieti; tutela dell’ambiente; norme di comportamento; onestà e gentilezza.","chinese":"（1）法律法规；\n\n（2）风俗禁忌；\n\n（3）绿色环保；\n\n（4）礼仪规范；\n\n（5）诚信善意。"}]},{"category":"规范知识","number":26,"question":"2018年1月1日起施行的《导游管理办法》第二十四条规定，旅游突发事件发生后，导游应当立即采取哪些必要的处置措施？","answer":"（1）立即报告：向本单位负责人报告，情况紧急或者发生重大、特别重大旅游突发事件时，可以直接向发生地、旅行社所在地县级以上旅游主管部门、安全生产监督管理部门和负有安全生产监督管理职责的其他相关部门报告；\n\n（2）救助旅游者：救助或者协助救助受困旅游者；\n\n（3）采取避险措施：根据旅行社、旅游主管部门及有关机构的要求，采取调整或者中止行程、停止带团前往风险区域、撤离风险区域等避险措施。","italian_answer":"Ai sensi dell’articolo 24 del Regolamento sulla gestione delle guide turistiche, in vigore dal 1º gennaio 2018, dopo un’emergenza turistica la guida deve adottare immediatamente le misure necessarie: 1. segnalare subito l’accaduto al responsabile della propria organizzazione; in caso di urgenza o di eventi gravi o particolarmente gravi, può riferire direttamente anche alle autorità turistiche competenti a livello di contea o superiore, alle autorità di supervisione della sicurezza sul lavoro e agli altri dipartimenti competenti del luogo dell’evento o della sede dell’agenzia; 2. soccorrere i turisti in difficoltà o collaborare al loro soccorso; 3. adottare misure di sicurezza secondo le indicazioni dell’agenzia, delle autorità turistiche e degli enti competenti, come modificare o interrompere l’itinerario, non condurre il gruppo in zone a rischio o evacuare tali zone.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Ai sensi dell’articolo 24 del Regolamento sulla gestione delle guide turistiche, in vigore dal 1º gennaio 2018, dopo un’emergenza turistica la guida deve adottare immediatamente le misure necessarie: 1. segnalare subito l’accaduto al responsabile della propria organizzazione; in caso di urgenza o di eventi gravi o particolarmente gravi, può riferire direttamente anche alle autorità turistiche competenti a livello di contea o superiore, alle autorità di supervisione della sicurezza sul lavoro e agli altri dipartimenti competenti del luogo dell’evento o della sede dell’agenzia; 2. soccorrere i turisti in difficoltà o collaborare al loro soccorso; 3. adottare misure di sicurezza secondo le indicazioni dell’agenzia, delle autorità turistiche e degli enti competenti, come modificare o interrompere l’itinerario, non condurre il gruppo in zone a rischio o evacuare tali zone.","chinese":"（1）立即报告：向本单位负责人报告，情况紧急或者发生重大、特别重大旅游突发事件时，可以直接向发生地、旅行社所在地县级以上旅游主管部门、安全生产监督管理部门和负有安全生产监督管理职责的其他相关部门报告；\n\n（2）救助旅游者：救助或者协助救助受困旅游者；\n\n（3）采取避险措施：根据旅行社、旅游主管部门及有关机构的要求，采取调整或者中止行程、停止带团前往风险区域、撤离风险区域等避险措施。"}]},{"category":"规范知识","number":27,"question":"导游讲解是一门说话的艺术，实施中必须遵循哪些原则？","answer":"（1）客观性原则；\n\n（2）针对性原则；\n\n（3）计划性原则；\n\n（4）灵活性原则。","italian_answer":"La spiegazione turistica è un’arte del parlare e deve rispettare quattro principi: obiettività; adeguatezza al pubblico e alla situazione; pianificazione; flessibilità.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"La spiegazione turistica è un’arte del parlare e deve rispettare quattro principi: obiettività; adeguatezza al pubblico e alla situazione; pianificazione; flessibilità.","chinese":"（1）客观性原则；\n\n（2）针对性原则；\n\n（3）计划性原则；\n\n（4）灵活性原则。"}]},{"category":"规范知识","number":28,"question":"导游语言的基本要求有哪些？","answer":"（1）准确性；\n\n（2）通俗性；\n\n（3）清晰性；\n\n（4）生动性。","italian_answer":"Il linguaggio della guida deve avere quattro caratteristiche: accuratezza; semplicità e comprensibilità; chiarezza; vivacità.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Il linguaggio della guida deve avere quattro caratteristiche: accuratezza; semplicità e comprensibilità; chiarezza; vivacità.","chinese":"（1）准确性；\n\n（2）通俗性；\n\n（3）清晰性；\n\n（4）生动性。"}]},{"category":"规范知识","number":29,"question":"导游口头语言的表达要领有哪些方面？","answer":"（1）音量大小适度；\n\n（2）语速快慢相宜；\n\n（3）语调高低有序；\n\n（4）停顿长短合理。","italian_answer":"Nell’espressione orale, la guida deve curare quattro aspetti: volume della voce adeguato; velocità del parlato appropriata; intonazione ben regolata; pause di durata ragionevole.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Nell’espressione orale, la guida deve curare quattro aspetti: volume della voce adeguato; velocità del parlato appropriata; intonazione ben regolata; pause di durata ragionevole.","chinese":"（1）音量大小适度；\n\n（2）语速快慢相宜；\n\n（3）语调高低有序；\n\n（4）停顿长短合理。"}]},{"category":"规范知识","number":30,"question":"导游讲解中的手势主要有哪三种？","answer":"（1）情感手势；\n\n（2）指示手势；\n\n（3）象形手势。","italian_answer":"I gesti usati durante la spiegazione turistica si dividono principalmente in tre tipi: gesti emotivi; gesti indicativi; gesti descrittivi o imitativi.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"I gesti usati durante la spiegazione turistica si dividono principalmente in tre tipi: gesti emotivi; gesti indicativi; gesti descrittivi o imitativi.","chinese":"（1）情感手势；\n\n（2）指示手势；\n\n（3）象形手势。"}]},{"category":"规范知识","number":31,"question":"导游交际语言是导游与旅游者交往时的一种语言形式，它主要包括哪些形式？","answer":"（1）称谓语言；\n\n（2）自我介绍；\n\n（3）交谈语言；\n\n（4）劝慰语言；\n\n（5）拒绝语言等。","italian_answer":"Il linguaggio di relazione della guida con i turisti comprende principalmente: formule di appellativo; presentazione di sé; conversazione; parole di conforto; formule di rifiuto e altre forme simili.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Il linguaggio di relazione della guida con i turisti comprende principalmente: formule di appellativo; presentazione di sé; conversazione; parole di conforto; formule di rifiuto e altre forme simili.","chinese":"（1）称谓语言；\n\n（2）自我介绍；\n\n（3）交谈语言；\n\n（4）劝慰语言；\n\n（5）拒绝语言等。"}]},{"category":"规范知识","number":32,"question":"导游工作中，交谈的重要性不能被忽视，导游提升交谈技巧主要有哪些？","answer":"（1）开头应寒暄；\n\n（2）说话应真诚；\n\n（3）内容应健康；\n\n（4）应多听少说；\n\n（5）应把握谈话过程。","italian_answer":"Per migliorare le capacità di conversazione, la guida dovrebbe: iniziare con convenevoli; parlare con sincerità; trattare argomenti appropriati e positivi; ascoltare più e parlare meno; gestire bene lo svolgimento della conversazione.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Per migliorare le capacità di conversazione, la guida dovrebbe: iniziare con convenevoli; parlare con sincerità; trattare argomenti appropriati e positivi; ascoltare più e parlare meno; gestire bene lo svolgimento della conversazione.","chinese":"（1）开头应寒暄；\n\n（2）说话应真诚；\n\n（3）内容应健康；\n\n（4）应多听少说；\n\n（5）应把握谈话过程。"}]},{"category":"规范知识","number":33,"question":"对于旅游者提出的不合理或者难以办到的要求时，导游应当学会拒绝，拒绝的方式有哪些？","answer":"（1）正当回绝法；\n\n（2）期待方案法；\n\n（3）婉转拒绝法；\n\n（4）拖延时间法。","italian_answer":"Quando un turista formula una richiesta irragionevole o difficile da soddisfare, la guida deve saper rifiutare. I metodi sono: rifiuto motivato e diretto; proposta di un’alternativa o di una soluzione futura; rifiuto diplomatico; rinvio della risposta.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Quando un turista formula una richiesta irragionevole o difficile da soddisfare, la guida deve saper rifiutare. I metodi sono: rifiuto motivato e diretto; proposta di un’alternativa o di una soluzione futura; rifiuto diplomatico; rinvio della risposta.","chinese":"（1）正当回绝法；\n\n（2）期待方案法；\n\n（3）婉转拒绝法；\n\n（4）拖延时间法。"}]},{"category":"规范知识","number":34,"question":"导游在回答旅游者提出的问题时，可有效运用哪几种方法？","answer":"（1）是非分明式；\n\n（2）以问为答式；\n\n（3）曲迂回避式；\n\n（4）诱导否定式。","italian_answer":"Nel rispondere alle domande dei turisti, la guida può utilizzare efficacemente questi metodi: risposta netta distinguendo ciò che è giusto da ciò che è sbagliato; risposta sotto forma di domanda; risposta indiretta o evasiva; guida del dialogo verso una conclusione negativa.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Nel rispondere alle domande dei turisti, la guida può utilizzare efficacemente questi metodi: risposta netta distinguendo ciò che è giusto da ciò che è sbagliato; risposta sotto forma di domanda; risposta indiretta o evasiva; guida del dialogo verso una conclusione negativa.","chinese":"（1）是非分明式；\n\n（2）以问为答式；\n\n（3）曲迂回避式；\n\n（4）诱导否定式。"}]},{"category":"规范知识","number":35,"question":"导游应掌握一些必要的劝告技巧，主要有哪些方法？","answer":"（1）正面引导法；\n\n（2）侧面迂回法；\n\n（3）间接暗示法等。","italian_answer":"La guida dovrebbe conoscere alcune tecniche di persuasione: orientamento diretto e positivo; approccio indiretto; suggerimento implicito.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"La guida dovrebbe conoscere alcune tecniche di persuasione: orientamento diretto e positivo; approccio indiretto; suggerimento implicito.","chinese":"（1）正面引导法；\n\n（2）侧面迂回法；\n\n（3）间接暗示法等。"}]},{"category":"规范知识","number":36,"question":"导游在讲解中，要善于运用语言的停顿，主要的方式有哪些？","answer":"（1）语法停顿；\n\n（2）逻辑停顿；\n\n（3）感情停顿；\n\n（4）生理停顿。","italian_answer":"Durante la spiegazione, la guida dovrebbe usare opportunamente le pause. I tipi principali sono: pausa grammaticale; pausa logica; pausa emotiva; pausa fisiologica.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Durante la spiegazione, la guida dovrebbe usare opportunamente le pause. I tipi principali sono: pausa grammaticale; pausa logica; pausa emotiva; pausa fisiologica.","chinese":"（1）语法停顿；\n\n（2）逻辑停顿；\n\n（3）感情停顿；\n\n（4）生理停顿。"}]},{"category":"规范知识","number":37,"question":"问答法是导游讲解中较常用的方法，主要有哪些类型？","answer":"（1）自问自答；\n\n（2）我问客答；\n\n（3）客问我答；\n\n（4）客问客答。","italian_answer":"Il metodo delle domande e risposte, frequentemente usato nelle spiegazioni turistiche, comprende quattro tipi: la guida domanda e risponde; la guida domanda e il turista risponde; il turista domanda e la guida risponde; un turista domanda e un altro turista risponde.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Il metodo delle domande e risposte, frequentemente usato nelle spiegazioni turistiche, comprende quattro tipi: la guida domanda e risponde; la guida domanda e il turista risponde; il turista domanda e la guida risponde; un turista domanda e un altro turista risponde.","chinese":"（1）自问自答；\n\n（2）我问客答；\n\n（3）客问我答；\n\n（4）客问客答。"}]},{"category":"规范知识","number":38,"question":"我们通常将导游服务的方式划分为哪两大类？两者关系是怎样的？","answer":"（1）第一种是图文声像导游；\n\n（2）第二种是实地口语导游；\n\n（3）实际操作中，图文声像导游为辅，实地口语导游为主，前者为后者服务。","italian_answer":"Le modalità del servizio di guida turistica si dividono in due grandi categorie: guida con testi, immagini, audio e video; guida orale sul posto. Nella pratica, la prima è complementare, mentre la guida orale sul posto è predominante; la prima serve la seconda.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Le modalità del servizio di guida turistica si dividono in due grandi categorie: guida con testi, immagini, audio e video; guida orale sul posto. Nella pratica, la prima è complementare, mentre la guida orale sul posto è predominante; la prima serve la seconda.","chinese":"（1）第一种是图文声像导游；\n\n（2）第二种是实地口语导游；\n\n（3）实际操作中，图文声像导游为辅，实地口语导游为主，前者为后者服务。"}]},{"category":"规范知识","number":39,"question":"2018年1月1日起施行的《导游管理办法》第十二条规定，不予核发导游证的情况有哪些？","answer":"（1）无民事行为能力或者限制民事行为能力的；\n\n（2）患有甲类、乙类以及其他可能危害旅游者人身健康安全的传染性疾病的；\n\n（3）受过刑事处罚的，过失犯罪的除外；\n\n（4）被吊销导游证之日起未逾3年的。","italian_answer":"Ai sensi dell’articolo 12 del Regolamento sulla gestione delle guide turistiche, in vigore dal 1º gennaio 2018, la tessera di guida turistica non viene rilasciata nei seguenti casi: persone prive della capacità civile o con capacità civile limitata; persone affette da malattie infettive di categoria A o B o da altre malattie infettive che possano mettere a rischio la salute e la sicurezza personale dei turisti; persone che abbiano subito una condanna penale, fatta eccezione per i reati colposi; persone per le quali non siano ancora trascorsi tre anni dalla revoca della tessera di guida.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"Ai sensi dell’articolo 12 del Regolamento sulla gestione delle guide turistiche, in vigore dal 1º gennaio 2018, la tessera di guida turistica non viene rilasciata nei seguenti casi: persone prive della capacità civile o con capacità civile limitata; persone affette da malattie infettive di categoria A o B o da altre malattie infettive che possano mettere a rischio la salute e la sicurezza personale dei turisti; persone che abbiano subito una condanna penale, fatta eccezione per i reati colposi; persone per le quali non siano ancora trascorsi tre anni dalla revoca della tessera di guida.","chinese":"（1）无民事行为能力或者限制民事行为能力的；\n\n（2）患有甲类、乙类以及其他可能危害旅游者人身健康安全的传染性疾病的；\n\n（3）受过刑事处罚的，过失犯罪的除外；\n\n（4）被吊销导游证之日起未逾3年的。"}]},{"category":"规范知识","number":40,"question":"导游服务的实施具有哪些特点？","answer":"（1）工作独立性强；\n\n（2）脑体高度结合；\n\n（3）客观要求复杂；\n\n（4）文化交流频繁。","italian_answer":"L’attuazione del servizio di guida turistica presenta quattro caratteristiche: elevata autonomia lavorativa; stretta integrazione tra attività intellettuale e fisica; esigenze oggettive complesse; frequenti scambi culturali.","bilingual_pairing":"整段对照（原文结构不完全一致）","bilingual_pairs":[{"italian":"L’attuazione del servizio di guida turistica presenta quattro caratteristiche: elevata autonomia lavorativa; stretta integrazione tra attività intellettuale e fisica; esigenze oggettive complesse; frequenti scambi culturali.","chinese":"（1）工作独立性强；\n\n（2）脑体高度结合；\n\n（3）客观要求复杂；\n\n（4）文化交流频繁。"}]},{"category":"规范知识","number":41,"question":"导游服务原则是导游从事导游工作的出发点，它包含了哪些原则？","answer":"（1）以游客为本原则；\n\n（2）规范化服务原则；\n\n（3）平等待客原则；\n\n（4）个性化服务原则；\n\n（5）维护旅游者合法权益原则。","italian_answer":"I principi del servizio di guida turistica sono cinque:\n1. mettere i turisti al centro;\n2. fornire un servizio conforme agli standard;\n3. trattare tutti i turisti allo stesso modo;\n4. offrire un servizio personalizzato;\n5. tutelare i diritti e gli interessi legittimi dei turisti.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"mettere i turisti al centro;","chinese":"以游客为本原则；"},{"italian":"fornire un servizio conforme agli standard;","chinese":"规范化服务原则；"},{"italian":"trattare tutti i turisti allo stesso modo;","chinese":"平等待客原则；"},{"italian":"offrire un servizio personalizzato;","chinese":"个性化服务原则；"},{"italian":"tutelare i diritti e gli interessi legittimi dei turisti.","chinese":"维护旅游者合法权益原则。"}]},{"category":"规范知识","number":42,"question":"导游的基本工作职责有哪些？","answer":"（1）接受导游任务，引导文明旅游；\n\n（2）进行导游讲解，传播中国文化；\n\n（3）安排旅游事宜，保护旅游者安全；\n\n（4）反映意见要求，安排相关活动；\n\n（5）解答旅游者问询，处理相关问题。","italian_answer":"Le principali responsabilità professionali di una guida sono:\n1. accettare l’incarico e promuovere un turismo responsabile;\n2. illustrare i luoghi e diffondere la cultura cinese;\n3. organizzare le attività e garantire la sicurezza dei turisti;\n4. raccogliere le loro opinioni e richieste e organizzare le attività pertinenti;\n5. rispondere alle loro domande e gestire i problemi.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"accettare l’incarico e promuovere un turismo responsabile;","chinese":"接受导游任务，引导文明旅游；"},{"italian":"illustrare i luoghi e diffondere la cultura cinese;","chinese":"进行导游讲解，传播中国文化；"},{"italian":"organizzare le attività e garantire la sicurezza dei turisti;","chinese":"安排旅游事宜，保护旅游者安全；"},{"italian":"raccogliere le loro opinioni e richieste e organizzare le attività pertinenti;","chinese":"反映意见要求，安排相关活动；"},{"italian":"rispondere alle loro domande e gestire i problemi.","chinese":"解答旅游者问询，处理相关问题。"}]},{"category":"规范知识","number":43,"question":"地陪导游的职责有哪些？","answer":"（1）安排旅游活动；\n\n（2）做好接待工作；\n\n（3）进行导游讲解；\n\n（4）维护旅游者安全；\n\n（5）处理相关问题。","italian_answer":"Le responsabilità della guida locale comprendono:\n1. organizzare le attività turistiche;\n2. svolgere il servizio di accoglienza;\n3. fornire spiegazioni e illustrazioni;\n4. tutelare la sicurezza dei turisti;\n5. gestire i problemi pertinenti.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"organizzare le attività turistiche;","chinese":"安排旅游活动；"},{"italian":"svolgere il servizio di accoglienza;","chinese":"做好接待工作；"},{"italian":"fornire spiegazioni e illustrazioni;","chinese":"进行导游讲解；"},{"italian":"tutelare la sicurezza dei turisti;","chinese":"维护旅游者安全；"},{"italian":"gestire i problemi pertinenti.","chinese":"处理相关问题。"}]},{"category":"规范知识","number":44,"question":"作为一名优秀的导游，应当具有哪些思想素质？","answer":"（1）热爱祖国，践行社会主义核心价值观；\n\n（2）恪守职业道德，爱岗敬业，坚持旅游者为本，服务至诚；\n\n（3）秉承契约精神，按合同的约定提供导游服务，维护旅游者和旅行社的合法权益。","italian_answer":"Una guida eccellente deve possedere le seguenti qualità morali e professionali:\n1. amare la patria e mettere in pratica i valori fondamentali del socialismo;\n2. rispettare l’etica professionale, amare il proprio lavoro e mettere i turisti al primo posto, offrendo un servizio sincero;\n3. rispettare lo spirito del contratto, fornire il servizio secondo gli accordi e tutelare i diritti legittimi sia dei turisti sia dell’agenzia di viaggi.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"amare la patria e mettere in pratica i valori fondamentali del socialismo;","chinese":"热爱祖国，践行社会主义核心价值观；"},{"italian":"rispettare l’etica professionale, amare il proprio lavoro e mettere i turisti al primo posto, offrendo un servizio sincero;","chinese":"恪守职业道德，爱岗敬业，坚持旅游者为本，服务至诚；"},{"italian":"rispettare lo spirito del contratto, fornire il servizio secondo gli accordi e tutelare i diritti legittimi sia dei turisti sia dell’agenzia di viaggi.","chinese":"秉承契约精神，按合同的约定提供导游服务，维护旅游者和旅行社的合法权益。"}]},{"category":"规范知识","number":45,"question":"导游应该具备渊博的知识，这些知识主要包括哪些方面？","answer":"（1）旅游客源地和旅游目的地相关的法律法规常识、时事政治、经济、社会状况、历史、地理、文化和民族民俗知识以及心理学、美学知识；\n\n（2）旅行常识，包括旅行证件知识、领事保护知识、客货运知识、机票政策、海关及移民管理机关规定和必备的应急医疗常识；\n\n（3）旅游产品策划、线路设计方面的专业知识。","italian_answer":"Una guida deve possedere conoscenze ampie, che comprendono principalmente tre ambiti:\n1. leggi e regolamenti, attualità politica, economia, società, storia, geografia, cultura, usi e costumi dei luoghi di provenienza e di destinazione dei turisti, oltre a psicologia ed estetica;\n2. conoscenze pratiche di viaggio, come documenti, protezione consolare, trasporto di passeggeri e merci, politiche sui biglietti aerei, norme doganali e di immigrazione e nozioni di primo soccorso;\n3. conoscenze professionali sulla progettazione dei prodotti turistici e degli itinerari.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"leggi e regolamenti, attualità politica, economia, società, storia, geografia, cultura, usi e costumi dei luoghi di provenienza e di destinazione dei turisti, oltre a psicologia ed estetica;","chinese":"旅游客源地和旅游目的地相关的法律法规常识、时事政治、经济、社会状况、历史、地理、文化和民族民俗知识以及心理学、美学知识；"},{"italian":"conoscenze pratiche di viaggio, come documenti, protezione consolare, trasporto di passeggeri e merci, politiche sui biglietti aerei, norme doganali e di immigrazione e nozioni di primo soccorso;","chinese":"旅行常识，包括旅行证件知识、领事保护知识、客货运知识、机票政策、海关及移民管理机关规定和必备的应急医疗常识；"},{"italian":"conoscenze professionali sulla progettazione dei prodotti turistici e degli itinerari.","chinese":"旅游产品策划、线路设计方面的专业知识。"}]},{"category":"规范知识","number":46,"question":"作为一名合格的导游，应具备的技术技能主要有哪些？","answer":"（1）语言表达与专业讲解技能；\n\n（2）接待操作与应急应变技能；\n\n（3）现代信息技术运用技能。","italian_answer":"Una guida qualificata deve possedere principalmente tre tipi di competenze tecniche:\n1. capacità di espressione linguistica e di spiegazione professionale;\n2. capacità operative nell’accoglienza e capacità di affrontare emergenze e imprevisti;\n3. capacità di utilizzare le moderne tecnologie dell’informazione.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"capacità di espressione linguistica e di spiegazione professionale;","chinese":"语言表达与专业讲解技能；"},{"italian":"capacità operative nell’accoglienza e capacità di affrontare emergenze e imprevisti;","chinese":"接待操作与应急应变技能；"},{"italian":"capacità di utilizzare le moderne tecnologie dell’informazione.","chinese":"现代信息技术运用技能。"}]},{"category":"规范知识","number":47,"question":"导游根据实际情况灵活安排旅游活动时，应遵循哪些原则？","answer":"（1）游览节奏宜遵循“松紧相间、先紧后松”的原则；\n\n（2）游览顺序宜遵循“先远后近、先高后低”的原则；\n\n（3）游览安排宜遵循“快旅慢游、精彩在后”的原则。","italian_answer":"Quando organizza le attività in modo flessibile, la guida deve seguire tre principi:\n1. alternare momenti intensi e momenti tranquilli, con un ritmo più intenso all’inizio e più rilassato in seguito;\n2. visitare prima i luoghi più lontani e poi quelli più vicini, prima i punti più alti e poi quelli più bassi;\n3. viaggiare rapidamente tra le destinazioni e dedicare più tempo alle visite, lasciando le esperienze più belle alla parte finale.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"alternare momenti intensi e momenti tranquilli, con un ritmo più intenso all’inizio e più rilassato in seguito;","chinese":"游览节奏宜遵循“松紧相间、先紧后松”的原则；"},{"italian":"visitare prima i luoghi più lontani e poi quelli più vicini, prima i punti più alti e poi quelli più bassi;","chinese":"游览顺序宜遵循“先远后近、先高后低”的原则；"},{"italian":"viaggiare rapidamente tra le destinazioni e dedicare più tempo alle visite, lasciando le esperienze più belle alla parte finale.","chinese":"游览安排宜遵循“快旅慢游、精彩在后”的原则。"}]},{"category":"规范知识","number":48,"question":"途中导游的特点有哪些？","answer":"（1）导游讲解容量大；\n\n（2）导游讲解内容杂；\n\n（3）导游讲解方法活。","italian_answer":"La guida durante il tragitto presenta tre caratteristiche:\n1. può comprendere una grande quantità di informazioni;\n2. tratta argomenti molto vari;\n3. richiede metodi di spiegazione flessibili.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"può comprendere una grande quantità di informazioni;","chinese":"导游讲解容量大；"},{"italian":"tratta argomenti molto vari;","chinese":"导游讲解内容杂；"},{"italian":"richiede metodi di spiegazione flessibili.","chinese":"导游讲解方法活。"}]},{"category":"规范知识","number":49,"question":"地陪导游返程途中有哪些服务内容？","answer":"（1）回顾当天活动；\n\n（2）沿途风光导游；\n\n（3）宣布次日活动安排。","italian_answer":"Durante il viaggio di ritorno, la guida locale deve:\n1. ripercorrere le attività della giornata;\n2. illustrare i paesaggi lungo il percorso;\n3. annunciare il programma delle attività del giorno successivo.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"ripercorrere le attività della giornata;","chinese":"回顾当天活动；"},{"italian":"illustrare i paesaggi lungo il percorso;","chinese":"沿途风光导游；"},{"italian":"annunciare il programma delle attività del giorno successivo.","chinese":"宣布次日活动安排。"}]},{"category":"规范知识","number":50,"question":"导游在进行自然景观讲解时，应该如何向旅游者传达美的信息？","answer":"（1）准确抓住形式美；\n\n（2）有效突出文化美；\n\n（3）着力深化象征美。\n\n（4）注意引导意象美。","italian_answer":"Quando illustra un paesaggio naturale, la guida dovrebbe trasmetterne la bellezza in quattro modi:\n1. cogliere con precisione la bellezza delle forme;\n2. mettere efficacemente in risalto la bellezza culturale;\n3. approfondire la bellezza simbolica;\n4. guidare i turisti nella percezione delle immagini e delle suggestioni del paesaggio.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"cogliere con precisione la bellezza delle forme;","chinese":"准确抓住形式美；"},{"italian":"mettere efficacemente in risalto la bellezza culturale;","chinese":"有效突出文化美；"},{"italian":"approfondire la bellezza simbolica;","chinese":"着力深化象征美。"},{"italian":"guidare i turisti nella percezione delle immagini e delle suggestioni del paesaggio.","chinese":"注意引导意象美。"}]},{"category":"规范知识","number":51,"question":"导游语言的准确性基本要求有哪些具体表现？","answer":"（1）思想观点准确；\n\n（2）讲解内容准确；\n\n（3）遣词造句准确；\n\n（4）语音语调准确。","italian_answer":"La precisione del linguaggio della guida si manifesta in quattro aspetti:\n1. correttezza delle idee e dei punti di vista;\n2. accuratezza dei contenuti illustrati;\n3. scelta precisa delle parole e costruzione corretta delle frasi;\n4. pronuncia e intonazione corrette.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"correttezza delle idee e dei punti di vista;","chinese":"思想观点准确；"},{"italian":"accuratezza dei contenuti illustrati;","chinese":"讲解内容准确；"},{"italian":"scelta precisa delle parole e costruzione corretta delle frasi;","chinese":"遣词造句准确；"},{"italian":"pronuncia e intonazione corrette.","chinese":"语音语调准确。"}]},{"category":"规范知识","number":52,"question":"在接待残障旅游者时，导游须注意哪些方式方法？","answer":"（1）接待服务宜热情周到；\n\n（2）接待礼仪宜细致到位；\n\n（3）特殊照顾宜适时恰当。","italian_answer":"Quando assiste turisti con disabilità, la guida deve prestare attenzione a tre aspetti:\n1. offrire un’accoglienza calorosa e premurosa;\n2. curare attentamente le regole di comportamento e di cortesia;\n3. fornire attenzioni particolari al momento opportuno e in modo adeguato.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"offrire un’accoglienza calorosa e premurosa;","chinese":"接待服务宜热情周到；"},{"italian":"curare attentamente le regole di comportamento e di cortesia;","chinese":"接待礼仪宜细致到位；"},{"italian":"fornire attenzioni particolari al momento opportuno e in modo adeguato.","chinese":"特殊照顾宜适时恰当。"}]},{"category":"规范知识","number":53,"question":"导游要把古建筑景观讲解好，除了掌握必要的古建筑知识外，还应突出哪些重点？","answer":"（1）突出古建筑的功能性；\n\n（2）突出古建筑的风格特色；\n\n（3）突出古建筑的结构原理；\n\n（4）突出古建筑的精工技巧；\n\n（5）突出古建筑的历史文化意义。","italian_answer":"Per illustrare bene un edificio antico, oltre a conoscere l’architettura storica, la guida deve mettere in evidenza cinque aspetti:\n1. la funzione dell’edificio;\n2. il suo stile e le sue caratteristiche;\n3. i principi della sua struttura;\n4. la precisione e l’abilità delle tecniche costruttive;\n5. il suo significato storico e culturale.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"la funzione dell’edificio;","chinese":"突出古建筑的功能性；"},{"italian":"il suo stile e le sue caratteristiche;","chinese":"突出古建筑的风格特色；"},{"italian":"i principi della sua struttura;","chinese":"突出古建筑的结构原理；"},{"italian":"la precisione e l’abilità delle tecniche costruttive;","chinese":"突出古建筑的精工技巧；"},{"italian":"il suo significato storico e culturale.","chinese":"突出古建筑的历史文化意义。"}]},{"category":"规范知识","number":54,"question":"导游在讲解佛教建筑时，主要应从哪几个方面入手？","answer":"（1）讲清佛教建筑的基本格局；\n\n（2）讲清佛教建筑的艺术与工巧特征；\n\n（3）讲清佛教建筑所蕴含的优秀传统文化思想内涵。","italian_answer":"Quando illustra un edificio buddhista, la guida dovrebbe concentrarsi su tre aspetti:\n1. spiegare chiaramente la struttura e la disposizione di base dell’edificio;\n2. illustrare le sue caratteristiche artistiche e tecniche;\n3. spiegare i valori culturali tradizionali che esso esprime.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"spiegare chiaramente la struttura e la disposizione di base dell’edificio;","chinese":"讲清佛教建筑的基本格局；"},{"italian":"illustrare le sue caratteristiche artistiche e tecniche;","chinese":"讲清佛教建筑的艺术与工巧特征；"},{"italian":"spiegare i valori culturali tradizionali che esso esprime.","chinese":"讲清佛教建筑所蕴含的优秀传统文化思想内涵。"}]},{"category":"规范知识","number":55,"question":"导游在讲解石窟时，应抓住哪几个要点？","answer":"（1）开凿背景和历史意义；\n\n（2）表现手法与雕刻技法；\n\n（3）结构布局与典型特征；\n\n（4）重点龛窟或代表塑像。","italian_answer":"Quando illustra una grotta buddhista, la guida dovrebbe concentrarsi su quattro punti:\n1. il contesto della sua costruzione e il suo significato storico;\n2. le forme espressive e le tecniche scultoree;\n3. la disposizione degli spazi e le caratteristiche principali;\n4. le grotte più importanti o le statue rappresentative.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"il contesto della sua costruzione e il suo significato storico;","chinese":"开凿背景和历史意义；"},{"italian":"le forme espressive e le tecniche scultoree;","chinese":"表现手法与雕刻技法；"},{"italian":"la disposizione degli spazi e le caratteristiche principali;","chinese":"结构布局与典型特征；"},{"italian":"le grotte più importanti o le statue rappresentative.","chinese":"重点龛窟或代表塑像。"}]},{"category":"规范知识","number":56,"question":"导游在团队餐饮服务中应尽到哪些职责？","answer":"（1）协调职责；\n\n（2）监督职责；\n\n（3）保障职责；\n\n（4）讲解职责。","italian_answer":"Nel servizio di ristorazione per un gruppo, la guida ha quattro responsabilità:\n1. coordinare l’organizzazione dei pasti;\n2. svolgere attività di supervisione e controllo;\n3. garantire il servizio e l’assistenza necessari;\n4. presentare e illustrare i piatti e la cultura gastronomica, secondo il contesto.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"coordinare l’organizzazione dei pasti;","chinese":"协调职责；"},{"italian":"svolgere attività di supervisione e controllo;","chinese":"监督职责；"},{"italian":"garantire il servizio e l’assistenza necessari;","chinese":"保障职责；"},{"italian":"presentare e illustrare i piatti e la cultura gastronomica, secondo il contesto.","chinese":"讲解职责。"}]},{"category":"规范知识","number":57,"question":"导游带领商务旅游团时有哪些注意事项？","answer":"（1）注重高效性；\n\n（2）突出专业性；\n\n（3）把握灵活性。","italian_answer":"Quando accompagna un gruppo di turisti d’affari, la guida deve prestare attenzione a tre aspetti:\n1. garantire l’efficienza;\n2. mettere in evidenza la professionalità;\n3. mantenere la flessibilità.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"garantire l’efficienza;","chinese":"注重高效性；"},{"italian":"mettere in evidenza la professionalità;","chinese":"突出专业性；"},{"italian":"mantenere la flessibilità.","chinese":"把握灵活性。"}]},{"category":"规范知识","number":58,"question":"领队服务中的国外（地区）离境阶段主要包含哪些服务程序？","answer":"（1）办理离境乘机手续；\n\n（2）办理移民局离境手续；\n\n（3）办理海关手续；\n\n（4）办理购物退税手续；\n\n（5）引领旅游者登记。","italian_answer":"La fase di partenza dall’estero o da un’altra regione, nel servizio dell’accompagnatore turistico, comprende principalmente cinque procedure:\n1. svolgere le formalità di check-in e imbarco;\n2. completare le procedure di uscita presso l’ufficio immigrazione;\n3. svolgere le formalità doganali;\n4. completare le procedure per il rimborso delle tasse sugli acquisti;\n5. accompagnare i turisti all’imbarco.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"svolgere le formalità di check-in e imbarco;","chinese":"办理离境乘机手续；"},{"italian":"completare le procedure di uscita presso l’ufficio immigrazione;","chinese":"办理移民局离境手续；"},{"italian":"svolgere le formalità doganali;","chinese":"办理海关手续；"},{"italian":"completare le procedure per il rimborso delle tasse sugli acquisti;","chinese":"办理购物退税手续；"},{"italian":"accompagnare i turisti all’imbarco.","chinese":"引领旅游者登记。"}]},{"category":"规范知识","number":59,"question":"全陪导游抵站之后的服务包括哪些环节？","answer":"（1）带领旅游团出站；\n\n（2）向地陪导游通报情况；\n\n（3）清点行李、集合登车。","italian_answer":"Dopo l’arrivo alla stazione o al terminal, la guida accompagnatrice deve:\n1. accompagnare il gruppo fuori dalla stazione;\n2. comunicare le informazioni alla guida locale;\n3. contare i bagagli, riunire il gruppo e accompagnarlo al veicolo.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"accompagnare il gruppo fuori dalla stazione;","chinese":"带领旅游团出站；"},{"italian":"comunicare le informazioni alla guida locale;","chinese":"向地陪导游通报情况；"},{"italian":"contare i bagagli, riunire il gruppo e accompagnarlo al veicolo.","chinese":"清点行李、集合登车。"}]},{"category":"规范知识","number":60,"question":"导游应如何介绍我国的旅游景区质量等级划分的基础常识？","answer":"（1）目前，我国旅游景区质量等级划分为五级，分别是5A级、4A级、3A级、2A级、A级旅游景区；\n\n（2）各级的标志标牌和证书由国家文化和旅游行政主管部门统一规定；\n\n（3）旅游景区质量等级评定工作，遵循自愿申报、分级评定、动态管理、以人为本、持续发展的原则。","italian_answer":"Per spiegare la classificazione della qualità delle attrazioni turistiche in Cina, la guida dovrebbe indicare tre punti:\n1. attualmente le attrazioni turistiche cinesi sono suddivise in cinque livelli: 5A, 4A, 3A, 2A e A;\n2. i simboli, i cartelli e i certificati di ciascun livello sono stabiliti in modo uniforme dall’autorità nazionale competente per la cultura e il turismo;\n3. la valutazione segue i principi della candidatura volontaria, della valutazione per livelli, della gestione dinamica, della centralità delle persone e dello sviluppo sostenibile.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"attualmente le attrazioni turistiche cinesi sono suddivise in cinque livelli: 5A, 4A, 3A, 2A e A;","chinese":"目前，我国旅游景区质量等级划分为五级，分别是5A级、4A级、3A级、2A级、A级旅游景区；"},{"italian":"i simboli, i cartelli e i certificati di ciascun livello sono stabiliti in modo uniforme dall’autorità nazionale competente per la cultura e il turismo;","chinese":"各级的标志标牌和证书由国家文化和旅游行政主管部门统一规定；"},{"italian":"la valutazione segue i principi della candidatura volontaria, della valutazione per livelli, della gestione dinamica, della centralità delle persone e dello sviluppo sostenibile.","chinese":"旅游景区质量等级评定工作，遵循自愿申报、分级评定、动态管理、以人为本、持续发展的原则。"}]},{"category":"应变能力","number":1,"question":"地陪导游应如何防止漏接事故发生？","answer":"（1）熟悉旅游接待计划安排；\n\n（2）核实接机（车、船）的准确信息；\n\n（3）提前半小时抵达迎接地点；\n\n（4）保持通信联系畅通。","italian_answer":"Per evitare di non riuscire ad accogliere il gruppo, la guida locale deve:\n1. conoscere bene il programma dei servizi turistici;\n2. verificare le informazioni precise sull’arrivo in aereo, in treno o in nave;\n3. arrivare al luogo di accoglienza con mezz’ora di anticipo;\n4. mantenere attive e disponibili le comunicazioni.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"conoscere bene il programma dei servizi turistici;","chinese":"熟悉旅游接待计划安排；"},{"italian":"verificare le informazioni precise sull’arrivo in aereo, in treno o in nave;","chinese":"核实接机（车、船）的准确信息；"},{"italian":"arrivare al luogo di accoglienza con mezz’ora di anticipo;","chinese":"提前半小时抵达迎接地点；"},{"italian":"mantenere attive e disponibili le comunicazioni.","chinese":"保持通信联系畅通。"}]},{"category":"应变能力","number":2,"question":"由于客观原因，行程内原定的某一旅游景点无法游览，旅游团被迫改变行程，地陪导游应如何应对？","answer":"（1）第一时间将现场情况报告给旅行社；\n\n（2）将旅行社的处理建议告知旅游者，征询大家的意见，直至双方协调完毕；\n\n（3）安抚旅游者情绪，提供更加细致的服务；\n\n（4）提醒各方协同做好变更后的信息变更通知；\n\n（5）如有重大变更，需全体旅游者签字确认《行程变更协议书》。","italian_answer":"Se, per cause oggettive, non è possibile visitare una delle attrazioni previste e l’itinerario deve essere modificato, la guida locale deve:\n1. riferire immediatamente la situazione all’agenzia di viaggi;\n2. comunicare ai turisti la proposta dell’agenzia e chiedere il loro parere, fino a raggiungere un accordo tra le parti;\n3. rassicurare i turisti e offrire un servizio ancora più attento;\n4. ricordare a tutte le parti di collaborare per comunicare le modifiche del programma e delle relative informazioni;\n5. in caso di modifiche importanti, far firmare a tutti i turisti l’«Accordo di modifica dell’itinerario».","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"riferire immediatamente la situazione all’agenzia di viaggi;","chinese":"第一时间将现场情况报告给旅行社；"},{"italian":"comunicare ai turisti la proposta dell’agenzia e chiedere il loro parere, fino a raggiungere un accordo tra le parti;","chinese":"将旅行社的处理建议告知旅游者，征询大家的意见，直至双方协调完毕；"},{"italian":"rassicurare i turisti e offrire un servizio ancora più attento;","chinese":"安抚旅游者情绪，提供更加细致的服务；"},{"italian":"ricordare a tutte le parti di collaborare per comunicare le modifiche del programma e delle relative informazioni;","chinese":"提醒各方协同做好变更后的信息变更通知；"},{"italian":"in caso di modifiche importanti, far firmare a tutti i turisti l’«Accordo di modifica dell’itinerario».","chinese":"如有重大变更，需全体旅游者签字确认《行程变更协议书》。"}]},{"category":"应变能力","number":3,"question":"地陪导游上午10点去机场接团，到达机场后得知团队航班晚点4小时，地陪导游员应如何处理？","answer":"（1）立即向机场询问处或航空公司查询该航班晚点的时间、原因，确认后地陪应重新安排接待事宜；\n\n（2）通知旅行社变更餐饮、入住宾馆时间，告诉旅游车司机飞机抵达的最新时间和接站车辆做准备工作；\n\n（3）由于飞机晚点，必须调整下午和晚上的活动安排，并衔接计调对修改事宜做好落实工作。","italian_answer":"Se la guida locale arriva in aeroporto alle 10:00 e scopre che il volo del gruppo è in ritardo di quattro ore, deve:\n1. chiedere subito all’ufficio informazioni dell’aeroporto o alla compagnia aerea la durata e il motivo del ritardo; dopo averli verificati, riorganizzare l’accoglienza;\n2. informare l’agenzia di viaggi delle modifiche agli orari dei pasti e del check-in in albergo, comunicare all’autista il nuovo orario di arrivo e chiedergli di prepararsi per il trasferimento;\n3. modificare le attività del pomeriggio e della sera e coordinarsi con il reparto operativo dell’agenzia affinché tutte le modifiche siano attuate.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"chiedere subito all’ufficio informazioni dell’aeroporto o alla compagnia aerea la durata e il motivo del ritardo; dopo averli verificati, riorganizzare l’accoglienza;","chinese":"立即向机场询问处或航空公司查询该航班晚点的时间、原因，确认后地陪应重新安排接待事宜；"},{"italian":"informare l’agenzia di viaggi delle modifiche agli orari dei pasti e del check-in in albergo, comunicare all’autista il nuovo orario di arrivo e chiedergli di prepararsi per il trasferimento;","chinese":"通知旅行社变更餐饮、入住宾馆时间，告诉旅游车司机飞机抵达的最新时间和接站车辆做准备工作；"},{"italian":"modificare le attività del pomeriggio e della sera e coordinarsi con il reparto operativo dell’agenzia affinché tutte le modifiche siano attuate.","chinese":"由于飞机晚点，必须调整下午和晚上的活动安排，并衔接计调对修改事宜做好落实工作。"}]},{"category":"应变能力","number":4,"question":"旅游者出现哪些情形时，导游应立即向旅行社报告？","answer":"（1）患有传染病等疾病，可能危害其他旅游者健康和安全的；\n\n（2）携带危害公共安全的物品且不同意交有关部门处理的；\n\n（3）从事违法或违反公序良俗活动的；\n\n（4）从事严重影响其他旅游者权益的活动，并且不听劝阻、不能制止的；\n\n（5）法律规定的其他情形。","italian_answer":"La guida deve riferire immediatamente all’agenzia di viaggi quando un turista:\n1. è affetto da una malattia contagiosa o da un’altra patologia che può mettere a rischio la salute e la sicurezza degli altri turisti;\n2. porta con sé oggetti pericolosi per la sicurezza pubblica e rifiuta di consegnarli alle autorità competenti;\n3. svolge attività illegali o contrarie all’ordine pubblico e al buon costume;\n4. compie azioni che danneggiano gravemente i diritti degli altri turisti e non ascolta gli avvertimenti, senza che sia possibile fermarlo;\n5. si trova in altre situazioni previste dalla legge.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"è affetto da una malattia contagiosa o da un’altra patologia che può mettere a rischio la salute e la sicurezza degli altri turisti;","chinese":"患有传染病等疾病，可能危害其他旅游者健康和安全的；"},{"italian":"porta con sé oggetti pericolosi per la sicurezza pubblica e rifiuta di consegnarli alle autorità competenti;","chinese":"携带危害公共安全的物品且不同意交有关部门处理的；"},{"italian":"svolge attività illegali o contrarie all’ordine pubblico e al buon costume;","chinese":"从事违法或违反公序良俗活动的；"},{"italian":"compie azioni che danneggiano gravemente i diritti degli altri turisti e non ascolta gli avvertimenti, senza che sia possibile fermarlo;","chinese":"从事严重影响其他旅游者权益的活动，并且不听劝阻、不能制止的；"},{"italian":"si trova in altre situazioni previste dalla legge.","chinese":"法律规定的其他情形。"}]},{"category":"应变能力","number":5,"question":"由于客观原因，旅游团要提前离开某地，导游应如何处理？","answer":"（1）尽量抓紧时间，将计划内的参观游览安排完成。若有困难，地陪应有应变计划，重点游览本地最具有代表性、最具有特色的旅游景点；\n\n（2）做好旅游者安抚工作，实事求是说明困难、诚恳道歉，以求得原谅；\n\n（3）向旅行社报告并与司机衔接，及时办理退房、退餐、退车等事宜；\n\n（4）如果旅游团活动受到较大影响，旅游者损失较大而引起强烈不满，可请接待社领导出面协调，并提出补偿办法；\n\n（5）通知计调及时通知下一站，制订变更接待计划安排。","italian_answer":"Se, per cause oggettive, il gruppo deve lasciare una località in anticipo, la guida deve:\n1. cercare di completare in tempi brevi le visite previste; se non è possibile, preparare un piano alternativo e dare priorità alle attrazioni più rappresentative e caratteristiche della località;\n2. rassicurare i turisti, spiegare con sincerità le difficoltà e porgere sincere scuse per ottenere la loro comprensione;\n3. informare l’agenzia di viaggi e coordinarsi con l’autista per organizzare tempestivamente l’annullamento o la modifica dell’albergo, dei pasti e del veicolo;\n4. se il programma subisce gravi conseguenze e i turisti sono molto insoddisfatti per le perdite subite, chiedere ai responsabili dell’agenzia locale di intervenire e proporre un risarcimento;\n5. avvisare il reparto operativo affinché informi tempestivamente la località successiva e prepari un nuovo programma di accoglienza.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"cercare di completare in tempi brevi le visite previste; se non è possibile, preparare un piano alternativo e dare priorità alle attrazioni più rappresentative e caratteristiche della località;","chinese":"尽量抓紧时间，将计划内的参观游览安排完成。若有困难，地陪应有应变计划，重点游览本地最具有代表性、最具有特色的旅游景点；"},{"italian":"rassicurare i turisti, spiegare con sincerità le difficoltà e porgere sincere scuse per ottenere la loro comprensione;","chinese":"做好旅游者安抚工作，实事求是说明困难、诚恳道歉，以求得原谅；"},{"italian":"informare l’agenzia di viaggi e coordinarsi con l’autista per organizzare tempestivamente l’annullamento o la modifica dell’albergo, dei pasti e del veicolo;","chinese":"向旅行社报告并与司机衔接，及时办理退房、退餐、退车等事宜；"},{"italian":"se il programma subisce gravi conseguenze e i turisti sono molto insoddisfatti per le perdite subite, chiedere ai responsabili dell’agenzia locale di intervenire e proporre un risarcimento;","chinese":"如果旅游团活动受到较大影响，旅游者损失较大而引起强烈不满，可请接待社领导出面协调，并提出补偿办法；"},{"italian":"avvisare il reparto operativo affinché informi tempestivamente la località successiva e prepari un nuovo programma di accoglienza.","chinese":"通知计调及时通知下一站，制订变更接待计划安排。"}]},{"category":"应变能力","number":6,"question":"什么是误机？地陪应怎样处理已经出现的误机事故？","answer":"（1）旅游者因故未能按照原定班次航班离开本站而引起的滞留事故称为误机；\n\n（2）若已经发生误机事故，地陪应首先稳定旅游者情绪；\n\n（3）做好协调工作。既要执行旅行社的处理意见并通报给旅游者，又要听取旅游者的意见并反馈给旅行社，直到处理方案得到双方认可；\n\n（4）做好下一站的通知。对游览日程与有关安排做出相应的调整；提醒旅游者及时联系家人，告知事情原委，并让家人放心。","italian_answer":"Per «perdita del volo» si intende la situazione in cui, per qualche motivo, i turisti non riescono a partire dalla località in cui si trovano con il volo o la corsa originariamente previsti e rimangono bloccati.\nSe l’incidente si verifica, la guida locale deve:\n1. innanzitutto calmare i turisti;\n2. coordinare la gestione: attuare le decisioni dell’agenzia e comunicarle ai turisti, ascoltare anche le loro opinioni e riferirle all’agenzia, finché la soluzione non sia accettata da entrambe le parti;\n3. informare la località successiva e adeguare di conseguenza il programma delle visite e gli altri servizi; ricordare ai turisti di contattare tempestivamente i familiari, spiegare loro l’accaduto e rassicurarli.","bilingual_pairing":"逐点对应（定义/情况说明 + 处理步骤）","bilingual_pairs":[{"italian":"Per «perdita del volo» si intende la situazione in cui, per qualche motivo, i turisti non riescono a partire dalla località in cui si trovano con il volo o la corsa originariamente previsti e rimangono bloccati.\nSe l’incidente si verifica, la guida locale deve:\n1.","chinese":"旅游者因故未能按照原定班次航班离开本站而引起的滞留事故称为误机；"},{"italian":"innanzitutto calmare i turisti;","chinese":"若已经发生误机事故，地陪应首先稳定旅游者情绪；"},{"italian":"coordinare la gestione: attuare le decisioni dell’agenzia e comunicarle ai turisti, ascoltare anche le loro opinioni e riferirle all’agenzia, finché la soluzione non sia accettata da entrambe le parti;","chinese":"做好协调工作。既要执行旅行社的处理意见并通报给旅游者，又要听取旅游者的意见并反馈给旅行社，直到处理方案得到双方认可；"},{"italian":"informare la località successiva e adeguare di conseguenza il programma delle visite e gli altri servizi; ricordare ai turisti di contattare tempestivamente i familiari, spiegare loro l’accaduto e rassicurarli.","chinese":"做好下一站的通知。对游览日程与有关安排做出相应的调整；提醒旅游者及时联系家人，告知事情原委，并让家人放心。"}]},{"category":"应变能力","number":7,"question":"导游如何防止误机事故发生？","answer":"（1）认真核验乘坐信息。确认班（轮）次，清楚乘坐的日期、具体时间以及地点。如果当地有多个机场、火车站或码头，则应该进一步确认具体位置。\n\n（2）合理安排当天行程。避免在离开当天安排旅游者到地域复杂、位置偏远的景点参观游览，也应避免在送机(车、船)前安排自由活动项目。\n\n（3）按规定时间抵达。导游应提前与司机沟通交通情况，并预留充足的行车时间，以免遭遇突发情况而不能按时抵达。","italian_answer":"Per prevenire la perdita del volo o della partenza prevista, la guida deve:\n1. verificare attentamente i dati del viaggio: numero del volo, del treno o della nave, data, orario preciso e luogo di partenza; se nella località ci sono più aeroporti, stazioni o porti, verificare anche quello esatto;\n2. organizzare in modo ragionevole il programma del giorno della partenza, evitando visite in luoghi lontani o difficili da raggiungere e attività libere prima del trasferimento;\n3. arrivare in orario: concordare in anticipo con l’autista le condizioni del traffico e prevedere tempo sufficiente per il tragitto, così da evitare ritardi dovuti a imprevisti.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"verificare attentamente i dati del viaggio: numero del volo, del treno o della nave, data, orario preciso e luogo di partenza; se nella località ci sono più aeroporti, stazioni o porti, verificare anche quello esatto;","chinese":"认真核验乘坐信息。确认班（轮）次，清楚乘坐的日期、具体时间以及地点。如果当地有多个机场、火车站或码头，则应该进一步确认具体位置。"},{"italian":"organizzare in modo ragionevole il programma del giorno della partenza, evitando visite in luoghi lontani o difficili da raggiungere e attività libere prima del trasferimento;","chinese":"合理安排当天行程。避免在离开当天安排旅游者到地域复杂、位置偏远的景点参观游览，也应避免在送机(车、船)前安排自由活动项目。"},{"italian":"arrivare in orario: concordare in anticipo con l’autista le condizioni del traffico e prevedere tempo sufficiente per il tragitto, così da evitare ritardi dovuti a imprevisti.","chinese":"按规定时间抵达。导游应提前与司机沟通交通情况，并预留充足的行车时间，以免遭遇突发情况而不能按时抵达。"}]},{"category":"应变能力","number":8,"question":"由于天气原因，航班不能按时起飞，推迟到晚上。但晚上10点航空公司宣布取消当日航班。旅游者情绪低落，大吵大闹十分不满，地陪导游应如何处理？","answer":"（1）地陪应及时向旅游者说明情况，并衔接驻机场的航空公司地面工作人员一起出面，全力稳定旅游者情绪；\n\n（2）与计调衔接或在现场与航空公司柜台联系，尽快落实第二天离港的航班，并做好行李安排等事项；\n\n（3）及时解决旅游者的食宿问题；\n\n（4）通知旅游者第二天叫早、早餐、出行李及发车时间；\n\n（5）提醒旅行社计调部门及时通知行程下一站。","italian_answer":"Se, a causa del maltempo, il volo viene rinviato alla sera e alle 22:00 la compagnia aerea annuncia la cancellazione del volo, mentre i turisti sono molto contrariati, la guida locale deve:\n1. spiegare tempestivamente la situazione ai turisti e collaborare con il personale di terra della compagnia aerea presente in aeroporto per calmare tutti;\n2. contattare il reparto operativo dell’agenzia oppure lo sportello della compagnia aerea per confermare al più presto un volo per il giorno successivo e organizzare i bagagli;\n3. risolvere tempestivamente le necessità di alloggio e di ristorazione dei turisti;\n4. comunicare l’orario della sveglia, della colazione, della consegna dei bagagli e della partenza del giorno successivo;\n5. ricordare al reparto operativo dell’agenzia di informare tempestivamente la località successiva.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"spiegare tempestivamente la situazione ai turisti e collaborare con il personale di terra della compagnia aerea presente in aeroporto per calmare tutti;","chinese":"地陪应及时向旅游者说明情况，并衔接驻机场的航空公司地面工作人员一起出面，全力稳定旅游者情绪；"},{"italian":"contattare il reparto operativo dell’agenzia oppure lo sportello della compagnia aerea per confermare al più presto un volo per il giorno successivo e organizzare i bagagli;","chinese":"与计调衔接或在现场与航空公司柜台联系，尽快落实第二天离港的航班，并做好行李安排等事项；"},{"italian":"risolvere tempestivamente le necessità di alloggio e di ristorazione dei turisti;","chinese":"及时解决旅游者的食宿问题；"},{"italian":"comunicare l’orario della sveglia, della colazione, della consegna dei bagagli e della partenza del giorno successivo;","chinese":"通知旅游者第二天叫早、早餐、出行李及发车时间；"},{"italian":"ricordare al reparto operativo dell’agenzia di informare tempestivamente la località successiva.","chinese":"提醒旅行社计调部门及时通知行程下一站。"}]},{"category":"应变能力","number":9,"question":"旅游团抵达机场的时间是上午8点，地陪导游在前往机场途中遇到塞车，抵达机场时已是上午8点40分，此时地陪导游应如何处理？","answer":"（1）这是一次漏接事故；\n\n（2）导游应尽快与旅游团汇合；\n\n（3）诚恳地向旅游者赔礼道歉并说明情况；\n\n（4）积极采取弥补措施，以热情主动的高质量服务及物质上的补偿取得旅游者的谅解。","italian_answer":"Se il gruppo deve arrivare in aeroporto alle 8:00, ma la guida locale rimane bloccata nel traffico e arriva alle 8:40, si tratta di un caso di mancata accoglienza. La guida deve:\n1. raggiungere il gruppo il più rapidamente possibile;\n2. porgere sinceramente le proprie scuse ai turisti e spiegare l’accaduto;\n3. adottare misure concrete per rimediare, offrendo un servizio attento, cordiale e di alta qualità e, se necessario, un compenso materiale, così da ottenere la comprensione dei turisti.","bilingual_pairing":"逐点对应（定义/情况说明 + 处理步骤）","bilingual_pairs":[{"italian":"Se il gruppo deve arrivare in aeroporto alle 8:00, ma la guida locale rimane bloccata nel traffico e arriva alle 8:40, si tratta di un caso di mancata accoglienza. La guida deve:\n1.","chinese":"这是一次漏接事故；"},{"italian":"raggiungere il gruppo il più rapidamente possibile;","chinese":"导游应尽快与旅游团汇合；"},{"italian":"porgere sinceramente le proprie scuse ai turisti e spiegare l’accaduto;","chinese":"诚恳地向旅游者赔礼道歉并说明情况；"},{"italian":"adottare misure concrete per rimediare, offrendo un servizio attento, cordiale e di alta qualità e, se necessario, un compenso materiale, così da ottenere la comprensione dei turisti.","chinese":"积极采取弥补措施，以热情主动的高质量服务及物质上的补偿取得旅游者的谅解。"}]},{"category":"应变能力","number":10,"question":"由于暴风雪，机场关闭，旅游团滞留本市继续游览一天，地陪导游应如何处理？","answer":"（1）立即向旅行社汇报，重新安排该旅游团的用餐、住宿、用车等事项；\n\n（2）调整接待计划，酌情增加旅游景点，适当延长主要景点的游览时间。在征求客人意见后，晚上可安排文娱活动，调节旅游者情绪；\n\n（3）和计调人员保持紧密联系，落实第二天旅游者的离站航班；\n\n（4）及时通知下一站旅行社。","italian_answer":"Se una tempesta di neve provoca la chiusura dell’aeroporto e il gruppo deve rimanere nella città per un altro giorno di visite, la guida locale deve:\n1. riferire immediatamente la situazione all’agenzia di viaggi e riorganizzare i pasti, l’alloggio e il trasporto del gruppo;\n2. modificare il programma di accoglienza, aggiungendo eventualmente alcune attrazioni e prolungando in modo adeguato la visita ai luoghi principali; dopo aver consultato i turisti, può organizzare un’attività ricreativa la sera per migliorare il loro stato d’animo;\n3. mantenersi in stretto contatto con il reparto operativo e confermare il volo di partenza del giorno successivo;\n4. informare tempestivamente l’agenzia di viaggi della località successiva.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"riferire immediatamente la situazione all’agenzia di viaggi e riorganizzare i pasti, l’alloggio e il trasporto del gruppo;","chinese":"立即向旅行社汇报，重新安排该旅游团的用餐、住宿、用车等事项；"},{"italian":"modificare il programma di accoglienza, aggiungendo eventualmente alcune attrazioni e prolungando in modo adeguato la visita ai luoghi principali; dopo aver consultato i turisti, può organizzare un’attività ricreativa la sera per migliorare il loro stato d’animo;","chinese":"调整接待计划，酌情增加旅游景点，适当延长主要景点的游览时间。在征求客人意见后，晚上可安排文娱活动，调节旅游者情绪；"},{"italian":"mantenersi in stretto contatto con il reparto operativo e confermare il volo di partenza del giorno successivo;","chinese":"和计调人员保持紧密联系，落实第二天旅游者的离站航班；"},{"italian":"informare tempestivamente l’agenzia di viaggi della località successiva.","chinese":"及时通知下一站旅行社。"}]},{"category":"应变能力","number":11,"question":"由于旅游旺季，机票预订出现问题，旅行社不得不安排旅游团乘加班飞机提前离开本地，此时地陪导游应如何协调？","answer":"（1）争取全陪和领队的配合，说明更改原因，取得旅游者的谅解和支持；\n\n（2）讲清补救措施；\n\n（3）充分利用有效时间安排客人参观本地主要景点，同时将更改计划通知组团社和下一站接团社；\n\n（4）在旅行社的授权下，开展对旅游者的补偿工作。","italian_answer":"A causa dell’alta stagione, si verificano problemi con la prenotazione dei biglietti aerei e l’agenzia di viaggi deve organizzare la partenza anticipata del gruppo con un volo straordinario. La guida locale deve:\n1. chiedere la collaborazione della guida accompagnatrice e del capogruppo, spiegare il motivo della modifica e ottenere la comprensione e il sostegno dei turisti;\n2. spiegare chiaramente le misure previste per rimediare;\n3. utilizzare al meglio il tempo disponibile per organizzare la visita alle principali attrazioni locali e comunicare la modifica del programma all’agenzia organizzatrice e all’agenzia che accoglierà il gruppo nella tappa successiva;\n4. procedere a eventuali compensazioni a favore dei turisti solo con l’autorizzazione dell’agenzia di viaggi.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"chiedere la collaborazione della guida accompagnatrice e del capogruppo, spiegare il motivo della modifica e ottenere la comprensione e il sostegno dei turisti;","chinese":"争取全陪和领队的配合，说明更改原因，取得旅游者的谅解和支持；"},{"italian":"spiegare chiaramente le misure previste per rimediare;","chinese":"讲清补救措施；"},{"italian":"utilizzare al meglio il tempo disponibile per organizzare la visita alle principali attrazioni locali e comunicare la modifica del programma all’agenzia organizzatrice e all’agenzia che accoglierà il gruppo nella tappa successiva;","chinese":"充分利用有效时间安排客人参观本地主要景点，同时将更改计划通知组团社和下一站接团社；"},{"italian":"procedere a eventuali compensazioni a favore dei turisti solo con l’autorizzazione dell’agenzia di viaggi.","chinese":"在旅行社的授权下，开展对旅游者的补偿工作。"}]},{"category":"应变能力","number":12,"question":"地陪正带领一外籍旅游团在景点游览，一名团员突然发现他的护照丢失，此时地陪导游员应如何处理？","answer":"（1）安慰团员，请其仔细回忆可能丢失的地点，积极协助寻找；\n\n（2）确认丢失后，应第一时间报告旅行社和接待社领导；\n\n（3）拨打110报警，请求出具《护照报失证明》或《报案回执》，这是后续补办的核心凭证，再由工作人员配合旅游者到相关部门按流程补办护照；\n\n（4）费用由该团员自理。","italian_answer":"Se, durante la visita a un’attrazione con un gruppo straniero, un turista si accorge di aver perso il passaporto, la guida locale deve:\n1. rassicurarlo, chiedergli di ricordare con attenzione i luoghi in cui potrebbe averlo perso e aiutarlo attivamente nelle ricerche;\n2. dopo aver confermato lo smarrimento, informare immediatamente l’agenzia di viaggi e i responsabili dell’agenzia locale;\n3. chiamare il 110 e chiedere il «certificato di denuncia dello smarrimento del passaporto» oppure la «ricevuta della denuncia». Questi documenti sono fondamentali per la successiva richiesta di un nuovo passaporto. Il personale deve poi accompagnare e assistere il turista presso gli uffici competenti, seguendo la procedura prevista;\n4. le spese sono a carico del turista.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"rassicurarlo, chiedergli di ricordare con attenzione i luoghi in cui potrebbe averlo perso e aiutarlo attivamente nelle ricerche;","chinese":"安慰团员，请其仔细回忆可能丢失的地点，积极协助寻找；"},{"italian":"dopo aver confermato lo smarrimento, informare immediatamente l’agenzia di viaggi e i responsabili dell’agenzia locale;","chinese":"确认丢失后，应第一时间报告旅行社和接待社领导；"},{"italian":"chiamare il 110 e chiedere il «certificato di denuncia dello smarrimento del passaporto» oppure la «ricevuta della denuncia». Questi documenti sono fondamentali per la successiva richiesta di un nuovo passaporto. Il personale deve poi accompagnare e assistere il turista presso gli uffici competenti, seguendo la procedura prevista;","chinese":"拨打110报警，请求出具《护照报失证明》或《报案回执》，这是后续补办的核心凭证，再由工作人员配合旅游者到相关部门按流程补办护照；"},{"italian":"le spese sono a carico del turista.","chinese":"费用由该团员自理。"}]},{"category":"应变能力","number":13,"question":"一名外籍旅游者在我国旅游期间所带贵重财物被盗，地陪导游员应如何处理？","answer":"（1）稳定失主情绪，详细了解物品丢失过程；\n\n（2）确认被盗后，地陪应立即报告公安机关、旅行社和保险公司，协助查找线索，力争尽快破案；\n\n（3）若找不回被盗物品，地陪应协助失主持旅行社出具的证明到当地公安机关开具失窃证明书，以便旅游者回国出关查验或找保险公司索赔；\n\n（4）安慰失主，缓解不快情绪。","italian_answer":"Se a un turista straniero vengono rubati oggetti di valore durante il viaggio in Cina, la guida locale deve:\n1. calmare la vittima e informarsi in dettaglio su come sono scomparsi gli oggetti;\n2. dopo aver confermato il furto, informare immediatamente la polizia, l’agenzia di viaggi e la compagnia assicurativa, e collaborare alla ricerca di indizi per favorire la soluzione del caso;\n3. se gli oggetti rubati non vengono ritrovati, aiutare la vittima a ottenere una dichiarazione dall’agenzia di viaggi e a richiedere alla polizia locale un certificato di furto, utile per i controlli in uscita dalla Cina o per chiedere il rimborso all’assicurazione;\n4. confortare la vittima e aiutarla a superare il dispiacere.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"calmare la vittima e informarsi in dettaglio su come sono scomparsi gli oggetti;","chinese":"稳定失主情绪，详细了解物品丢失过程；"},{"italian":"dopo aver confermato il furto, informare immediatamente la polizia, l’agenzia di viaggi e la compagnia assicurativa, e collaborare alla ricerca di indizi per favorire la soluzione del caso;","chinese":"确认被盗后，地陪应立即报告公安机关、旅行社和保险公司，协助查找线索，力争尽快破案；"},{"italian":"se gli oggetti rubati non vengono ritrovati, aiutare la vittima a ottenere una dichiarazione dall’
