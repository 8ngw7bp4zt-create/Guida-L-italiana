uazione e adattare clemenza e severità alle circostanze. L’intera iscrizione riassume in modo profondo il metodo di governo di Zhuge Liang e offre importanti riflessioni sull’arte di governare.","chinese":"上联：能攻心则反侧自消，从古知兵非好战；下联：不审势即宽严皆误，后来治蜀要深思。该联由清代赵藩撰写，借诸葛亮治蜀的历史经验，阐述了“攻心为上”的治国理政智慧。上联强调真正的善用兵者不崇尚武力，而以攻心取胜；下联强调治理者须审时度势，宽严皆须因势而定，否则便会失误。全联既是对诸葛亮治蜀方略的精辟总结，也蕴含了深刻的治国理政哲理，是讲解三国文化和蜀汉历史的重要知识点。"}]},{"category":"综合知识","number":52,"question":"成都“人日游草堂”民俗源于哪两位唐代诗人的友谊佳话？请简述其由来。","answer":"源于高适与杜甫的友谊。唐肃宗上元二年（761年）人日，高适作《人日寄杜二拾遗》思念杜甫。晚年的杜甫重读此诗，写下《追酬故高蜀州人日见寄》。清咸丰四年（1854年）人日，何绍基题联“锦水春风公占却，草堂人日我归来”，自此形成每年（农历正月初七）人日祭拜诗圣、吟诗赏梅的成都民俗，体现了成都崇文尚贤的诗韵传统。","italian_answer":"La tradizione del «viaggio al Cottage di Du Fu nel Giorno dell’Uomo» deriva dall’amicizia tra i poeti Tang Gao Shi e Du Fu. Nel secondo anno dell’era Shangyuan dell’imperatore Suzong, cioè nel 761, in occasione del Giorno dell’Uomo, Gao Shi compose la poesia «Nel Giorno dell’Uomo, scrivo a Du Er, il poeta in pensione» per esprimere la nostalgia per Du Fu. In età avanzata, Du Fu rilesse la poesia e scrisse «In risposta alla poesia inviata da Gao Shuzhou nel Giorno dell’Uomo». Nel 1854, durante la dinastia Qing, nel Giorno dell’Uomo, He Shaoji scrisse una coppia di versi: «La brezza primaverile del fiume Jin è già tua; nel Giorno dell’Uomo torno al Cottage». Da allora è nata la tradizione di Chengdu di rendere omaggio al poeta Du Fu, recitare poesie e ammirare i susini ogni anno il settimo giorno del primo mese lunare. Questa usanza riflette la tradizione di Chengdu di valorizzare la cultura e rispettare le persone di talento.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La tradizione del «viaggio al Cottage di Du Fu nel Giorno dell’Uomo» deriva dall’amicizia tra i poeti Tang Gao Shi e Du Fu. Nel secondo anno dell’era Shangyuan dell’imperatore Suzong, cioè nel 761, in occasione del Giorno dell’Uomo, Gao Shi compose la poesia «Nel Giorno dell’Uomo, scrivo a Du Er, il poeta in pensione» per esprimere la nostalgia per Du Fu. In età avanzata, Du Fu rilesse la poesia e scrisse «In risposta alla poesia inviata da Gao Shuzhou nel Giorno dell’Uomo». Nel 1854, durante la dinastia Qing, nel Giorno dell’Uomo, He Shaoji scrisse una coppia di versi: «La brezza primaverile del fiume Jin è già tua; nel Giorno dell’Uomo torno al Cottage». Da allora è nata la tradizione di Chengdu di rendere omaggio al poeta Du Fu, recitare poesie e ammirare i susini ogni anno il settimo giorno del primo mese lunare. Questa usanza riflette la tradizione di Chengdu di valorizzare la cultura e rispettare le persone di talento.","chinese":"源于高适与杜甫的友谊。唐肃宗上元二年（761年）人日，高适作《人日寄杜二拾遗》思念杜甫。晚年的杜甫重读此诗，写下《追酬故高蜀州人日见寄》。清咸丰四年（1854年）人日，何绍基题联“锦水春风公占却，草堂人日我归来”，自此形成每年（农历正月初七）人日祭拜诗圣、吟诗赏梅的成都民俗，体现了成都崇文尚贤的诗韵传统。"}]},{"category":"综合知识","number":53,"question":"佛教中的“三方佛”“三世佛”有何异同？","answer":"三方佛，是指药师佛、释迦牟尼佛和阿弥陀佛，它是佛教对空间的一种认识，以东方、中央、西方加以展现；三世佛，指燃灯佛、释迦牟尼佛、弥勒佛，它是佛教对时间的一种认识，以过去、现在、未来加以展现。","italian_answer":"I «Tre Buddha delle direzioni» sono il Buddha della Medicina, il Buddha Sakyamuni e il Buddha Amitabha. Rappresentano la concezione buddhista dello spazio, attraverso est, centro e ovest.\nI «Tre Buddha dei tempi» sono Dipamkara, il Buddha Sakyamuni e Maitreya. Rappresentano la concezione buddhista del tempo, attraverso passato, presente e futuro.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"I «Tre Buddha delle direzioni» sono il Buddha della Medicina, il Buddha Sakyamuni e il Buddha Amitabha. Rappresentano la concezione buddhista dello spazio, attraverso est, centro e ovest.\nI «Tre Buddha dei tempi» sono Dipamkara, il Buddha Sakyamuni e Maitreya. Rappresentano la concezione buddhista del tempo, attraverso passato, presente e futuro.","chinese":"三方佛，是指药师佛、释迦牟尼佛和阿弥陀佛，它是佛教对空间的一种认识，以东方、中央、西方加以展现；三世佛，指燃灯佛、释迦牟尼佛、弥勒佛，它是佛教对时间的一种认识，以过去、现在、未来加以展现。"}]},{"category":"综合知识","number":54,"question":"平武报恩寺为何被称为“深山王宫”，它的六绝指的是什么？","answer":"报恩寺全称为“敕修报恩寺”，始建于明正统五年（1440年），因其布局结构酷似北京紫禁城，又称“深山王宫”。报恩寺有六绝：媲美北京法海寺的彩绘壁画，全国唯一还能转动的明代转轮经藏，整木木雕的千手观音像，样式繁多的斗拱，全寺遍布的近万条雕刻、彩绘、铸塑龙形造型，以及清一色的楠木建筑。","italian_answer":"Il nome completo del Tempio Bao'en è «Tempio Bao'en costruito per decreto imperiale». Fu fondato nel quinto anno dell’era Zhengtong della dinastia Ming, cioè nel 1440. Poiché la sua struttura e la sua disposizione ricordano la Città Proibita di Pechino, è chiamato anche «Palazzo imperiale tra le montagne». Le sue sei meraviglie sono: gli affreschi, paragonabili a quelli del Tempio Fahai di Pechino; l’unico contenitore rotante delle scritture della dinastia Ming ancora funzionante in Cina; la statua lignea di Guanyin dalle mille braccia, ricavata da un unico tronco; i numerosi stili di mensole e staffe architettoniche; le quasi diecimila raffigurazioni di draghi scolpite, dipinte o modellate presenti in tutto il tempio; e gli edifici costruiti interamente in legno di nanmu.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il nome completo del Tempio Bao'en è «Tempio Bao'en costruito per decreto imperiale». Fu fondato nel quinto anno dell’era Zhengtong della dinastia Ming, cioè nel 1440. Poiché la sua struttura e la sua disposizione ricordano la Città Proibita di Pechino, è chiamato anche «Palazzo imperiale tra le montagne». Le sue sei meraviglie sono: gli affreschi, paragonabili a quelli del Tempio Fahai di Pechino; l’unico contenitore rotante delle scritture della dinastia Ming ancora funzionante in Cina; la statua lignea di Guanyin dalle mille braccia, ricavata da un unico tronco; i numerosi stili di mensole e staffe architettoniche; le quasi diecimila raffigurazioni di draghi scolpite, dipinte o modellate presenti in tutto il tempio; e gli edifici costruiti interamente in legno di nanmu.","chinese":"报恩寺全称为“敕修报恩寺”，始建于明正统五年（1440年），因其布局结构酷似北京紫禁城，又称“深山王宫”。报恩寺有六绝：媲美北京法海寺的彩绘壁画，全国唯一还能转动的明代转轮经藏，整木木雕的千手观音像，样式繁多的斗拱，全寺遍布的近万条雕刻、彩绘、铸塑龙形造型，以及清一色的楠木建筑。"}]},{"category":"综合知识","number":55,"question":"简要介绍太阳神鸟金饰。","answer":"太阳神鸟金饰于2001年出土于四川成都金沙遗址，整器呈圆环形，厚度0.02厘米，含金量高达94.2%，是古蜀黄金工艺辉煌成就的代表，也是诠释古蜀先民太阳崇拜的艺术杰作。其所呈现的“四鸟绕日”图案，于2005年8月16日被公布为中国文化遗产标志。","italian_answer":"L’ornamento d’oro del «Sole e uccello divino» è stato rinvenuto nel 2001 nel sito archeologico di Jinsha, a Chengdu, nel Sichuan. L’oggetto ha forma circolare, uno spessore di 0,02 centimetri e un contenuto d’oro pari al 94,2%. È una testimonianza rappresentativa dell’eccellenza dell’oreficeria dell’antico Shu e un capolavoro artistico che esprime il culto del sole degli antichi abitanti dello Shu. Il motivo dei «quattro uccelli che circondano il sole» è stato scelto il 16 agosto 2005 come simbolo del patrimonio culturale cinese.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’ornamento d’oro del «Sole e uccello divino» è stato rinvenuto nel 2001 nel sito archeologico di Jinsha, a Chengdu, nel Sichuan. L’oggetto ha forma circolare, uno spessore di 0,02 centimetri e un contenuto d’oro pari al 94,2%. È una testimonianza rappresentativa dell’eccellenza dell’oreficeria dell’antico Shu e un capolavoro artistico che esprime il culto del sole degli antichi abitanti dello Shu. Il motivo dei «quattro uccelli che circondano il sole» è stato scelto il 16 agosto 2005 come simbolo del patrimonio culturale cinese.","chinese":"太阳神鸟金饰于2001年出土于四川成都金沙遗址，整器呈圆环形，厚度0.02厘米，含金量高达94.2%，是古蜀黄金工艺辉煌成就的代表，也是诠释古蜀先民太阳崇拜的艺术杰作。其所呈现的“四鸟绕日”图案，于2005年8月16日被公布为中国文化遗产标志。"}]},{"category":"综合知识","number":56,"question":"全国唯一以花名命名的地级市是哪座城市？有哪些著名景点？","answer":"全国唯一以花名命名的地级市是四川省攀枝花市。攀枝花市位于中国西南的川、滇交界，于1965年设市。攀枝花市的著名景点有攀西大裂谷、格萨拉、二滩水电站及库区、苏铁林、红格温泉、米易颛顼龙洞等。","italian_answer":"L’unica città-prefettura della Cina il cui nome deriva da un fiore è Panzhihua, nella provincia del Sichuan. Si trova nel sud-ovest della Cina, al confine tra Sichuan e Yunnan, ed è stata istituita come città nel 1965. Le sue attrazioni più famose sono la grande spaccatura di Panxi, Gesala, la centrale idroelettrica di Ertan e il suo bacino, la foresta di cicadi, le sorgenti termali di Hongge e la grotta del drago di Zhuanxu a Miyi.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’unica città-prefettura della Cina il cui nome deriva da un fiore è Panzhihua, nella provincia del Sichuan. Si trova nel sud-ovest della Cina, al confine tra Sichuan e Yunnan, ed è stata istituita come città nel 1965. Le sue attrazioni più famose sono la grande spaccatura di Panxi, Gesala, la centrale idroelettrica di Ertan e il suo bacino, la foresta di cicadi, le sorgenti termali di Hongge e la grotta del drago di Zhuanxu a Miyi.","chinese":"全国唯一以花名命名的地级市是四川省攀枝花市。攀枝花市位于中国西南的川、滇交界，于1965年设市。攀枝花市的著名景点有攀西大裂谷、格萨拉、二滩水电站及库区、苏铁林、红格温泉、米易颛顼龙洞等。"}]},{"category":"综合知识","number":57,"question":"截至2026年7月，四川有多少项列入联合国教科文组织人类非物质文化遗产代表作名录，分别是哪些？","answer":"截至目前，四川已有9项列入联合国教科文组织人类非物质文化遗产代表作名录，分别是羌年、藏戏、格萨（斯）尔、蜀锦（中国传统桑蚕丝织技艺）、德格印经院藏族雕版印刷技艺（中国雕版印刷技艺）、四川皮影戏（中国皮影戏）、藏医药浴法、蒙山茶传统制作技艺和南路边茶制作技艺（中国传统制茶技艺及其相关习俗）、春节（四川多地民俗作为核心支撑内容参与申遗）。","italian_answer":"Fino a luglio 2026, il Sichuan ha nove elementi iscritti nella Lista rappresentativa del patrimonio culturale immateriale dell’umanità dell’UNESCO. Sono: il Capodanno Qiang; l’opera tibetana; il Gesar; il broccato Shu, nell’ambito delle tecniche tradizionali cinesi di tessitura della seta; la tecnica tibetana di stampa xilografica del Monastero di Dege, nell’ambito della stampa xilografica cinese; il teatro delle ombre del Sichuan, nell’ambito del teatro delle ombre cinese; il bagno medicinale tibetano; le tecniche tradizionali di produzione del tè Mengshan e del tè scuro Nanlu, nell’ambito delle tecniche tradizionali cinesi del tè e delle relative usanze; e la Festa di Primavera, alla cui candidatura contribuiscono come contenuti fondamentali le usanze tradizionali di diverse località del Sichuan.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Fino a luglio 2026, il Sichuan ha nove elementi iscritti nella Lista rappresentativa del patrimonio culturale immateriale dell’umanità dell’UNESCO. Sono: il Capodanno Qiang; l’opera tibetana; il Gesar; il broccato Shu, nell’ambito delle tecniche tradizionali cinesi di tessitura della seta; la tecnica tibetana di stampa xilografica del Monastero di Dege, nell’ambito della stampa xilografica cinese; il teatro delle ombre del Sichuan, nell’ambito del teatro delle ombre cinese; il bagno medicinale tibetano; le tecniche tradizionali di produzione del tè Mengshan e del tè scuro Nanlu, nell’ambito delle tecniche tradizionali cinesi del tè e delle relative usanze; e la Festa di Primavera, alla cui candidatura contribuiscono come contenuti fondamentali le usanze tradizionali di diverse località del Sichuan.","chinese":"截至目前，四川已有9项列入联合国教科文组织人类非物质文化遗产代表作名录，分别是羌年、藏戏、格萨（斯）尔、蜀锦（中国传统桑蚕丝织技艺）、德格印经院藏族雕版印刷技艺（中国雕版印刷技艺）、四川皮影戏（中国皮影戏）、藏医药浴法、蒙山茶传统制作技艺和南路边茶制作技艺（中国传统制茶技艺及其相关习俗）、春节（四川多地民俗作为核心支撑内容参与申遗）。"}]},{"category":"综合知识","number":58,"question":"截至2026年7月，我国现有世界自然遗产、世界文化与自然双重遗产、世界文化遗产项目数量分别是多少？2026年7月，在韩国釜山召开的联合国教科文组织第48届世界遗产大会上，我国入选《世界遗产名录》的新增项目是什么？至此，中国世界遗产总数达到多少项？","answer":"15项世界自然遗产，4项世界文化与自然双重遗产，42项世界文化遗产。2026年7月，在韩国釜山召开的联合国教科文组织第48届世界遗产大会上，我国申报的“景德镇手工瓷业遗存”项目列入《世界遗产名录》。中国世界遗产总数达到61项。","italian_answer":"La Cina possiede 15 siti del patrimonio naturale mondiale, 4 siti del patrimonio misto culturale e naturale e 42 siti del patrimonio culturale mondiale. Nel luglio 2026, durante la 48ª sessione del Comitato del Patrimonio Mondiale dell’UNESCO, tenutasi a Busan, in Corea del Sud, il progetto cinese «Resti dell’industria artigianale della porcellana di Jingdezhen» è stato inserito nella Lista del Patrimonio Mondiale. Da quel momento, il numero totale dei siti cinesi del patrimonio mondiale è salito a 61.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La Cina possiede 15 siti del patrimonio naturale mondiale, 4 siti del patrimonio misto culturale e naturale e 42 siti del patrimonio culturale mondiale. Nel luglio 2026, durante la 48ª sessione del Comitato del Patrimonio Mondiale dell’UNESCO, tenutasi a Busan, in Corea del Sud, il progetto cinese «Resti dell’industria artigianale della porcellana di Jingdezhen» è stato inserito nella Lista del Patrimonio Mondiale. Da quel momento, il numero totale dei siti cinesi del patrimonio mondiale è salito a 61.","chinese":"15项世界自然遗产，4项世界文化与自然双重遗产，42项世界文化遗产。2026年7月，在韩国釜山召开的联合国教科文组织第48届世界遗产大会上，我国申报的“景德镇手工瓷业遗存”项目列入《世界遗产名录》。中国世界遗产总数达到61项。"}]},{"category":"综合知识","number":59,"question":"请简述“文翁兴学”的历史事件及其影响。","answer":"西汉景帝末年，蜀郡太守文翁在成都创办官学，开中国地方官学之先河。文翁兴学使蜀地文风大盛，人才辈出，蜀学从此比肩齐鲁。其故址延续办学两千余年至今，即成都石室中学，被誉为“古今一校，文脉不断”。","italian_answer":"Alla fine del regno dell’imperatore Jing della dinastia Han occidentale, Wen Weng, governatore della prefettura di Shu, fondò a Chengdu una scuola pubblica. Fu la prima scuola ufficiale locale nella storia della Cina. La sua iniziativa favorì molto lo sviluppo culturale dello Shu e la formazione di numerosi talenti; da allora, gli studi dello Shu poterono competere con quelli di Qilu. La scuola si trova ancora oggi nello stesso luogo, dopo oltre duemila anni di attività educativa: è l’attuale Scuola media Shishi di Chengdu, definita «un’unica scuola dall’antichità a oggi, con una tradizione culturale ininterrotta».","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Alla fine del regno dell’imperatore Jing della dinastia Han occidentale, Wen Weng, governatore della prefettura di Shu, fondò a Chengdu una scuola pubblica. Fu la prima scuola ufficiale locale nella storia della Cina. La sua iniziativa favorì molto lo sviluppo culturale dello Shu e la formazione di numerosi talenti; da allora, gli studi dello Shu poterono competere con quelli di Qilu. La scuola si trova ancora oggi nello stesso luogo, dopo oltre duemila anni di attività educativa: è l’attuale Scuola media Shishi di Chengdu, definita «un’unica scuola dall’antichità a oggi, con una tradizione culturale ininterrotta».","chinese":"西汉景帝末年，蜀郡太守文翁在成都创办官学，开中国地方官学之先河。文翁兴学使蜀地文风大盛，人才辈出，蜀学从此比肩齐鲁。其故址延续办学两千余年至今，即成都石室中学，被誉为“古今一校，文脉不断”。"}]},{"category":"综合知识","number":60,"question":"请简要介绍卧龙国家级自然保护区。","answer":"卧龙国家级自然保护区位于四川省汶川县西南部，是我国建立最早、栖息地面积最大的大熊猫自然保护区。该保护区是世界自然遗产“四川大熊猫栖息地”的核心保护区，被誉为“熊猫之乡”“宝贵的生物基因库”“天然动植物园”。","italian_answer":"La Riserva naturale nazionale di Wolong si trova nella parte sud-occidentale della contea di Wenchuan, nel Sichuan. È la prima riserva naturale istituita in Cina per il panda gigante e quella con la più vasta superficie di habitat. È una zona centrale dell’area «Habitat del panda gigante del Sichuan», riconosciuta come patrimonio naturale mondiale. È chiamata «la patria dei panda», «un prezioso patrimonio genetico biologico» e «un giardino naturale di animali e piante».","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La Riserva naturale nazionale di Wolong si trova nella parte sud-occidentale della contea di Wenchuan, nel Sichuan. È la prima riserva naturale istituita in Cina per il panda gigante e quella con la più vasta superficie di habitat. È una zona centrale dell’area «Habitat del panda gigante del Sichuan», riconosciuta come patrimonio naturale mondiale. È chiamata «la patria dei panda», «un prezioso patrimonio genetico biologico» e «un giardino naturale di animali e piante».","chinese":"卧龙国家级自然保护区位于四川省汶川县西南部，是我国建立最早、栖息地面积最大的大熊猫自然保护区。该保护区是世界自然遗产“四川大熊猫栖息地”的核心保护区，被誉为“熊猫之乡”“宝贵的生物基因库”“天然动植物园”。"}]},{"category":"综合知识","number":61,"question":"国家对非物质文化遗产采取哪些措施予以保存，对具有哪些价值的非物质文化遗产予以保护？","answer":"国家对非物质文化遗产采取认定、记录、建档等措施予以保存；对体现中华优秀传统文化，具有历史、文学、艺术、科学价值的非物质文化遗产采取传承、传播等措施予以保护。","italian_answer":"Lo Stato adotta misure di riconoscimento, registrazione e archiviazione per conservare il patrimonio culturale immateriale. Per gli elementi che rappresentano l’eccellente cultura tradizionale cinese e possiedono valore storico, letterario, artistico o scientifico, adotta misure di trasmissione e diffusione per proteggerli.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Lo Stato adotta misure di riconoscimento, registrazione e archiviazione per conservare il patrimonio culturale immateriale. Per gli elementi che rappresentano l’eccellente cultura tradizionale cinese e possiedono valore storico, letterario, artistico o scientifico, adotta misure di trasmissione e diffusione per proteggerli.","chinese":"国家对非物质文化遗产采取认定、记录、建档等措施予以保存；对体现中华优秀传统文化，具有历史、文学、艺术、科学价值的非物质文化遗产采取传承、传播等措施予以保护。"}]},{"category":"综合知识","number":62,"question":"截至2026年，四川省被列入联合国世界遗产的项目有哪些？","answer":"截至2026年，四川省拥有3处世界自然遗产——九寨沟、黄龙、四川大熊猫栖息地，1处世界文化与自然双重遗产——峨眉山—乐山大佛，1处世界文化遗产——青城山—都江堰。","italian_answer":"Fino al 2026, il Sichuan possiede tre siti del patrimonio naturale mondiale: Jiuzhaigou, Huanglong e l’habitat del panda gigante del Sichuan; un sito del patrimonio misto culturale e naturale: il Monte Emei e il Buddha gigante di Leshan; e un sito del patrimonio culturale mondiale: Qingchengshan e Dujiangyan.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Fino al 2026, il Sichuan possiede tre siti del patrimonio naturale mondiale: Jiuzhaigou, Huanglong e l’habitat del panda gigante del Sichuan; un sito del patrimonio misto culturale e naturale: il Monte Emei e il Buddha gigante di Leshan; e un sito del patrimonio culturale mondiale: Qingchengshan e Dujiangyan.","chinese":"截至2026年，四川省拥有3处世界自然遗产——九寨沟、黄龙、四川大熊猫栖息地，1处世界文化与自然双重遗产——峨眉山—乐山大佛，1处世界文化遗产——青城山—都江堰。"}]},{"category":"综合知识","number":63,"question":"截至2026年，四川省列入联合国“世界生物圈保护区”名录的有哪些？","answer":"截至2026年，四川省列入联合国“世界生物圈保护区”名录的有4处，分别是：九寨沟世界生物圈保护区、卧龙世界生物圈保护区、黄龙世界生物圈保护区和亚丁世界生物圈保护区。","italian_answer":"Fino al 2026, quattro siti del Sichuan sono inclusi nella Rete mondiale delle riserve della biosfera dell’UNESCO: la Riserva della biosfera di Jiuzhaigou, quella di Wolong, quella di Huanglong e quella di Yading.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Fino al 2026, quattro siti del Sichuan sono inclusi nella Rete mondiale delle riserve della biosfera dell’UNESCO: la Riserva della biosfera di Jiuzhaigou, quella di Wolong, quella di Huanglong e quella di Yading.","chinese":"截至2026年，四川省列入联合国“世界生物圈保护区”名录的有4处，分别是：九寨沟世界生物圈保护区、卧龙世界生物圈保护区、黄龙世界生物圈保护区和亚丁世界生物圈保护区。"}]},{"category":"综合知识","number":64,"question":"简要介绍九寨沟得名由来以及九寨沟的“六绝”。","answer":"得名来自景区内九个藏族寨子（树正寨、则查洼寨、黑角寨、荷叶寨、盘亚寨、亚拉寨、尖盘寨、热西寨、郭都寨）的藏民世代居住于此，故名为“九寨沟”。九寨沟“六绝”分别是翠海、彩林、雪峰、叠瀑、藏情和蓝冰。","italian_answer":"Il nome Jiuzhaigou deriva dai nove villaggi tibetani i cui abitanti vivono da generazioni nell’area: Shuzheng, Zechawa, Heijiao, Heye, Panya, Yala, Jianpan, Rexi e Guodu. Per questo la zona è stata chiamata «Valle dei nove villaggi». Le sei meraviglie di Jiuzhaigou sono: i laghi dai colori smeraldo, i boschi dai colori autunnali, le cime innevate, le cascate a terrazze, la cultura tibetana e il ghiaccio blu.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il nome Jiuzhaigou deriva dai nove villaggi tibetani i cui abitanti vivono da generazioni nell’area: Shuzheng, Zechawa, Heijiao, Heye, Panya, Yala, Jianpan, Rexi e Guodu. Per questo la zona è stata chiamata «Valle dei nove villaggi». Le sei meraviglie di Jiuzhaigou sono: i laghi dai colori smeraldo, i boschi dai colori autunnali, le cime innevate, le cascate a terrazze, la cultura tibetana e il ghiaccio blu.","chinese":"得名来自景区内九个藏族寨子（树正寨、则查洼寨、黑角寨、荷叶寨、盘亚寨、亚拉寨、尖盘寨、热西寨、郭都寨）的藏民世代居住于此，故名为“九寨沟”。九寨沟“六绝”分别是翠海、彩林、雪峰、叠瀑、藏情和蓝冰。"}]},{"category":"综合知识","number":65,"question":"简要介绍黄龙景区的特色。","answer":"黄龙景区是世界上规模最宏大、结构最完整、造型最奇特的高原地表喀斯特地貌景观。拥有世界三大“最”：最壮观的露天钙华彩池群、最大的钙华滩流、最大的钙华塌陷壁。","italian_answer":"L’area panoramica di Huanglong presenta il paesaggio carsico di superficie d’altopiano più grande al mondo, con la struttura più completa e le forme più particolari. Possiede tre primati mondiali: il gruppo più spettacolare di piscine naturali di travertino all’aperto, il più grande corso di travertino e la più grande parete di crollo di travertino.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’area panoramica di Huanglong presenta il paesaggio carsico di superficie d’altopiano più grande al mondo, con la struttura più completa e le forme più particolari. Possiede tre primati mondiali: il gruppo più spettacolare di piscine naturali di travertino all’aperto, il più grande corso di travertino e la più grande parete di crollo di travertino.","chinese":"黄龙景区是世界上规模最宏大、结构最完整、造型最奇特的高原地表喀斯特地貌景观。拥有世界三大“最”：最壮观的露天钙华彩池群、最大的钙华滩流、最大的钙华塌陷壁。"}]},{"category":"综合知识","number":66,"question":"为什么将峨眉山称为“仙山佛国”？","answer":"道教认为峨眉山是仙人聚居修身的场所，又是道士修真的地方，所以有“仙山”之称。汉末晋初，峨眉山又逐渐成为佛教四大菩萨之一的普贤菩萨的道场，因而又有“佛国”的美名。现在的峨眉山是中国四大佛教名山之一。","italian_answer":"Secondo il taoismo, il Monte Emei era un luogo in cui vivevano e si coltivavano gli immortali ed era anche un luogo di pratica spirituale per i taoisti; per questo è chiamato «montagna degli immortali». Tra la fine della dinastia Han e l’inizio della dinastia Jin, il Monte Emei divenne gradualmente il luogo sacro di Samantabhadra, uno dei quattro grandi bodhisattva del buddhismo, e fu quindi chiamato anche «regno buddhista». Oggi il Monte Emei è una delle quattro montagne sacre del buddhismo cinese.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Secondo il taoismo, il Monte Emei era un luogo in cui vivevano e si coltivavano gli immortali ed era anche un luogo di pratica spirituale per i taoisti; per questo è chiamato «montagna degli immortali». Tra la fine della dinastia Han e l’inizio della dinastia Jin, il Monte Emei divenne gradualmente il luogo sacro di Samantabhadra, uno dei quattro grandi bodhisattva del buddhismo, e fu quindi chiamato anche «regno buddhista». Oggi il Monte Emei è una delle quattro montagne sacre del buddhismo cinese.","chinese":"道教认为峨眉山是仙人聚居修身的场所，又是道士修真的地方，所以有“仙山”之称。汉末晋初，峨眉山又逐渐成为佛教四大菩萨之一的普贤菩萨的道场，因而又有“佛国”的美名。现在的峨眉山是中国四大佛教名山之一。"}]},{"category":"综合知识","number":67,"question":"武侯祠中的“三绝碑”有哪三绝（列举两种不同说法）？","answer":"武侯祠中的“三绝碑”主要有两种说法：一种是指诸葛亮的智绝、裴度的文绝和柳公绰的书绝；另一种是指裴度的文绝、柳公绰的书绝和鲁建的刻绝。","italian_answer":"La Stele delle Tre Eccellenze nel Tempio Wuhou presenta principalmente due interpretazioni. Secondo la prima, le tre eccellenze sono l’intelligenza eccezionale di Zhuge Liang, il testo di Pei Du e la calligrafia di Liu Gongchuo. Secondo la seconda, sono il testo di Pei Du, la calligrafia di Liu Gongchuo e l’incisione di Lu Jian.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La Stele delle Tre Eccellenze nel Tempio Wuhou presenta principalmente due interpretazioni. Secondo la prima, le tre eccellenze sono l’intelligenza eccezionale di Zhuge Liang, il testo di Pei Du e la calligrafia di Liu Gongchuo. Secondo la seconda, sono il testo di Pei Du, la calligrafia di Liu Gongchuo e l’incisione di Lu Jian.","chinese":"武侯祠中的“三绝碑”主要有两种说法：一种是指诸葛亮的智绝、裴度的文绝和柳公绰的书绝；另一种是指裴度的文绝、柳公绰的书绝和鲁建的刻绝。"}]},{"category":"综合知识","number":68,"question":"道教宫观内三清殿中供奉的“三清”，有何象征和含义？","answer":"三清殿中供奉的是道教至高无上的三位尊神，即玉清、上清、太清。玉清为元始天尊，象征混元世纪；上清为灵宝天尊，象征洪元世纪；太清为道德天尊，象征太初世纪。从道教的观念看，玉清、上清、太清之号，都为“大道”的别称，是道教对“道”分了三个不同层次的阐释。","italian_answer":"Nella Sala dei Tre Puri dei templi taoisti sono venerate le tre divinità supreme del taoismo: il Puro di Giada, il Puro Superiore e il Grande Puro. Il Puro di Giada è Yuanshi Tianzun e simboleggia l’era della mescolanza primordiale; il Puro Superiore è Lingbao Tianzun e simboleggia l’era Hongyuan; il Grande Puro è Daode Tianzun e simboleggia l’era Taichu. Secondo la concezione taoista, i nomi dei Tre Puri sono tutti appellativi della «Grande Via» e rappresentano tre diversi livelli di interpretazione del Tao.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Nella Sala dei Tre Puri dei templi taoisti sono venerate le tre divinità supreme del taoismo: il Puro di Giada, il Puro Superiore e il Grande Puro. Il Puro di Giada è Yuanshi Tianzun e simboleggia l’era della mescolanza primordiale; il Puro Superiore è Lingbao Tianzun e simboleggia l’era Hongyuan; il Grande Puro è Daode Tianzun e simboleggia l’era Taichu. Secondo la concezione taoista, i nomi dei Tre Puri sono tutti appellativi della «Grande Via» e rappresentano tre diversi livelli di interpretazione del Tao.","chinese":"三清殿中供奉的是道教至高无上的三位尊神，即玉清、上清、太清。玉清为元始天尊，象征混元世纪；上清为灵宝天尊，象征洪元世纪；太清为道德天尊，象征太初世纪。从道教的观念看，玉清、上清、太清之号，都为“大道”的别称，是道教对“道”分了三个不同层次的阐释。"}]},{"category":"综合知识","number":69,"question":"简要介绍阆中贡院。","answer":"阆中贡院又名清代四川贡院、川北道贡院，是清顺治年间举行乡试的场所，后作为川北道培养选拔人才的学校，是全国重点文物保护单位。始建于清顺治九年（1653年），由大门、致公堂、号舍、明远楼等建筑组成，是目前国内保存完好、格局完整的科举试院建筑，也是研究我国古代科举建筑、科举制度、古代教育制度的重要实物资料和展示场所。","italian_answer":"L’Accademia degli esami imperiali di Langzhong, chiamata anche Accademia del Sichuan della dinastia Qing o Accademia del circuito del Sichuan settentrionale, era il luogo in cui si svolgevano gli esami provinciali durante il regno Shunzhi della dinastia Qing. In seguito fu utilizzata come scuola per formare e selezionare talenti per il circuito del Sichuan settentrionale. È un’unità nazionale di protezione dei beni culturali. Fu fondata nel nono anno dell’era Shunzhi, cioè nel 1653, e comprende il portale principale, la Sala Zhigong, le celle d’esame, la Torre Mingyuan e altri edifici. È oggi una delle sedi d’esame imperiale meglio conservate in Cina, con una struttura completa, ed è un’importante testimonianza materiale per lo studio dell’architettura degli esami imperiali, del sistema degli esami e dell’istruzione antica.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’Accademia degli esami imperiali di Langzhong, chiamata anche Accademia del Sichuan della dinastia Qing o Accademia del circuito del Sichuan settentrionale, era il luogo in cui si svolgevano gli esami provinciali durante il regno Shunzhi della dinastia Qing. In seguito fu utilizzata come scuola per formare e selezionare talenti per il circuito del Sichuan settentrionale. È un’unità nazionale di protezione dei beni culturali. Fu fondata nel nono anno dell’era Shunzhi, cioè nel 1653, e comprende il portale principale, la Sala Zhigong, le celle d’esame, la Torre Mingyuan e altri edifici. È oggi una delle sedi d’esame imperiale meglio conservate in Cina, con una struttura completa, ed è un’importante testimonianza materiale per lo studio dell’architettura degli esami imperiali, del sistema degli esami e dell’istruzione antica.","chinese":"阆中贡院又名清代四川贡院、川北道贡院，是清顺治年间举行乡试的场所，后作为川北道培养选拔人才的学校，是全国重点文物保护单位。始建于清顺治九年（1653年），由大门、致公堂、号舍、明远楼等建筑组成，是目前国内保存完好、格局完整的科举试院建筑，也是研究我国古代科举建筑、科举制度、古代教育制度的重要实物资料和展示场所。"}]},{"category":"综合知识","number":70,"question":"简要介绍蜀南竹海国家级旅游度假区。","answer":"蜀南竹海旅游度假区位于四川省宜宾市，是世界上集中面积最大的天然竹林景区，也是世界罕见的集竹景、山水、湖泊、瀑布、古庙于一体，同时兼有历史悠久的人文景观，融竹文化、竹生态休闲度假为一体的旅游目的地。度假区的植被覆盖率达92.4%，绿色宜人、空气清新，是一座天然的绿色大氧吧。","italian_answer":"L’area turistica di villeggiatura della foresta di bambù del sud del Sichuan si trova a Yibin, nella provincia del Sichuan. È l’area naturale con la più grande superficie concentrata di bambù al mondo ed è un paesaggio raro che riunisce foreste di bambù, montagne, acque, laghi, cascate e antichi templi, oltre a un ricco patrimonio culturale. È una destinazione turistica che integra cultura del bambù, ecologia e vacanze ricreative. La copertura vegetale raggiunge il 92,4%; l’ambiente è verde e piacevole, l’aria è fresca e l’area è considerata una grande «barra d’ossigeno» naturale.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’area turistica di villeggiatura della foresta di bambù del sud del Sichuan si trova a Yibin, nella provincia del Sichuan. È l’area naturale con la più grande superficie concentrata di bambù al mondo ed è un paesaggio raro che riunisce foreste di bambù, montagne, acque, laghi, cascate e antichi templi, oltre a un ricco patrimonio culturale. È una destinazione turistica che integra cultura del bambù, ecologia e vacanze ricreative. La copertura vegetale raggiunge il 92,4%; l’ambiente è verde e piacevole, l’aria è fresca e l’area è considerata una grande «barra d’ossigeno» naturale.","chinese":"蜀南竹海旅游度假区位于四川省宜宾市，是世界上集中面积最大的天然竹林景区，也是世界罕见的集竹景、山水、湖泊、瀑布、古庙于一体，同时兼有历史悠久的人文景观，融竹文化、竹生态休闲度假为一体的旅游目的地。度假区的植被覆盖率达92.4%，绿色宜人、空气清新，是一座天然的绿色大氧吧。"}]},{"category":"综合知识","number":71,"question":"简要介绍都江堰水利工程。","answer":"都江堰水利工程建于公元前3世纪，是秦国蜀郡太守李冰率众修建的一座大型水利工程，是全世界至今为止，年代最久、唯一留存、至今仍在使用的以无坝引水为特征的宏大水利工程。渠首工程由鱼嘴分水堤、飞沙堰溢洪道、宝瓶口进水口三大部分构成，科学地解决了江水自动分流、自动排沙、控制进水流量等问题，使川西平原成为“水旱从人”的“天府之国”。2200多年来，至今仍发挥巨大效益。","italian_answer":"L’opera idraulica di Dujiangyan fu costruita nel III secolo a.C. da Li Bing, governatore della prefettura di Shu nello Stato di Qin, insieme ai suoi collaboratori. È la più antica grande opera idraulica al mondo ancora esistente e in funzione, e l’unica che utilizza il principio della deviazione dell’acqua senza una diga. La struttura principale comprende tre parti: il terrapieno divisorio Yuzui, lo sfioratore Feishayan e la presa d’acqua Baopingkou. Il sistema risolve in modo scientifico la divisione automatica delle acque, l’eliminazione automatica dei sedimenti e il controllo della portata in ingresso. Ha permesso alla pianura del Sichuan occidentale di diventare la «Terra dell’Abbondanza», dove l’acqua può essere controllata sia in caso di siccità sia di piena. Dopo oltre 2.200 anni, continua ancora oggi a svolgere una funzione importante.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’opera idraulica di Dujiangyan fu costruita nel III secolo a.C. da Li Bing, governatore della prefettura di Shu nello Stato di Qin, insieme ai suoi collaboratori. È la più antica grande opera idraulica al mondo ancora esistente e in funzione, e l’unica che utilizza il principio della deviazione dell’acqua senza una diga. La struttura principale comprende tre parti: il terrapieno divisorio Yuzui, lo sfioratore Feishayan e la presa d’acqua Baopingkou. Il sistema risolve in modo scientifico la divisione automatica delle acque, l’eliminazione automatica dei sedimenti e il controllo della portata in ingresso. Ha permesso alla pianura del Sichuan occidentale di diventare la «Terra dell’Abbondanza», dove l’acqua può essere controllata sia in caso di siccità sia di piena. Dopo oltre 2.200 anni, continua ancora oggi a svolgere una funzione importante.","chinese":"都江堰水利工程建于公元前3世纪，是秦国蜀郡太守李冰率众修建的一座大型水利工程，是全世界至今为止，年代最久、唯一留存、至今仍在使用的以无坝引水为特征的宏大水利工程。渠首工程由鱼嘴分水堤、飞沙堰溢洪道、宝瓶口进水口三大部分构成，科学地解决了江水自动分流、自动排沙、控制进水流量等问题，使川西平原成为“水旱从人”的“天府之国”。2200多年来，至今仍发挥巨大效益。"}]},{"category":"综合知识","number":72,"question":"简要介绍“金牛道”。","answer":"“金牛道”又名石牛道，全长约600千米，得名源自战国时期秦王伐蜀“石牛粪金、五丁开道”的故事。作为四川通往陕西、连通中原的一条重要古驿道，金牛道是古蜀道中历史最悠久、正史首载的官道，属于“古蜀道”的重要组成部分，它促进了四川同中原地区在政治、经济、文化等方面的交流。","italian_answer":"La «Via del Bue d’Oro», chiamata anche Via della Pietra del Bue, è lunga circa 600 chilometri. Il suo nome deriva dalla leggenda del periodo degli Stati Combattenti secondo cui il re di Qin usò la storia di un bue di pietra che produceva oro e dei cinque uomini forti che aprirono la strada per conquistare lo Shu. Era un’importante via postale che collegava il Sichuan allo Shaanxi e alla Cina centrale. È la strada ufficiale più antica della rete delle antiche vie dello Shu e una delle prime a essere registrate nelle fonti storiche. Favorì gli scambi politici, economici e culturali tra il Sichuan e le regioni centrali della Cina.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La «Via del Bue d’Oro», chiamata anche Via della Pietra del Bue, è lunga circa 600 chilometri. Il suo nome deriva dalla leggenda del periodo degli Stati Combattenti secondo cui il re di Qin usò la storia di un bue di pietra che produceva oro e dei cinque uomini forti che aprirono la strada per conquistare lo Shu. Era un’importante via postale che collegava il Sichuan allo Shaanxi e alla Cina centrale. È la strada ufficiale più antica della rete delle antiche vie dello Shu e una delle prime a essere registrate nelle fonti storiche. Favorì gli scambi politici, economici e culturali tra il Sichuan e le regioni centrali della Cina.","chinese":"“金牛道”又名石牛道，全长约600千米，得名源自战国时期秦王伐蜀“石牛粪金、五丁开道”的故事。作为四川通往陕西、连通中原的一条重要古驿道，金牛道是古蜀道中历史最悠久、正史首载的官道，属于“古蜀道”的重要组成部分，它促进了四川同中原地区在政治、经济、文化等方面的交流。"}]},{"category":"综合知识","number":73,"question":"列举5处四川省内的皇家陵寝，并指出其中最具有代表性的一座。","answer":"有王建墓（永陵）、孟知祥墓（和陵）、刘备墓（惠陵）、朱友燻墓（明蜀僖王陵）、朱悦燫墓（明蜀庄王陵）等，多为砖石砌筑，其中以王建墓（永陵）最具代表性。","italian_answer":"Tra le tombe imperiali del Sichuan si possono citare: la tomba di Wang Jian, chiamata Yongling; quella di Meng Zhixiang, chiamata Heling; la tomba di Liu Bei, chiamata Huiling; il mausoleo del principe Shu Xi di Ming, appartenente a Zhu Youxun; e il mausoleo del principe Shu Zhuang di Ming, appartenente a Zhu Yuelian. Molte sono costruite in mattoni e pietra. La più rappresentativa è la tomba di Wang Jian, Yongling.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Tra le tombe imperiali del Sichuan si possono citare: la tomba di Wang Jian, chiamata Yongling; quella di Meng Zhixiang, chiamata Heling; la tomba di Liu Bei, chiamata Huiling; il mausoleo del principe Shu Xi di Ming, appartenente a Zhu Youxun; e il mausoleo del principe Shu Zhuang di Ming, appartenente a Zhu Yuelian. Molte sono costruite in mattoni e pietra. La più rappresentativa è la tomba di Wang Jian, Yongling.","chinese":"有王建墓（永陵）、孟知祥墓（和陵）、刘备墓（惠陵）、朱友燻墓（明蜀僖王陵）、朱悦燫墓（明蜀庄王陵）等，多为砖石砌筑，其中以王建墓（永陵）最具代表性。"}]},{"category":"综合知识","number":74,"question":"简要介绍江口沉银遗址。","answer":"江口沉银遗址位于眉山市彭山区江口街道，地处府河与南河交汇处，俗称“岷江之口”。从2017年至2023年，经过六期围堰考古，江口沉银遗址累计出水文物7.6万余件（套），证实了流传300多年的明末“张献忠沉银”传说，入选“2017年度全国十大考古新发现”和中国“百年百大考古发现”。","italian_answer":"Il sito archeologico di Jiangkou Chenyin si trova nel quartiere di Jiangkou, nella zona di Pengshan, a Meishan, nel punto in cui si incontrano il fiume Fu e il fiume Nan, chiamato comunemente «bocca del Minjiang». Tra il 2017 e il 2023, dopo sei campagne di scavo con argini temporanei, sono stati recuperati oltre 76.000 reperti e gruppi di reperti. Le scoperte hanno confermato la leggenda, tramandata da oltre 300 anni, secondo cui Zhang Xianzhong, alla fine della dinastia Ming, affondò un tesoro nel fiume. Il sito è stato selezionato tra le dieci principali scoperte archeologiche nazionali del 2017 e tra le cento maggiori scoperte archeologiche cinesi del secolo.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il sito archeologico di Jiangkou Chenyin si trova nel quartiere di Jiangkou, nella zona di Pengshan, a Meishan, nel punto in cui si incontrano il fiume Fu e il fiume Nan, chiamato comunemente «bocca del Minjiang». Tra il 2017 e il 2023, dopo sei campagne di scavo con argini temporanei, sono stati recuperati oltre 76.000 reperti e gruppi di reperti. Le scoperte hanno confermato la leggenda, tramandata da oltre 300 anni, secondo cui Zhang Xianzhong, alla fine della dinastia Ming, affondò un tesoro nel fiume. Il sito è stato selezionato tra le dieci principali scoperte archeologiche nazionali del 2017 e tra le cento maggiori scoperte archeologiche cinesi del secolo.","chinese":"江口沉银遗址位于眉山市彭山区江口街道，地处府河与南河交汇处，俗称“岷江之口”。从2017年至2023年，经过六期围堰考古，江口沉银遗址累计出水文物7.6万余件（套），证实了流传300多年的明末“张献忠沉银”传说，入选“2017年度全国十大考古新发现”和中国“百年百大考古发现”。"}]},{"category":"综合知识","number":75,"question":"简述金沙遗址出土的金器数量和种类。","answer":"金沙遗址是中国同时期出土金器最多的遗址之一，目前已出土金器200余件，以金箔和金片为主，有金面具、金带、太阳神鸟金箔、蛙形饰、鱼形饰等。","italian_answer":"Il sito di Jinsha è uno dei siti archeologici cinesi in cui è stato rinvenuto il maggior numero di oggetti d’oro dello stesso periodo. Finora sono stati scoperti oltre 200 oggetti d’oro, soprattutto foglie e lamine d’oro. Tra questi vi sono maschere d’oro, cinture d’oro, la lamina d’oro del Sole e dell’Uccello Divino, ornamenti a forma di rana e ornamenti a forma di pesce.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il sito di Jinsha è uno dei siti archeologici cinesi in cui è stato rinvenuto il maggior numero di oggetti d’oro dello stesso periodo. Finora sono stati scoperti oltre 200 oggetti d’oro, soprattutto foglie e lamine d’oro. Tra questi vi sono maschere d’oro, cinture d’oro, la lamina d’oro del Sole e dell’Uccello Divino, ornamenti a forma di rana e ornamenti a forma di pesce.","chinese":"金沙遗址是中国同时期出土金器最多的遗址之一，目前已出土金器200余件，以金箔和金片为主，有金面具、金带、太阳神鸟金箔、蛙形饰、鱼形饰等。"}]},{"category":"综合知识","number":76,"question":"简要介绍兴文石海景区的特点。","answer":"兴文石海景区是我国喀斯特地貌发育最完善的地区之一，景区以喀斯特（岩溶）地貌为特色，以石林、溶洞为基础构景，地表奇峰林立，地下溶洞交错。2005年2月，被联合国教科文组织评定为世界地质公园。景区拥有“三绝”，分别是“中国目前规模最大的石林景观”“世界级大漏斗”“国内目前空间规模最大、系统最长的游览洞穴”。","italian_answer":"L’area panoramica di Xingwen Shihai è una delle zone in cui il paesaggio carsico si è sviluppato nel modo più completo in Cina. È caratterizzata dal carsismo e presenta foreste di pietra e grotte: in superficie si innalzano numerose cime rocciose e nel sottosuolo si intrecciano grotte. Nel febbraio 2005 è stata riconosciuta dall’UNESCO come geoparco mondiale. Possiede tre caratteristiche eccezionali: il paesaggio di foreste di pietra attualmente più esteso della Cina, una grande dolina di livello mondiale e il sistema di grotte visitabili con il maggiore sviluppo spaziale e la maggiore lunghezza del Paese.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’area panoramica di Xingwen Shihai è una delle zone in cui il paesaggio carsico si è sviluppato nel modo più completo in Cina. È caratterizzata dal carsismo e presenta foreste di pietra e grotte: in superficie si innalzano numerose cime rocciose e nel sottosuolo si intrecciano grotte. Nel febbraio 2005 è stata riconosciuta dall’UNESCO come geoparco mondiale. Possiede tre caratteristiche eccezionali: il paesaggio di foreste di pietra attualmente più esteso della Cina, una grande dolina di livello mondiale e il sistema di grotte visitabili con il maggiore sviluppo spaziale e la maggiore lunghezza del Paese.","chinese":"兴文石海景区是我国喀斯特地貌发育最完善的地区之一，景区以喀斯特（岩溶）地貌为特色，以石林、溶洞为基础构景，地表奇峰林立，地下溶洞交错。2005年2月，被联合国教科文组织评定为世界地质公园。景区拥有“三绝”，分别是“中国目前规模最大的石林景观”“世界级大漏斗”“国内目前空间规模最大、系统最长的游览洞穴”。"}]},{"category":"综合知识","number":77,"question":"梓潼“文昌宫”内所供奉的“帝君”是谁？","answer":"文昌宫内供奉的“帝君”指文昌帝君。文昌帝君原为梓潼民间流传的“梓潼神”，因屡显神灵、庇护苍生，唐玄宗追封其为“左丞”，唐僖宗又加封为“文昌帝君”，后成为天庭中专门司职官运、文运的掌管者。梓潼“文昌宫”（七曲山大庙）是公认的文昌帝君祖庭和中华文昌文化发祥地。","italian_answer":"La divinità venerata nel Tempio Wenchang è l’Imperatore Wenchang. In origine era il dio Zitong, venerato nella tradizione popolare locale. Poiché si riteneva che avesse manifestato spesso poteri miracolosi e protetto la popolazione, l’imperatore Xuanzong della dinastia Tang gli conferì il titolo di «Zuo Cheng»; in seguito, l’imperatore Xizong gli attribuì il titolo di «Imperatore Wenchang». Divenne poi la divinità celeste responsabile della carriera ufficiale e degli studi. Il Tempio Wenchang di Zitong, noto anche come Grande Tempio di Qiqushan, è riconosciuto come il luogo d’origine del culto dell’Imperatore Wenchang e della cultura Wenchang in Cina.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La divinità venerata nel Tempio Wenchang è l’Imperatore Wenchang. In origine era il dio Zitong, venerato nella tradizione popolare locale. Poiché si riteneva che avesse manifestato spesso poteri miracolosi e protetto la popolazione, l’imperatore Xuanzong della dinastia Tang gli conferì il titolo di «Zuo Cheng»; in seguito, l’imperatore Xizong gli attribuì il titolo di «Imperatore Wenchang». Divenne poi la divinità celeste responsabile della carriera ufficiale e degli studi. Il Tempio Wenchang di Zitong, noto anche come Grande Tempio di Qiqushan, è riconosciuto come il luogo d’origine del culto dell’Imperatore Wenchang e della cultura Wenchang in Cina.","chinese":"文昌宫内供奉的“帝君”指文昌帝君。文昌帝君原为梓潼民间流传的“梓潼神”，因屡显神灵、庇护苍生，唐玄宗追封其为“左丞”，唐僖宗又加封为“文昌帝君”，后成为天庭中专门司职官运、文运的掌管者。梓潼“文昌宫”（七曲山大庙）是公认的文昌帝君祖庭和中华文昌文化发祥地。"}]},{"category":"综合知识","number":78,"question":"简要介绍成都望江公园内崇丽阁的得名由来。","answer":"崇丽阁是一座高27.9米的全木结构建筑，共四层，修建于清光绪十五年（1889年）。其名取自晋人左思《蜀都赋》中对成都的评价——“既丽且崇，实号成都”。因为矗立在锦江岸边，民间称之为“望江楼”。","italian_answer":"Il Padiglione Chongli è un edificio interamente in legno, alto 27,9 metri e composto da quattro piani. Fu costruito nel quindicesimo anno dell’era Guangxu della dinastia Qing, cioè nel 1889. Il suo nome deriva da una frase del «Fu della capitale dello Shu» di Zuo Si, poeta della dinastia Jin: «bella e maestosa, così è davvero chiamata Chengdu». Poiché si trova sulle rive del fiume Jin, la gente lo chiama anche «Torre che guarda il fiume».","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il Padiglione Chongli è un edificio interamente in legno, alto 27,9 metri e composto da quattro piani. Fu costruito nel quindicesimo anno dell’era Guangxu della dinastia Qing, cioè nel 1889. Il suo nome deriva da una frase del «Fu della capitale dello Shu» di Zuo Si, poeta della dinastia Jin: «bella e maestosa, così è davvero chiamata Chengdu». Poiché si trova sulle rive del fiume Jin, la gente lo chiama anche «Torre che guarda il fiume».","chinese":"崇丽阁是一座高27.9米的全木结构建筑，共四层，修建于清光绪十五年（1889年）。其名取自晋人左思《蜀都赋》中对成都的评价——“既丽且崇，实号成都”。因为矗立在锦江岸边，民间称之为“望江楼”。"}]},{"category":"综合知识","number":79,"question":"简要介绍安岳石窟，并列举其中3处最具代表性的景点。","answer":"安岳石窟的开凿始于南北朝，盛于唐宋，延续至明清直到民国。安岳石窟以佛教石窟为主，也有道教造像及三教合一造像。安岳石窟拥有我国现存规模最大的唐代左侧全身石刻卧佛，宋代巴蜀佛教摩崖造像的杰出代表——毗卢洞紫竹观音，国内现存规模最大、保存较完整的唐代道教摩崖造像群——玄妙观。","italian_answer":"La costruzione delle grotte di Anyue iniziò durante le dinastie del Nord e del Sud, raggiunse il massimo sviluppo durante le dinastie Tang e Song e continuò fino alle dinastie Ming e Qing e persino al periodo della Repubblica di Cina. Le grotte sono soprattutto buddhiste, ma comprendono anche statue taoiste e rappresentazioni che uniscono le tre religioni. Tre siti particolarmente rappresentativi sono: il Buddha sdraiato scolpito nella roccia, la più grande statua distesa a figura intera sul lato sinistro dell’epoca Tang ancora conservata in Cina; la grotta Pilu, con la Guanyin di bambù viola, un capolavoro delle sculture buddhiste rupestri del Sichuan e del Chongqing dell’epoca Song; e il Tempio Xu Miaoguan, il più grande gruppo di statue taoiste rupestri dell’epoca Tang ancora esistente in Cina e conservato in buone condizioni.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La costruzione delle grotte di Anyue iniziò durante le dinastie del Nord e del Sud, raggiunse il massimo sviluppo durante le dinastie Tang e Song e continuò fino alle dinastie Ming e Qing e persino al periodo della Repubblica di Cina. Le grotte sono soprattutto buddhiste, ma comprendono anche statue taoiste e rappresentazioni che uniscono le tre religioni. Tre siti particolarmente rappresentativi sono: il Buddha sdraiato scolpito nella roccia, la più grande statua distesa a figura intera sul lato sinistro dell’epoca Tang ancora conservata in Cina; la grotta Pilu, con la Guanyin di bambù viola, un capolavoro delle sculture buddhiste rupestri del Sichuan e del Chongqing dell’epoca Song; e il Tempio Xu Miaoguan, il più grande gruppo di statue taoiste rupestri dell’epoca Tang ancora esistente in Cina e conservato in buone condizioni.","chinese":"安岳石窟的开凿始于南北朝，盛于唐宋，延续至明清直到民国。安岳石窟以佛教石窟为主，也有道教造像及三教合一造像。安岳石窟拥有我国现存规模最大的唐代左侧全身石刻卧佛，宋代巴蜀佛教摩崖造像的杰出代表——毗卢洞紫竹观音，国内现存规模最大、保存较完整的唐代道教摩崖造像群——玄妙观。"}]},{"category":"综合知识","number":80,"question":"简要介绍海螺沟冰川的形成原因。","answer":"海螺沟冰川是亚洲同纬度海拔最低的现代海洋性冰川，其现代冰川地貌定型于第四纪中更新世早期，目前海拔最低处仅2850米。海螺沟冰川主体海拔大都在5000米以上，这些地区积雪越厚，下层积雪承受的压力就越大，变得密实。上层积雪受太阳辐射消融后，雪水向下渗透，过冷时又再次冻结。下层冰晶在压力和冻结双重作用下，形成巨大冰体，沿山体向下活动，形成冰川。","italian_answer":"Il ghiacciaio di Hailuogou è il ghiacciaio marittimo moderno situato alla quota più bassa alla stessa latitudine in Asia. La sua morfologia glaciale attuale si è definita nella prima fase del Pleistocene medio, durante il Quaternario; il punto più basso si trova oggi a soli 2.850 metri di altitudine. La maggior parte del ghiacciaio si trova oltre i 5.000 metri. In queste zone, più spesso è il manto nevoso, maggiore è la pressione esercitata sugli strati inferiori, che diventano più compatti. Quando la radiazione solare scioglie la neve superficiale, l’acqua penetra verso il basso e, quando la temperatura scende sotto il punto di congelamento, si ricongela. Sotto l’effetto combinato della pressione e del congelamento, i cristalli di ghiaccio degli strati inferiori formano una grande massa di ghiaccio che scende lungo il versante montuoso, dando origine al ghiacciaio.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il ghiacciaio di Hailuogou è il ghiacciaio marittimo moderno situato alla quota più bassa alla stessa latitudine in Asia. La sua morfologia glaciale attuale si è definita nella prima fase del Pleistocene medio, durante il Quaternario; il punto più basso si trova oggi a soli 2.850 metri di altitudine. La maggior parte del ghiacciaio si trova oltre i 5.000 metri. In queste zone, più spesso è il manto nevoso, maggiore è la pressione esercitata sugli strati inferiori, che diventano più compatti. Quando la radiazione solare scioglie la neve superficiale, l’acqua penetra verso il basso e, quando la temperatura scende sotto il punto di congelamento, si ricongela. Sotto l’effetto combinato della pressione e del congelamento, i cristalli di ghiaccio degli strati inferiori formano una grande massa di ghiaccio che scende lungo il versante montuoso, dando origine al ghiacciaio.","chinese":"海螺沟冰川是亚洲同纬度海拔最低的现代海洋性冰川，其现代冰川地貌定型于第四纪中更新世早期，目前海拔最低处仅2850米。海螺沟冰川主体海拔大都在5000米以上，这些地区积雪越厚，下层积雪承受的压力就越大，变得密实。上层积雪受太阳辐射消融后，雪水向下渗透，过冷时又再次冻结。下层冰晶在压力和冻结双重作用下，形成巨大冰体，沿山体向下活动，形成冰川。"}]}];

function render(){let arr=filtered(),known=data.filter(x=>get(x).known).length,fav=data.filter(x=>get(x).fav).length;$('stat').textContent=`显示 ${arr.length} / ${data.length} 道题 · 已标记熟悉 ${known} 题 · 收藏 ${fav} 题`;$('bar').style.width=(known/data.length*100)+'%';let list=$('list');list.innerHTML='';if(!arr.length){list.innerHTML='<div class="empty">没有找到匹配题目。可以清除筛选后再试。</div>';return}arr.forEach(x=>{let s=get(x),a=document.createElement('article');a.className='item';a.dataset.id=sid(x);let m=document.createElement('div');m.className='meta';m.textContent=x.category+' · 第 '+x.number+' 题';let qu=document.createElement('div');qu.className='q';qu.textContent=x.number+'. '+x.question;let btn=document.createElement('button');btn.className='toggle';btn.textContent='展开中意参考答案';let ans=document.createElement('div');ans.className='answer';ans.hidden=true;let cn=document.createElement('div');cn.textContent='中文参考答案（原文）：\n'+x.answer;let it=document.createElement('div');it.className='italian';it.textContent='意大利语口语参考答案：\n'+x.italian_answer;ans.append(cn,it);let pairwrap=document.createElement('div');pairwrap.className='pairwrap';let ptitle=document.createElement('div');ptitle.className='pairtitle';ptitle.textContent='意大利语 → 中文逐点对照';pairwrap.append(ptitle);let pnote=document.createElement('div');pnote.className='pairnote';pnote.textContent=x.bilingual_pairing==='逐点对应'||x.bilingual_pairing==='逐点对应（定义/情况说明 + 处理步骤）'?'按原答案要点逐条对应；意大利语在前，中文原文在后。':'原文分段结构不完全一致，因此保留整段对照，不强行拆分句子。';pairwrap.append(pnote);(x.bilingual_pairs||[]).forEach(pair=>{let box=document.createElement('div');box.className='pair';let pi=document.createElement('div');pi.className='pair-it';pi.textContent=pair.italian;let pc=document.createElement('div');pc.className='pair-cn';pc.textContent=pair.chinese;box.append(pi,pc);pairwrap.append(box)});ans.append(pairwrap);btn.onclick=()=>{ans.hidden=!ans.hidden;btn.textContent=ans.hidden?'展开中意参考答案':'收起参考答案'};let acts=document.createElement('div');acts.className='actions';let known=document.createElement('button');known.className='tag'+(s.known?' on':'');known.textContent=s.known?'✓ 已熟悉':'标记为熟悉';known.onclick=()=>{let z=get(x);z.known=!z.known;state[sid(x)]=z;save();render()};let fav=document.createElement('button');fav.className='tag'+(s.fav?' on':'');fav.textContent=s.fav?'★ 已收藏':'☆ 收藏';fav.onclick=()=>{let z=get(x);z.fav=!z.fav;state[sid(x)]=z;save();render()};acts.append(known,fav);a.append(m,qu,btn,ans,acts);list.append(a)})}render();
