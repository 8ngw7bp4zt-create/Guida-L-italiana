agenzia di viaggi e a richiedere alla polizia locale un certificato di furto, utile per i controlli in uscita dalla Cina o per chiedere il rimborso all’assicurazione;","chinese":"若找不回被盗物品，地陪应协助失主持旅行社出具的证明到当地公安机关开具失窃证明书，以便旅游者回国出关查验或找保险公司索赔；"},{"italian":"confortare la vittima e aiutarla a superare il dispiacere.","chinese":"安慰失主，缓解不快情绪。"}]},{"category":"应变能力","number":14,"question":"一位外籍旅游者在乘坐国际航班来华途中丢失了行李，地陪导游员应该如何处理？","answer":"（1）地陪导游应详细了解情况，协助查找线索，协助旅游者在航班所属航空公司备案登记；\n\n（2）帮助旅游者解决因丢失行李而造成的生活不便；\n\n（3）如找不回行李，应备齐相关资料和手续，协助旅游者向所属航空公司索赔。","italian_answer":"Se un turista straniero perde il bagaglio durante il volo internazionale verso la Cina, la guida locale deve:\n1. raccogliere informazioni dettagliate, aiutare a cercare indizi e assistere il turista nella registrazione della denuncia presso la compagnia aerea che opera il volo;\n2. aiutarlo a risolvere i disagi pratici causati dalla perdita del bagaglio;\n3. se il bagaglio non viene ritrovato, preparare tutti i documenti e le formalità necessari e assistere il turista nella richiesta di risarcimento alla compagnia aerea.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"raccogliere informazioni dettagliate, aiutare a cercare indizi e assistere il turista nella registrazione della denuncia presso la compagnia aerea che opera il volo;","chinese":"地陪导游应详细了解情况，协助查找线索，协助旅游者在航班所属航空公司备案登记；"},{"italian":"aiutarlo a risolvere i disagi pratici causati dalla perdita del bagaglio;","chinese":"帮助旅游者解决因丢失行李而造成的生活不便；"},{"italian":"se il bagaglio non viene ritrovato, preparare tutti i documenti e le formalità necessari e assistere il turista nella richiesta di risarcimento alla compagnia aerea.","chinese":"如找不回行李，应备齐相关资料和手续，协助旅游者向所属航空公司索赔。"}]},{"category":"应变能力","number":15,"question":"一外籍旅游团即将乘火车离开某市，一名旅游者突然发现他的相机变焦镜头遗失了，又记不清丢在何处。该团明早抵北京后，当晚就要回国，此时地陪导游应如何处理？","answer":"（1）安慰旅游者，让其回忆最后使用该镜头的时间、地点，并积极协助查找；\n\n（2）记录客人的姓名、详细地址和电话，以备找到后返还失主；\n\n（3）客人离站后，如找到，应设法转交，产生的费用由旅游者自理；\n\n（4）如没有找到，旅行社应进行说明、致歉。","italian_answer":"Se un turista perde l’obiettivo zoom della macchina fotografica poco prima che il gruppo parta in treno e non ricorda dove lo abbia lasciato, mentre il gruppo arriverà a Pechino la mattina seguente e tornerà nel proprio Paese quella sera stessa, la guida locale deve:\n1. rassicurare il turista, aiutarlo a ricordare quando e dove ha usato l’obiettivo l’ultima volta e collaborare attivamente alle ricerche;\n2. annotare il nome, l’indirizzo completo e il numero di telefono del turista, in modo da poterlo contattare e restituirgli l’obiettivo se viene ritrovato;\n3. se l’obiettivo viene ritrovato dopo la partenza del turista, organizzare la restituzione; le spese sono a carico del turista;\n4. se non viene ritrovato, l’agenzia di viaggi deve fornire spiegazioni e porgere le proprie scuse.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"rassicurare il turista, aiutarlo a ricordare quando e dove ha usato l’obiettivo l’ultima volta e collaborare attivamente alle ricerche;","chinese":"安慰旅游者，让其回忆最后使用该镜头的时间、地点，并积极协助查找；"},{"italian":"annotare il nome, l’indirizzo completo e il numero di telefono del turista, in modo da poterlo contattare e restituirgli l’obiettivo se viene ritrovato;","chinese":"记录客人的姓名、详细地址和电话，以备找到后返还失主；"},{"italian":"se l’obiettivo viene ritrovato dopo la partenza del turista, organizzare la restituzione; le spese sono a carico del turista;","chinese":"客人离站后，如找到，应设法转交，产生的费用由旅游者自理；"},{"italian":"se non viene ritrovato, l’agenzia di viaggi deve fornire spiegazioni e porgere le proprie scuse.","chinese":"如没有找到，旅行社应进行说明、致歉。"}]},{"category":"应变能力","number":16,"question":"地陪导游陪同团队在大型市场购物时，由于人多拥挤，一位旅游者突然发现钱包不见了，此时地陪导游应如何处理？","answer":"（1）安慰旅游者，分析可能丢失的时间、地点，积极协助旅游者寻找；\n\n（2）如果寻找未果，应让旅游者回忆可疑人员的特征，向当地公安机关报案，告知事情发生的经过、时间、地点、犯罪嫌疑人的特征，并将受害人的姓名、单位、电话及钱包的样式、钱物数量讲清，以便破案时联系；\n\n（3）向旅行社汇报，陈述事故报告；\n\n（4）做好善后工作，安抚受害者及其他旅游者。","italian_answer":"Se, durante gli acquisti in un grande mercato affollato, un turista si accorge di aver perso il portafoglio, la guida locale deve:\n1. rassicurarlo, cercare di ricostruire il momento e il luogo probabili della perdita e aiutarlo attivamente nelle ricerche;\n2. se le ricerche non danno risultati, chiedergli di ricordare le caratteristiche delle persone sospette e accompagnarlo a denunciare il fatto alla polizia locale. Occorre riferire come sono avvenuti i fatti, l’ora, il luogo e le caratteristiche dei sospetti, indicando anche il nome, l’ente di appartenenza e il numero di telefono della vittima, nonché il tipo di portafoglio e la quantità di denaro e di oggetti contenuti, così da facilitare i contatti durante le indagini;\n3. riferire l’accaduto all’agenzia di viaggi e redigere una relazione sull’incidente;\n4. occuparsi delle misure successive e rassicurare sia la vittima sia gli altri turisti.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"rassicurarlo, cercare di ricostruire il momento e il luogo probabili della perdita e aiutarlo attivamente nelle ricerche;","chinese":"安慰旅游者，分析可能丢失的时间、地点，积极协助旅游者寻找；"},{"italian":"se le ricerche non danno risultati, chiedergli di ricordare le caratteristiche delle persone sospette e accompagnarlo a denunciare il fatto alla polizia locale. Occorre riferire come sono avvenuti i fatti, l’ora, il luogo e le caratteristiche dei sospetti, indicando anche il nome, l’ente di appartenenza e il numero di telefono della vittima, nonché il tipo di portafoglio e la quantità di denaro e di oggetti contenuti, così da facilitare i contatti durante le indagini;","chinese":"如果寻找未果，应让旅游者回忆可疑人员的特征，向当地公安机关报案，告知事情发生的经过、时间、地点、犯罪嫌疑人的特征，并将受害人的姓名、单位、电话及钱包的样式、钱物数量讲清，以便破案时联系；"},{"italian":"riferire l’accaduto all’agenzia di viaggi e redigere una relazione sull’incidente;","chinese":"向旅行社汇报，陈述事故报告；"},{"italian":"occuparsi delle misure successive e rassicurare sia la vittima sia gli altri turisti.","chinese":"做好善后工作，安抚受害者及其他旅游者。"}]},{"category":"应变能力","number":17,"question":"一入境旅游团来华旅游，团队乘坐火车抵达边境城市后，有旅游者发现自己的托运行李丢失，此时地陪导游应如何处理？","answer":"（1）地陪导游应帮助旅游者积极寻找；\n\n（2）陪同旅游者到车站失物招领处办理行李丢失手续，说清行李的件数、大小、特征等，填写失物登记表，并将在当地下榻饭店名称和电话号码告知，以便联系；\n\n（3）如果找到行李，导游应设法将行李交还失主。如果行李确实丢失，失主可持车票、托运行李单向承运人索赔；\n\n（4）事后写出书面报告。","italian_answer":"Se, dopo essere arrivato in treno in una città di confine, un turista di un gruppo in entrata scopre che il suo bagaglio registrato è scomparso, la guida locale deve:\n1. aiutarlo attivamente a cercare il bagaglio;\n2. accompagnarlo all’ufficio oggetti smarriti della stazione per svolgere le pratiche necessarie. Deve indicare il numero, le dimensioni e le caratteristiche dei bagagli, compilare il modulo di registrazione e comunicare il nome e il numero di telefono dell’albergo in cui alloggia il gruppo, in modo da poter essere ricontattato;\n3. se il bagaglio viene ritrovato, organizzare la restituzione al proprietario. Se risulta effettivamente perduto, il turista può chiedere il risarcimento al vettore presentando il biglietto e la ricevuta del bagaglio registrato;\n4. redigere successivamente una relazione scritta.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"aiutarlo attivamente a cercare il bagaglio;","chinese":"地陪导游应帮助旅游者积极寻找；"},{"italian":"accompagnarlo all’ufficio oggetti smarriti della stazione per svolgere le pratiche necessarie. Deve indicare il numero, le dimensioni e le caratteristiche dei bagagli, compilare il modulo di registrazione e comunicare il nome e il numero di telefono dell’albergo in cui alloggia il gruppo, in modo da poter essere ricontattato;","chinese":"陪同旅游者到车站失物招领处办理行李丢失手续，说清行李的件数、大小、特征等，填写失物登记表，并将在当地下榻饭店名称和电话号码告知，以便联系；"},{"italian":"se il bagaglio viene ritrovato, organizzare la restituzione al proprietario. Se risulta effettivamente perduto, il turista può chiedere il risarcimento al vettore presentando il biglietto e la ricevuta del bagaglio registrato;","chinese":"如果找到行李，导游应设法将行李交还失主。如果行李确实丢失，失主可持车票、托运行李单向承运人索赔；"},{"italian":"redigere successivamente una relazione scritta.","chinese":"事后写出书面报告。"}]},{"category":"应变能力","number":18,"question":"地陪导游带领团队泡温泉前，应提醒旅游者哪些不适宜泡温泉的情形？","answer":"（1）癌症、白血病患者不宜泡温泉，以防刺激新陈代谢，加速身体衰弱；\n\n（2）皮肤有伤口、溃烂、真菌感染或过敏性皮肤疾病患者不宜泡温泉；\n\n（3）女性生理期来时或前后，怀孕的初期和末期，不宜泡温泉；\n\n（4）睡眠不足、营养不良、大病初愈等身体疲惫状态下，不宜泡温泉。","italian_answer":"Prima di accompagnare il gruppo alle terme, la guida locale deve ricordare ai turisti in quali situazioni è sconsigliato fare il bagno termale:\n1. alle persone affette da cancro o leucemia, perché la stimolazione del metabolismo può accelerare il debilitamento fisico;\n2. alle persone con ferite, ulcere, infezioni fungine o malattie cutanee allergiche;\n3. alle donne durante il periodo mestruale o nei giorni immediatamente precedenti o successivi, e alle donne nelle prime o ultime fasi della gravidanza;\n4. alle persone molto stanche per mancanza di sonno, malnutrizione o perché si sono appena riprese da una grave malattia.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"alle persone affette da cancro o leucemia, perché la stimolazione del metabolismo può accelerare il debilitamento fisico;","chinese":"癌症、白血病患者不宜泡温泉，以防刺激新陈代谢，加速身体衰弱；"},{"italian":"alle persone con ferite, ulcere, infezioni fungine o malattie cutanee allergiche;","chinese":"皮肤有伤口、溃烂、真菌感染或过敏性皮肤疾病患者不宜泡温泉；"},{"italian":"alle donne durante il periodo mestruale o nei giorni immediatamente precedenti o successivi, e alle donne nelle prime o ultime fasi della gravidanza;","chinese":"女性生理期来时或前后，怀孕的初期和末期，不宜泡温泉；"},{"italian":"alle persone molto stanche per mancanza di sonno, malnutrizione o perché si sono appena riprese da una grave malattia.","chinese":"睡眠不足、营养不良、大病初愈等身体疲惫状态下，不宜泡温泉。"}]},{"category":"应变能力","number":19,"question":"在一处山岳型景区游览时，团队中有一名旅游者长时间失联，此时地陪导游应如何处理？","answer":"（1）向其他旅游者了解情况，并请全陪导游配合，安排旅游者随行亲朋或团队代表与其共同寻找旅游者，同时与景区、住宿经营者等可能有线索的相关接待者联系，地陪导游带团继续游览；\n\n（2）及时向旅行社报告，反映旅游者走失详细情况，取得指导与帮助并通知走失旅游者家属；\n\n（3）走失24小时仍未找到的，立即向走失地公安机关报案，寻求帮助；\n\n（4）旅游者是老年人、未成年人、残疾人等特殊人群的，应立即报警。","italian_answer":"Se, durante una visita in un’area montuosa, un turista rimane irreperibile per molto tempo, la guida locale deve:\n1. chiedere informazioni agli altri turisti e chiedere la collaborazione della guida accompagnatrice. Organizzare la ricerca insieme ai familiari o a un rappresentante del gruppo che accompagna il turista; contattare inoltre il personale dell’area panoramica, delle strutture ricettive e gli altri operatori che potrebbero avere informazioni. Nel frattempo, la guida locale continua la visita con il resto del gruppo;\n2. informare tempestivamente l’agenzia di viaggi, riferire in dettaglio la scomparsa, chiedere indicazioni e assistenza e avvisare i familiari del turista;\n3. se il turista non viene ritrovato entro 24 ore, denunciare immediatamente la scomparsa alla polizia del luogo;\n4. se il turista è anziano, minorenne, disabile o appartiene a un’altra categoria di persone vulnerabili, chiamare subito la polizia.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"chiedere informazioni agli altri turisti e chiedere la collaborazione della guida accompagnatrice. Organizzare la ricerca insieme ai familiari o a un rappresentante del gruppo che accompagna il turista; contattare inoltre il personale dell’area panoramica, delle strutture ricettive e gli altri operatori che potrebbero avere informazioni. Nel frattempo, la guida locale continua la visita con il resto del gruppo;","chinese":"向其他旅游者了解情况，并请全陪导游配合，安排旅游者随行亲朋或团队代表与其共同寻找旅游者，同时与景区、住宿经营者等可能有线索的相关接待者联系，地陪导游带团继续游览；"},{"italian":"informare tempestivamente l’agenzia di viaggi, riferire in dettaglio la scomparsa, chiedere indicazioni e assistenza e avvisare i familiari del turista;","chinese":"及时向旅行社报告，反映旅游者走失详细情况，取得指导与帮助并通知走失旅游者家属；"},{"italian":"se il turista non viene ritrovato entro 24 ore, denunciare immediatamente la scomparsa alla polizia del luogo;","chinese":"走失24小时仍未找到的，立即向走失地公安机关报案，寻求帮助；"},{"italian":"se il turista è anziano, minorenne, disabile o appartiene a un’altra categoria di persone vulnerabili, chiamare subito la polizia.","chinese":"旅游者是老年人、未成年人、残疾人等特殊人群的，应立即报警。"}]},{"category":"应变能力","number":20,"question":"作为一名地陪导游，应如何预防旅游者的行李丢失？","answer":"（1）多做提醒工作；\n\n（2）做醒目记号，提前在行李箱粘贴标签或系挂行李牌等；\n\n（3）做好行李清点，尤其在交接过程中，务必做好行李件数的清点；\n\n（4）提醒司机锁好旅游车行李舱和门窗。","italian_answer":"Per prevenire lo smarrimento dei bagagli dei turisti, la guida locale deve:\n1. ricordare spesso ai turisti di prestare attenzione ai propri bagagli;\n2. applicare in anticipo segni ben visibili, come etichette o cartellini identificativi, sulle valigie;\n3. contare con attenzione tutti i bagagli, soprattutto durante le operazioni di consegna e passaggio;\n4. ricordare all’autista di chiudere a chiave il vano bagagli e di assicurarsi che le portiere e i finestrini del pullman siano chiusi.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"ricordare spesso ai turisti di prestare attenzione ai propri bagagli;","chinese":"多做提醒工作；"},{"italian":"applicare in anticipo segni ben visibili, come etichette o cartellini identificativi, sulle valigie;","chinese":"做醒目记号，提前在行李箱粘贴标签或系挂行李牌等；"},{"italian":"contare con attenzione tutti i bagagli, soprattutto durante le operazioni di consegna e passaggio;","chinese":"做好行李清点，尤其在交接过程中，务必做好行李件数的清点；"},{"italian":"ricordare all’autista di chiudere a chiave il vano bagagli e di assicurarsi che le portiere e i finestrini del pullman siano chiusi.","chinese":"提醒司机锁好旅游车行李舱和门窗。"}]},{"category":"应变能力","number":21,"question":"在带团游览过程中，如果遇到犯罪分子抢劫旅游者财物，导游应如何处理？","answer":"（1）立即采取保护旅游者措施；\n\n（2）马上报警求助；\n\n（3）安抚旅游者情绪；\n\n（4）做好善后工作，将情况及时汇报给旅行社，并协助有关方面做好善后工作。","italian_answer":"Se, durante una visita, dei criminali rapinano i turisti, la guida deve:\n1. adottare immediatamente misure per proteggere i turisti;\n2. chiamare subito la polizia e chiedere aiuto;\n3. calmare i turisti;\n4. occuparsi delle misure successive, riferire tempestivamente l’accaduto all’agenzia di viaggi e collaborare con gli enti competenti per gestire la situazione.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"adottare immediatamente misure per proteggere i turisti;","chinese":"立即采取保护旅游者措施；"},{"italian":"chiamare subito la polizia e chiedere aiuto;","chinese":"马上报警求助；"},{"italian":"calmare i turisti;","chinese":"安抚旅游者情绪；"},{"italian":"occuparsi delle misure successive, riferire tempestivamente l’accaduto all’agenzia di viaggi e collaborare con gli enti competenti per gestire la situazione.","chinese":"做好善后工作，将情况及时汇报给旅行社，并协助有关方面做好善后工作。"}]},{"category":"应变能力","number":22,"question":"旅游团中部分旅游者因食用了海产品出现呕吐腹泻、乏力、昏迷症状，导游应如何处理？","answer":"这是食物中毒引起的急性肠炎症状，如果抢救不及时，会有生命危险。导游应该：\n\n（1）立即与当地医疗机构联系救助事宜，并设法催吐，同时对食品进行留样，取得旅游者呕吐物的样本；\n\n（2）将旅游者送至医疗机构或医院救治，并保留相关证据；\n\n（3）及时向旅行社及其所在地旅游主管部门、发生地旅游主管部门和疾病预防控制机构报告，反映旅游者食物中毒的详细情况。","italian_answer":"Se alcuni turisti del gruppo, dopo aver mangiato prodotti di mare, presentano vomito, diarrea, debolezza o perdita di coscienza, si tratta di sintomi di gastroenterite acuta causata da intossicazione alimentare. Se i soccorsi non sono tempestivi, la situazione può mettere in pericolo la vita. La guida deve:\n1. contattare immediatamente le strutture mediche locali per chiedere assistenza, cercare di provocare il vomito e conservare campioni degli alimenti e del vomito dei turisti;\n2. accompagnare i turisti presso una struttura medica o un ospedale per le cure e conservare le prove pertinenti;\n3. riferire tempestivamente i dettagli dell’intossicazione all’agenzia di viaggi, all’autorità turistica competente del luogo in cui ha sede l’agenzia, all’autorità turistica del luogo in cui è avvenuto l’incidente e agli organismi di prevenzione e controllo delle malattie.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"Si tratta di sintomi di gastroenterite acuta causata da intossicazione alimentare. Se i soccorsi non sono tempestivi, la situazione può mettere in pericolo la vita. La guida deve:","chinese":"这是食物中毒引起的急性肠炎症状，如果抢救不及时，会有生命危险。导游应该："},{"italian":"contattare immediatamente le strutture mediche locali per chiedere assistenza, cercare di provocare il vomito e conservare campioni degli alimenti e del vomito dei turisti;","chinese":"立即与当地医疗机构联系救助事宜，并设法催吐，同时对食品进行留样，取得旅游者呕吐物的样本；"},{"italian":"accompagnare i turisti presso una struttura medica o un ospedale per le cure e conservare le prove pertinenti;","chinese":"将旅游者送至医疗机构或医院救治，并保留相关证据；"},{"italian":"riferire tempestivamente i dettagli dell’intossicazione all’agenzia di viaggi, all’autorità turistica competente del luogo in cui ha sede l’agenzia, all’autorità turistica del luogo in cui è avvenuto l’incidente e agli organismi di prevenzione e controllo delle malattie.","chinese":"及时向旅行社及其所在地旅游主管部门、发生地旅游主管部门和疾病预防控制机构报告，反映旅游者食物中毒的详细情况。"}]},{"category":"应变能力","number":23,"question":"在团队游览中，如遇到旅游者中暑，导游应如何处理？","answer":"（1）转移至阴凉环境。若当事人意识清醒，让其采取坐姿休息；若已失去意识，应迅速找干爽位置平躺，帮其解开衣领，放松裤带；\n\n（2）进行物理降温。面色潮红，出现发烧时，可以用凉水擦拭身体；\n\n（3）采取药物治疗。可征询旅游者本人或其随行亲人意见，是否服用自带的藿香正气水、十滴水等防暑药物，并及时请求景区工作人员协助；\n\n（4）及时送医治疗。经过上述处理，不适症状仍没能得到改善，就应及时送往医院进一步治疗。","italian_answer":"Se durante la visita un turista subisce un colpo di calore, la guida deve:\n1. trasferirlo in un luogo fresco. Se è cosciente, farlo riposare seduto; se ha perso conoscenza, adagiarlo rapidamente in posizione supina in un luogo asciutto, slacciargli il colletto e allentargli la cintura;\n2. procedere al raffreddamento fisico. Se il viso è arrossato e compare la febbre, si può pulire il corpo con acqua fresca;\n3. valutare l’uso di medicinali. Chiedere al turista o ai familiari che lo accompagnano se può assumere i farmaci contro il caldo che ha con sé, come Huoxiang Zhengqi Shui o Shidishui, e chiedere tempestivamente aiuto al personale dell’area turistica;\n4. se i sintomi non migliorano dopo questi interventi, accompagnarlo tempestivamente in ospedale per ulteriori cure.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"trasferirlo in un luogo fresco. Se è cosciente, farlo riposare seduto; se ha perso conoscenza, adagiarlo rapidamente in posizione supina in un luogo asciutto, slacciargli il colletto e allentargli la cintura;","chinese":"转移至阴凉环境。若当事人意识清醒，让其采取坐姿休息；若已失去意识，应迅速找干爽位置平躺，帮其解开衣领，放松裤带；"},{"italian":"procedere al raffreddamento fisico. Se il viso è arrossato e compare la febbre, si può pulire il corpo con acqua fresca;","chinese":"进行物理降温。面色潮红，出现发烧时，可以用凉水擦拭身体；"},{"italian":"valutare l’uso di medicinali. Chiedere al turista o ai familiari che lo accompagnano se può assumere i farmaci contro il caldo che ha con sé, come Huoxiang Zhengqi Shui o Shidishui, e chiedere tempestivamente aiuto al personale dell’area turistica;","chinese":"采取药物治疗。可征询旅游者本人或其随行亲人意见，是否服用自带的藿香正气水、十滴水等防暑药物，并及时请求景区工作人员协助；"},{"italian":"se i sintomi non migliorano dopo questi interventi, accompagnarlo tempestivamente in ospedale per ulteriori cure.","chinese":"及时送医治疗。经过上述处理，不适症状仍没能得到改善，就应及时送往医院进一步治疗。"}]},{"category":"应变能力","number":24,"question":"行程中，旅游者患一般疾病，地陪导游应如何处理？","answer":"（1）及时了解情况，不允许擅自给患者用药；\n\n（2）如有需要，陪同患者前往医院就诊，并按规定履行报告义务；\n\n（3）协助旅游者向保险公司办理理赔事宜。","italian_answer":"Se durante il viaggio un turista si ammala in modo non grave, la guida locale deve:\n1. informarsi tempestivamente sulle sue condizioni e non somministrargli medicinali di propria iniziativa;\n2. se necessario, accompagnarlo in ospedale e adempiere agli obblighi di comunicazione previsti;\n3. aiutarlo a presentare la richiesta di rimborso alla compagnia assicurativa.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"informarsi tempestivamente sulle sue condizioni e non somministrargli medicinali di propria iniziativa;","chinese":"及时了解情况，不允许擅自给患者用药；"},{"italian":"se necessario, accompagnarlo in ospedale e adempiere agli obblighi di comunicazione previsti;","chinese":"如有需要，陪同患者前往医院就诊，并按规定履行报告义务；"},{"italian":"aiutarlo a presentare la richiesta di rimborso alla compagnia assicurativa.","chinese":"协助旅游者向保险公司办理理赔事宜。"}]},{"category":"应变能力","number":25,"question":"行程中，外籍旅游者突患重病，地陪导游应如何处理？","answer":"（1）应立即拨打急救电话求救，或协调患者亲友送患者去医疗机构或医院抢救，或请医生前来抢救，并及时报告旅行社；\n\n（2）患者如系急救组织投保者，应协助旅游者及时与该组织的代理机构联系，并报告旅行社；\n\n（3）在抢救过程中，领队或患者亲属应在场，并协助患者通知其所在国驻华使领馆；\n\n（4）妥善安排好其他旅游者的活动，地陪导游带团继续游览。","italian_answer":"Se durante il viaggio un turista straniero si ammala improvvisamente e gravemente, la guida locale deve:\n1. chiamare subito i soccorsi oppure organizzare il trasferimento del paziente presso una struttura medica o un ospedale con l’aiuto dei familiari o degli amici, oppure chiedere l’intervento di un medico; informare tempestivamente l’agenzia di viaggi;\n2. se il paziente è assicurato tramite un’organizzazione di assistenza e soccorso, aiutarlo a contattare tempestivamente l’agenzia rappresentante di tale organizzazione e informare l’agenzia di viaggi;\n3. durante i soccorsi, assicurarsi che siano presenti il capogruppo o i familiari del paziente e aiutarli a informare l’ambasciata o il consolato del suo Paese in Cina;\n4. organizzare adeguatamente le attività degli altri turisti e proseguire la visita con il resto del gruppo.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"chiamare subito i soccorsi oppure organizzare il trasferimento del paziente presso una struttura medica o un ospedale con l’aiuto dei familiari o degli amici, oppure chiedere l’intervento di un medico; informare tempestivamente l’agenzia di viaggi;","chinese":"应立即拨打急救电话求救，或协调患者亲友送患者去医疗机构或医院抢救，或请医生前来抢救，并及时报告旅行社；"},{"italian":"se il paziente è assicurato tramite un’organizzazione di assistenza e soccorso, aiutarlo a contattare tempestivamente l’agenzia rappresentante di tale organizzazione e informare l’agenzia di viaggi;","chinese":"患者如系急救组织投保者，应协助旅游者及时与该组织的代理机构联系，并报告旅行社；"},{"italian":"durante i soccorsi, assicurarsi che siano presenti il capogruppo o i familiari del paziente e aiutarli a informare l’ambasciata o il consolato del suo Paese in Cina;","chinese":"在抢救过程中，领队或患者亲属应在场，并协助患者通知其所在国驻华使领馆；"},{"italian":"organizzare adeguatamente le attività degli altri turisti e proseguire la visita con il resto del gruppo.","chinese":"妥善安排好其他旅游者的活动，地陪导游带团继续游览。"}]},{"category":"应变能力","number":26,"question":"旅游团在回程途中遭遇车祸，部分旅游者受伤，地陪导游应如何处理？","answer":"（1）立即组织抢救。应优先救助伤员，对受伤比较严重的，应立即拨打120求助，并在120的指导下展开力所能及的科学急救；\n\n（2）保护现场并立即报案。保持冷静，保护事故现场，立马拨打或安排人员拨打交通事故报警电话122，等交警抵达后，协助进行现场处置；\n\n（3）迅速上报旅行社。听取旅行社的建议与安排，妥善处理现场问题；\n\n（4）做好安抚工作。根据事故整体情况和旅游者意愿，调整好后续的行程安排。","italian_answer":"Se il gruppo subisce un incidente stradale durante il viaggio di ritorno e alcuni turisti rimangono feriti, la guida locale deve:\n1. organizzare immediatamente i soccorsi, dando priorità ai feriti. Per quelli più gravi, chiamare subito il 120 e prestare, seguendo le indicazioni dei soccorritori, il primo soccorso possibile in modo corretto;\n2. proteggere il luogo dell’incidente e avvisare immediatamente la polizia. Mantenere la calma, preservare la scena e chiamare, o far chiamare, il numero 122 per gli incidenti stradali; all’arrivo della polizia stradale, collaborare alla gestione del luogo;\n3. informare rapidamente l’agenzia di viaggi, ascoltare i suoi consigli e seguire le sue disposizioni per gestire la situazione;\n4. rassicurare i turisti e modificare il programma successivo in base alla situazione generale e alla volontà dei turisti.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"organizzare immediatamente i soccorsi, dando priorità ai feriti. Per quelli più gravi, chiamare subito il 120 e prestare, seguendo le indicazioni dei soccorritori, il primo soccorso possibile in modo corretto;","chinese":"立即组织抢救。应优先救助伤员，对受伤比较严重的，应立即拨打120求助，并在120的指导下展开力所能及的科学急救；"},{"italian":"proteggere il luogo dell’incidente e avvisare immediatamente la polizia. Mantenere la calma, preservare la scena e chiamare, o far chiamare, il numero 122 per gli incidenti stradali; all’arrivo della polizia stradale, collaborare alla gestione del luogo;","chinese":"保护现场并立即报案。保持冷静，保护事故现场，立马拨打或安排人员拨打交通事故报警电话122，等交警抵达后，协助进行现场处置；"},{"italian":"informare rapidamente l’agenzia di viaggi, ascoltare i suoi consigli e seguire le sue disposizioni per gestire la situazione;","chinese":"迅速上报旅行社。听取旅行社的建议与安排，妥善处理现场问题；"},{"italian":"rassicurare i turisti e modificare il programma successivo in base alla situazione generale e alla volontà dei turisti.","chinese":"做好安抚工作。根据事故整体情况和旅游者意愿，调整好后续的行程安排。"}]},{"category":"应变能力","number":27,"question":"旅游团中一位旅游者在景区内爬山时不慎摔伤，造成小腿骨折，此时地陪导游应如何处理？","answer":"（1）安慰旅游者，并第一时间请景区工作人员或团队中有急救经验的人员帮助实施紧急救护。如导游经过专业培训，可第一时间开展现场紧急救护；\n\n（2）及时送医院救治。保存好诊断书、医疗费用清单，以备向保险公司索赔；\n\n（3）报告旅行社，并在事后写出事故报告。","italian_answer":"Se un turista cade mentre percorre un sentiero di montagna in un’area panoramica e riporta una frattura alla parte inferiore della gamba, la guida locale deve:\n1. rassicurarlo e chiedere immediatamente aiuto al personale dell’area o a membri del gruppo con esperienza di primo soccorso. Se ha ricevuto una formazione professionale, può prestare subito il primo soccorso sul posto;\n2. accompagnarlo tempestivamente in ospedale e conservare il referto medico e l’elenco delle spese sanitarie, necessari per la richiesta di rimborso all’assicurazione;\n3. informare l’agenzia di viaggi e redigere successivamente una relazione sull’incidente.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"rassicurarlo e chiedere immediatamente aiuto al personale dell’area o a membri del gruppo con esperienza di primo soccorso. Se ha ricevuto una formazione professionale, può prestare subito il primo soccorso sul posto;","chinese":"安慰旅游者，并第一时间请景区工作人员或团队中有急救经验的人员帮助实施紧急救护。如导游经过专业培训，可第一时间开展现场紧急救护；"},{"italian":"accompagnarlo tempestivamente in ospedale e conservare il referto medico e l’elenco delle spese sanitarie, necessari per la richiesta di rimborso all’assicurazione;","chinese":"及时送医院救治。保存好诊断书、医疗费用清单，以备向保险公司索赔；"},{"italian":"informare l’agenzia di viaggi e redigere successivamente una relazione sull’incidente.","chinese":"报告旅行社，并在事后写出事故报告。"}]},{"category":"应变能力","number":28,"question":"旅游途中，一名旅游者向同团游客散发含有高额投资回报内容的宣传材料，地陪导游应如何处理？","answer":"（1）礼貌劝阻，及时制止散发宣传材料的行为，注意沟通方式，避免激化矛盾；\n\n（2）向该旅游者提示，许诺高额投资回报的项目往往潜藏较大金融风险，此类投资推介活动须依法取得相应资质，不得随意向他人宣传推介，应当遵守国家金融管理相关法律法规；\n\n（3）经劝阻仍拒不停止，继续散发、有可能造成不良影响的，地陪导游应第一时间向旅行社报告，视情况报请公安机关处置。","italian_answer":"Se durante il viaggio un turista distribuisce agli altri membri del gruppo materiale promozionale che promette rendimenti molto elevati sugli investimenti, la guida locale deve:\n1. invitarlo con cortesia a fermarsi e interrompere tempestivamente la distribuzione, scegliendo un modo di comunicare che eviti di aggravare il conflitto;\n2. spiegargli che i progetti che promettono rendimenti molto elevati comportano spesso notevoli rischi finanziari; le attività di promozione degli investimenti devono possedere le qualifiche e le autorizzazioni previste dalla legge e non possono essere promosse liberamente ad altre persone. Occorre rispettare le leggi e i regolamenti nazionali in materia di gestione finanziaria;\n3. se, nonostante l’avvertimento, continua a distribuire il materiale e può causare conseguenze negative, informare immediatamente l’agenzia di viaggi e, secondo la situazione, chiedere l’intervento della polizia.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"invitarlo con cortesia a fermarsi e interrompere tempestivamente la distribuzione, scegliendo un modo di comunicare che eviti di aggravare il conflitto;","chinese":"礼貌劝阻，及时制止散发宣传材料的行为，注意沟通方式，避免激化矛盾；"},{"italian":"spiegargli che i progetti che promettono rendimenti molto elevati comportano spesso notevoli rischi finanziari; le attività di promozione degli investimenti devono possedere le qualifiche e le autorizzazioni previste dalla legge e non possono essere promosse liberamente ad altre persone. Occorre rispettare le leggi e i regolamenti nazionali in materia di gestione finanziaria;","chinese":"向该旅游者提示，许诺高额投资回报的项目往往潜藏较大金融风险，此类投资推介活动须依法取得相应资质，不得随意向他人宣传推介，应当遵守国家金融管理相关法律法规；"},{"italian":"se, nonostante l’avvertimento, continua a distribuire il materiale e può causare conseguenze negative, informare immediatamente l’agenzia di viaggi e, secondo la situazione, chiedere l’intervento della polizia.","chinese":"经劝阻仍拒不停止，继续散发、有可能造成不良影响的，地陪导游应第一时间向旅行社报告，视情况报请公安机关处置。"}]},{"category":"应变能力","number":29,"question":"旅游者要求调换房间，地陪导游应如何处理？","answer":"（1）如果旅行社提供的房间低于合同标准，导游应给予调换；确有困难调换不了时，应说明原因，并与宾馆沟通提供补偿性措施；\n\n（2）如果房间设施、卫生条件有缺陷，应要求宾馆修理和改善，如有空房给予调换，并向旅游者致歉；\n\n（3）如旅游者要求入住高于合同标准的客房，可以满足，但旅游者要交付原定房间损失费和房费差价。","italian_answer":"Se un turista chiede di cambiare camera, la guida locale deve:\n1. se la camera fornita dall’agenzia di viaggi è di standard inferiore a quello previsto dal contratto, provvedere al cambio. Se ciò è davvero impossibile, spiegare il motivo e concordare con l’albergo misure compensative;\n2. se la camera presenta difetti nelle dotazioni o nelle condizioni igieniche, chiedere all’albergo di riparare e migliorare la situazione oppure, se ci sono camere libere, di cambiarla; inoltre, porgere le proprie scuse al turista;\n3. se il turista desidera una camera di standard superiore a quello previsto dal contratto, la richiesta può essere accolta, ma il turista dovrà pagare gli eventuali costi per la perdita della camera originariamente prenotata e la differenza di prezzo.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"se la camera fornita dall’agenzia di viaggi è di standard inferiore a quello previsto dal contratto, provvedere al cambio. Se ciò è davvero impossibile, spiegare il motivo e concordare con l’albergo misure compensative;","chinese":"如果旅行社提供的房间低于合同标准，导游应给予调换；确有困难调换不了时，应说明原因，并与宾馆沟通提供补偿性措施；"},{"italian":"se la camera presenta difetti nelle dotazioni o nelle condizioni igieniche, chiedere all’albergo di riparare e migliorare la situazione oppure, se ci sono camere libere, di cambiarla; inoltre, porgere le proprie scuse al turista;","chinese":"如果房间设施、卫生条件有缺陷，应要求宾馆修理和改善，如有空房给予调换，并向旅游者致歉；"},{"italian":"se il turista desidera una camera di standard superiore a quello previsto dal contratto, la richiesta può essere accolta, ma il turista dovrà pagare gli eventuali costi per la perdita della camera originariamente prenotata e la differenza di prezzo.","chinese":"如旅游者要求入住高于合同标准的客房，可以满足，但旅游者要交付原定房间损失费和房费差价。"}]},{"category":"应变能力","number":30,"question":"在退房时，宾馆工作人员发现有旅游者房间的床单被香烟烧了一个小洞，宾馆要求按价赔偿，地陪导游应如何处理？","answer":"（1）首先分清责任，床单是原来就有破洞还是客人所为，如确定是客人所致，应说服其照价赔偿；\n\n（2）为了避免此类情况发生，导游应在团队入住之前（分房或发放房卡时）叮嘱客人爱护客房内各种用品和设施，否则要承担相应后果；\n\n（3）提醒客人进入房间后应仔细检查房间的配套用品和设施是否齐全、完好，及时发现及时处理，以减少不必要的纠纷。","italian_answer":"Al momento del check-out, se il personale dell’albergo trova un piccolo foro di bruciatura di sigaretta nel lenzuolo della camera di un turista e chiede un risarcimento, la guida locale deve:\n1. chiarire innanzitutto la responsabilità: verificare se il foro era già presente o se è stato causato dal turista. Se è accertato che il danno è stato causato dal turista, convincerlo a pagare il risarcimento secondo il prezzo stabilito;\n2. per prevenire situazioni simili, prima dell’arrivo del gruppo, al momento dell’assegnazione delle camere o della consegna delle chiavi, ricordare ai turisti di avere cura degli oggetti e delle attrezzature delle camere, altrimenti dovranno assumersi le conseguenze;\n3. ricordare ai turisti di controllare attentamente, appena entrati in camera, che tutte le dotazioni e le attrezzature siano presenti e in buone condizioni, e di segnalare subito eventuali problemi affinché possano essere risolti, evitando controversie inutili.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"chiarire innanzitutto la responsabilità: verificare se il foro era già presente o se è stato causato dal turista. Se è accertato che il danno è stato causato dal turista, convincerlo a pagare il risarcimento secondo il prezzo stabilito;","chinese":"首先分清责任，床单是原来就有破洞还是客人所为，如确定是客人所致，应说服其照价赔偿；"},{"italian":"per prevenire situazioni simili, prima dell’arrivo del gruppo, al momento dell’assegnazione delle camere o della consegna delle chiavi, ricordare ai turisti di avere cura degli oggetti e delle attrezzature delle camere, altrimenti dovranno assumersi le conseguenze;","chinese":"为了避免此类情况发生，导游应在团队入住之前（分房或发放房卡时）叮嘱客人爱护客房内各种用品和设施，否则要承担相应后果；"},{"italian":"ricordare ai turisti di controllare attentamente, appena entrati in camera, che tutte le dotazioni e le attrezzature siano presenti e in buone condizioni, e di segnalare subito eventuali problemi affinché possano essere risolti, evitando controversie inutili.","chinese":"提醒客人进入房间后应仔细检查房间的配套用品和设施是否齐全、完好，及时发现及时处理，以减少不必要的纠纷。"}]},{"category":"应变能力","number":31,"question":"哪些情况下，导游应劝阻旅游者的自由活动？","answer":"（1）旅游团即将启程离开本地前；\n\n（2）自由活动所处环境对旅游者的人身、财产安全有隐患时；\n\n（3）不宜让旅游者单独骑自行车去人生地不熟、车水马龙的街头游玩；\n\n（4）非游泳区的河（湖、海）；\n\n（5）不对外开放的地区、机构。","italian_answer":"La guida deve sconsigliare le attività libere dei turisti nelle seguenti situazioni:\n1. poco prima della partenza del gruppo dalla località;\n2. quando l’ambiente in cui si svolgerebbe l’attività presenta rischi per la sicurezza personale o per i beni dei turisti;\n3. quando un turista vorrebbe andare da solo in bicicletta in strade sconosciute e molto trafficate;\n4. nei fiumi, laghi o mari in cui la balneazione non è consentita;\n5. nelle aree o negli enti non aperti al pubblico.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"poco prima della partenza del gruppo dalla località;","chinese":"旅游团即将启程离开本地前；"},{"italian":"quando l’ambiente in cui si svolgerebbe l’attività presenta rischi per la sicurezza personale o per i beni dei turisti;","chinese":"自由活动所处环境对旅游者的人身、财产安全有隐患时；"},{"italian":"quando un turista vorrebbe andare da solo in bicicletta in strade sconosciute e molto trafficate;","chinese":"不宜让旅游者单独骑自行车去人生地不熟、车水马龙的街头游玩；"},{"italian":"nei fiumi, laghi o mari in cui la balneazione non è consentita;","chinese":"非游泳区的河（湖、海）；"},{"italian":"nelle aree o negli enti non aperti al pubblico.","chinese":"不对外开放的地区、机构。"}]},{"category":"应变能力","number":32,"question":"邮轮团旅游者反映有晕船症状，导游应如何处理？","answer":"（1）安慰旅游者，提醒注意休息；\n\n（2）可协助旅游者调整舱室；\n\n（3）使用常见外用药缓解症状；\n\n（4）准备好应急袋；\n\n（5）如旅游者症状严重，应及时联系邮轮工作人员寻求帮助。","italian_answer":"Se i turisti di una crociera lamentano il mal di mare, la guida deve:\n1. rassicurarli e ricordare loro di riposare;\n2. aiutarli, se necessario, a cambiare cabina;\n3. utilizzare medicinali di uso comune per applicazione esterna, per alleviare i sintomi;\n4. preparare sacchetti per le emergenze;\n5. se i sintomi sono gravi, contattare tempestivamente il personale della nave per chiedere aiuto.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"rassicurarli e ricordare loro di riposare;","chinese":"安慰旅游者，提醒注意休息；"},{"italian":"aiutarli, se necessario, a cambiare cabina;","chinese":"可协助旅游者调整舱室；"},{"italian":"utilizzare medicinali di uso comune per applicazione esterna, per alleviare i sintomi;","chinese":"使用常见外用药缓解症状；"},{"italian":"preparare sacchetti per le emergenze;","chinese":"准备好应急袋；"},{"italian":"se i sintomi sono gravi, contattare tempestivamente il personale della nave per chiedere aiuto.","chinese":"如旅游者症状严重，应及时联系邮轮工作人员寻求帮助。"}]},{"category":"应变能力","number":33,"question":"因团队人数较多，导致不在同一家宾馆入住，面对旅游者的抱怨，导游员应如何处理？","answer":"（1）因部分协议宾馆接待能力有限，大型团队往往需分住不同酒店；\n\n（2）导游应从大局出发，维护旅行社的形象，向旅游者做出合理解释，寻求谅解；\n\n（3）分房时要有所兼顾，尽可能满足旅游者要求，可以根据不同的群体来分房，并且告知各家宾馆的位置和距离，方便旅游者相互联系和走动。","italian_answer":"Se, a causa del numero elevato di partecipanti, il gruppo deve alloggiare in alberghi diversi e i turisti si lamentano, la guida deve:\n1. spiegare che alcuni alberghi convenzionati hanno una capacità ricettiva limitata e che i gruppi numerosi devono spesso essere suddivisi in più alberghi;\n2. considerare l’interesse generale, tutelare l’immagine dell’agenzia di viaggi e fornire ai turisti una spiegazione ragionevole per ottenere la loro comprensione;\n3. nell’assegnazione delle camere, tenere conto delle esigenze dei diversi gruppi e soddisfarle per quanto possibile; comunicare inoltre la posizione e la distanza dei vari alberghi, così che i turisti possano contattarsi e spostarsi facilmente.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"spiegare che alcuni alberghi convenzionati hanno una capacità ricettiva limitata e che i gruppi numerosi devono spesso essere suddivisi in più alberghi;","chinese":"因部分协议宾馆接待能力有限，大型团队往往需分住不同酒店；"},{"italian":"considerare l’interesse generale, tutelare l’immagine dell’agenzia di viaggi e fornire ai turisti una spiegazione ragionevole per ottenere la loro comprensione;","chinese":"导游应从大局出发，维护旅行社的形象，向旅游者做出合理解释，寻求谅解；"},{"italian":"nell’assegnazione delle camere, tenere conto delle esigenze dei diversi gruppi e soddisfarle per quanto possibile; comunicare inoltre la posizione e la distanza dei vari alberghi, così che i turisti possano contattarsi e spostarsi facilmente.","chinese":"分房时要有所兼顾，尽可能满足旅游者要求，可以根据不同的群体来分房，并且告知各家宾馆的位置和距离，方便旅游者相互联系和走动。"}]},{"category":"应变能力","number":34,"question":"部分旅游者提出不想随团按计划去某一景点游览，而想单独购物，导游应如何处理？","answer":"（1）应动员旅游者按原计划随团参观，并着重推介该景点的特色和沿革；\n\n（2）若旅游者仍坚持己见，可征得领队或全陪同意，请旅游者签订书面免责证明；\n\n（3）如景点门票已预订付费，应告知旅游者景点门票费不退；\n\n（4）可协助安排旅游者接送，并告知注意事项。","italian_answer":"Se alcuni turisti non vogliono visitare un’attrazione prevista dal programma e preferiscono fare acquisti da soli, la guida deve:\n1. cercare di convincerli a partecipare alla visita prevista, presentando in particolare le caratteristiche e la storia dell’attrazione;\n2. se insistono, ottenere il consenso del capogruppo o della guida accompagnatrice e chiedere ai turisti di firmare una dichiarazione scritta di esonero da responsabilità;\n3. se i biglietti d’ingresso sono già stati prenotati e pagati, informarli che il costo non è rimborsabile;\n4. aiutarli, se necessario, a organizzare il trasporto di andata e ritorno e ricordare loro le precauzioni da osservare.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"cercare di convincerli a partecipare alla visita prevista, presentando in particolare le caratteristiche e la storia dell’attrazione;","chinese":"应动员旅游者按原计划随团参观，并着重推介该景点的特色和沿革；"},{"italian":"se insistono, ottenere il consenso del capogruppo o della guida accompagnatrice e chiedere ai turisti di firmare una dichiarazione scritta di esonero da responsabilità;","chinese":"若旅游者仍坚持己见，可征得领队或全陪同意，请旅游者签订书面免责证明；"},{"italian":"se i biglietti d’ingresso sono già stati prenotati e pagati, informarli che il costo non è rimborsabile;","chinese":"如景点门票已预订付费，应告知旅游者景点门票费不退；"},{"italian":"aiutarli, se necessario, a organizzare il trasporto di andata e ritorno e ricordare loro le precauzioni da osservare.","chinese":"可协助安排旅游者接送，并告知注意事项。"}]},{"category":"应变能力","number":35,"question":"导游接待一俄罗斯旅游团，按计划当晚将去大戏院观看舞剧《黑桃皇后》。其间，部分旅游者要求观看京剧《玉堂春》，导游应如何处理？","answer":"（1）与司机商量，如果时间允许，可请旅行社给予调换；\n\n（2）如果无法安排，导游要耐心解释，明确告知剧票已订好，不能退换，请他们谅解；若这部分旅游者坚持看京剧，导游应协助他们退票，但费用自理；\n\n（3）如果顺路，尽量为少数旅游者提供方便；如果是不同方向，可为他们协调安排车辆，但费用自理。","italian_answer":"Se una guida accompagna un gruppo russo che, secondo il programma, dovrebbe assistere quella sera al balletto «La dama di picche» in un grande teatro, ma alcuni turisti chiedono di vedere l’opera di Pechino «Yutang Chun», deve:\n1. consultarsi con l’autista e, se c’è tempo, chiedere all’agenzia di viaggi di modificare il programma;\n2. se non è possibile, spiegare pazientemente che i biglietti dello spettacolo sono già stati prenotati e non possono essere rimborsati né cambiati. Se i turisti insistono per vedere l’opera di Pechino, aiutarli a restituire i biglietti, ma le spese restano a loro carico;\n3. se il percorso è comodo, cercare di agevolare i pochi turisti; se le destinazioni sono in direzioni diverse, organizzare un veicolo, con le relative spese a carico dei turisti.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"consultarsi con l’autista e, se c’è tempo, chiedere all’agenzia di viaggi di modificare il programma;","chinese":"与司机商量，如果时间允许，可请旅行社给予调换；"},{"italian":"se non è possibile, spiegare pazientemente che i biglietti dello spettacolo sono già stati prenotati e non possono essere rimborsati né cambiati. Se i turisti insistono per vedere l’opera di Pechino, aiutarli a restituire i biglietti, ma le spese restano a loro carico;","chinese":"如果无法安排，导游要耐心解释，明确告知剧票已订好，不能退换，请他们谅解；若这部分旅游者坚持看京剧，导游应协助他们退票，但费用自理；"},{"italian":"se il percorso è comodo, cercare di agevolare i pochi turisti; se le destinazioni sono in direzioni diverse, organizzare un veicolo, con le relative spese a carico dei turisti.","chinese":"如果顺路，尽量为少数旅游者提供方便；如果是不同方向，可为他们协调安排车辆，但费用自理。"}]},{"category":"应变能力","number":36,"question":"一外籍旅游者因家中有急事要求中途退团回国，导游应如何处理？","answer":"（1）请旅游者提出退团书面申请并签字后，可以满足其要求；\n\n（2）协助旅游者办理有关手续，分离签证，重订航班、机座，费用自理；\n\n（3）所产生费用由旅游者自理，未使用的旅游费用按照旅游者与旅行社签订的合同约定协商处理。","italian_answer":"Se un turista straniero chiede di lasciare il gruppo e tornare nel proprio Paese a causa di un’emergenza familiare, la guida deve:\n1. accogliere la richiesta dopo che il turista ha presentato e firmato una domanda scritta di ritiro dal viaggio;\n2. aiutarlo a sbrigare le formalità necessarie, tra cui la procedura per separarsi dal visto del gruppo e la nuova prenotazione del volo e del posto; le spese sono a suo carico;\n3. concordare con il turista e l’agenzia, secondo quanto previsto dal contratto stipulato, il trattamento dei costi del viaggio non ancora utilizzati.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"accogliere la richiesta dopo che il turista ha presentato e firmato una domanda scritta di ritiro dal viaggio;","chinese":"请旅游者提出退团书面申请并签字后，可以满足其要求；"},{"italian":"aiutarlo a sbrigare le formalità necessarie, tra cui la procedura per separarsi dal visto del gruppo e la nuova prenotazione del volo e del posto; le spese sono a suo carico;","chinese":"协助旅游者办理有关手续，分离签证，重订航班、机座，费用自理；"},{"italian":"concordare con il turista e l’agenzia, secondo quanto previsto dal contratto stipulato, il trattamento dei costi del viaggio non ancora utilizzati.","chinese":"所产生费用由旅游者自理，未使用的旅游费用按照旅游者与旅行社签订的合同约定协商处理。"}]},{"category":"应变能力","number":37,"question":"在旅游途中，旅游者提出要求增加计划外景点，导游应如何处理？","answer":"（1）在时间允许的情况下，应请示接待社并积极协助；\n\n（2）与接待社有关部门联系，请其报价，将接待社的对外报价报给旅游者；\n\n（3）若旅游者认可，地陪应协调处理好增加的游览费用事宜，并陪同前往，做好增加游览项目的讲解等工作。","italian_answer":"Se durante il viaggio un turista chiede di aggiungere un’attrazione non prevista dal programma, la guida deve:\n1. se il tempo lo permette, chiedere l’autorizzazione all’agenzia locale e offrire attivamente la propria collaborazione;\n2. contattare il reparto competente dell’agenzia locale, chiedere il prezzo e comunicare al turista il prezzo proposto dall’agenzia;\n3. se il turista accetta, coordinare il pagamento delle spese aggiuntive, accompagnarlo alla visita e fornire le spiegazioni relative alla nuova attività.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"se il tempo lo permette, chiedere l’autorizzazione all’agenzia locale e offrire attivamente la propria collaborazione;","chinese":"在时间允许的情况下，应请示接待社并积极协助；"},{"italian":"contattare il reparto competente dell’agenzia locale, chiedere il prezzo e comunicare al turista il prezzo proposto dall’agenzia;","chinese":"与接待社有关部门联系，请其报价，将接待社的对外报价报给旅游者；"},{"italian":"se il turista accetta, coordinare il pagamento delle spese aggiuntive, accompagnarlo alla visita e fornire le spiegazioni relative alla nuova attività.","chinese":"若旅游者认可，地陪应协调处理好增加的游览费用事宜，并陪同前往，做好增加游览项目的讲解等工作。"}]},{"category":"应变能力","number":38,"question":"一名旅游者即将离开当地返程，委托地陪导游将一个木匣转交其当地亲友，并愿意支付相关费用，导游应如何处理？","answer":"（1）原则上礼貌婉拒，建议旅游者选择快递方式；\n\n（2）旅游者仍坚持委托的，导游不得私自答应，须请示旅行社，经旅行社同意后方可办理；\n\n（3）会同旅游者开箱查验物品，食品、贵重物品、违禁物品不予代为转交；\n\n（4）请旅游者出具委托书，写明物品明细并当面清点签字，留存双方联系方式；收件人收货后出具收条，委托书、收条由旅行社存档。","italian_answer":"Se un turista, prima di lasciare la località, chiede alla guida locale di consegnare una scatola di legno a un amico del posto e offre di pagare le spese, la guida deve:\n1. in linea di principio, rifiutare cortesemente e suggerire al turista di utilizzare un servizio di corriere;\n2. se il turista insiste, non accettare di propria iniziativa: deve chiedere l’autorizzazione all’agenzia di viaggi e procedere solo dopo averla ottenuta;\n3. aprire e controllare la scatola insieme al turista. Non deve accettare di consegnare alimenti, oggetti di valore o articoli vietati;\n4. chiedere al turista una delega scritta con l’elenco dettagliato degli oggetti. Fare l’inventario insieme al turista e far firmare il documento al momento della consegna, conservando i recapiti di entrambe le parti. Dopo aver ricevuto la scatola, il destinatario deve rilasciare una ricevuta. La delega e la ricevuta devono essere archiviate dall’agenzia di viaggi.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"in linea di principio, rifiutare cortesemente e suggerire al turista di utilizzare un servizio di corriere;","chinese":"原则上礼貌婉拒，建议旅游者选择快递方式；"},{"italian":"se il turista insiste, non accettare di propria iniziativa: deve chiedere l’autorizzazione all’agenzia di viaggi e procedere solo dopo averla ottenuta;","chinese":"旅游者仍坚持委托的，导游不得私自答应，须请示旅行社，经旅行社同意后方可办理；"},{"italian":"aprire e controllare la scatola insieme al turista. Non deve accettare di consegnare alimenti, oggetti di valore o articoli vietati;","chinese":"会同旅游者开箱查验物品，食品、贵重物品、违禁物品不予代为转交；"},{"italian":"chiedere al turista una delega scritta con l’elenco dettagliato degli oggetti. Fare l’inventario insieme al turista e far firmare il documento al momento della consegna, conservando i recapiti di entrambe le parti. Dopo aver ricevuto la scatola, il destinatario deve rilasciare una ricevuta. La delega e la ricevuta devono essere archiviate dall’agenzia di viaggi.","chinese":"请旅游者出具委托书，写明物品明细并当面清点签字，留存双方联系方式；收件人收货后出具收条，委托书、收条由旅行社存档。"}]},{"category":"应变能力","number":39,"question":"当个别旅游者提出购买文物古玩的需求时，导游应如何处理？","answer":"（1）提醒旅游者不要在路边摊购买，应带旅游者去当地文物商店选购；\n\n（2）提醒旅游者在购买文物古玩时要保管好发票，不要将文物古玩上的火漆印（属鉴定凭证）去掉，以备查验；\n\n（3）发现个别旅游者有走私文物的可疑行为时，导游应及时向有关部门报告。","italian_answer":"Se un turista chiede di acquistare oggetti d’antiquariato o beni culturali antichi, la guida deve:\n1. ricordargli di non acquistare presso le bancarelle in strada e accompagnarlo in un negozio locale autorizzato alla vendita di beni culturali;\n2. ricordargli di conservare la fattura e di non rimuovere il sigillo di ceralacca sugli oggetti, perché costituisce una prova di autenticazione e può essere necessario per i controlli;\n3. se sospetta che un turista stia tentando di contrabbandare beni culturali, informare tempestivamente le autorità competenti.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"ricordargli di non acquistare presso le bancarelle in strada e accompagnarlo in un negozio locale autorizzato alla vendita di beni culturali;","chinese":"提醒旅游者不要在路边摊购买，应带旅游者去当地文物商店选购；"},{"italian":"ricordargli di conservare la fattura e di non rimuovere il sigillo di ceralacca sugli oggetti, perché costituisce una prova di autenticazione e può essere necessario per i controlli;","chinese":"提醒旅游者在购买文物古玩时要保管好发票，不要将文物古玩上的火漆印（属鉴定凭证）去掉，以备查验；"},{"italian":"se sospetta che un turista stia tentando di contrabbandare beni culturali, informare tempestivamente le autorità competenti.","chinese":"发现个别旅游者有走私文物的可疑行为时，导游应及时向有关部门报告。"}]},{"category":"应变能力","number":40,"question":"如果遇到旅游者对你的导游词提出异议，导游应如何处理？","answer":"（1）耐心听取旅游者意见，从中汲取合理成分；\n\n（2）不要与旅游者现场争辩，应感谢客人的提醒；\n\n（3）将旅游者的观点作为一个“新的观点”暂时承认，过后再予以确认；\n\n（4）如果旅游者的观点是错误的，可以单独交换意见。","italian_answer":"Se un turista contesta le spiegazioni della guida, quest’ultima deve:\n1. ascoltare con pazienza le sue osservazioni e accogliere gli elementi ragionevoli;\n2. non discutere con il turista sul posto e ringraziarlo per la segnalazione;\n3. considerare temporaneamente il suo punto di vista come un «nuovo punto di vista» e verificarlo in seguito;\n4. se il punto di vista del turista è errato, discuterne con lui in privato.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"ascoltare con pazienza le sue osservazioni e accogliere gli elementi ragionevoli;","chinese":"耐心听取旅游者意见，从中汲取合理成分；"},{"italian":"non discutere con il turista sul posto e ringraziarlo per la segnalazione;","chinese":"不要与旅游者现场争辩，应感谢客人的提醒；"},{"italian":"considerare temporaneamente il suo punto di vista come un «nuovo punto di vista» e verificarlo in seguito;","chinese":"将旅游者的观点作为一个“新的观点”暂时承认，过后再予以确认；"},{"italian":"se il punto di vista del turista è errato, discuterne con lui in privato.","chinese":"如果旅游者的观点是错误的，可以单独交换意见。"}]},{"category":"应变能力","number":41,"question":"旅游者就导游的服务质量向导游提出口头投诉，导游应如何处理？","answer":"（1）认真倾听投诉者的意见，让客人把话说完，切不可立即辩解，更不可马上否认；\n\n（2）认真分析，做出正确判断；\n\n（3）核实后向投诉者做实事求是的说明和诚恳道歉，并及时采取补救措施；妥善处理后，应向旅游者表示感谢并继续为旅游者提供热情周到的服务。","italian_answer":"Se un turista presenta verbalmente un reclamo alla guida per la qualità del servizio, la guida deve:\n1. ascoltare attentamente e lasciare che il turista finisca di parlare, senza giustificarsi subito e senza negare immediatamente le sue osservazioni;\n2. analizzare con attenzione la situazione e formulare una valutazione corretta;\n3. dopo aver verificato i fatti, fornire spiegazioni obiettive e porgere sincere scuse, adottando tempestivamente misure correttive. Dopo aver risolto il problema, ringraziare il turista e continuare a offrirgli un servizio cordiale e premuroso.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"ascoltare attentamente e lasciare che il turista finisca di parlare, senza giustificarsi subito e senza negare immediatamente le sue osservazioni;","chinese":"认真倾听投诉者的意见，让客人把话说完，切不可立即辩解，更不可马上否认；"},{"italian":"analizzare con attenzione la situazione e formulare una valutazione corretta;","chinese":"认真分析，做出正确判断；"},{"italian":"dopo aver verificato i fatti, fornire spiegazioni obiettive e porgere sincere scuse, adottando tempestivamente misure correttive. Dopo aver risolto il problema, ringraziare il turista e continuare a offrirgli un servizio cordiale e premuroso.","chinese":"核实后向投诉者做实事求是的说明和诚恳道歉，并及时采取补救措施；妥善处理后，应向旅游者表示感谢并继续为旅游者提供热情周到的服务。"}]},{"category":"应变能力","number":42,"question":"导游从机场接团后，刚上车准备讲解时，发现车载麦克风坏了，应如何处理？","answer":"（1）有经验的导游会在出发前随身携带一个微型话筒，以备急用；\n\n（2）若没佩戴话筒，在旅游者人数不多的情况下，可以适当提高嗓音，如果人数较多，则应在大巴车车厢中部选择合适座位入座开展讲解，尽量让每一位旅游者都能听见；\n\n（3）对于年纪稍长、听力不好的旅游者还需重复相关内容。","italian_answer":"Se, dopo aver accolto il gruppo in aeroporto e una volta saliti sul pullman per iniziare la spiegazione, la guida si accorge che il microfono del veicolo è guasto, deve:\n1. una guida esperta dovrebbe portare con sé un piccolo microfono di riserva prima della partenza, per ogni evenienza;\n2. se non ha un microfono, quando il gruppo è poco numeroso può alzare moderatamente la voce. Se il gruppo è numeroso, può sedersi in un posto adatto nella parte centrale del pullman e spiegare da lì, in modo che tutti possano sentire;\n3. ripetere le informazioni importanti ai turisti più anziani o con problemi di udito.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"una guida esperta dovrebbe portare con sé un piccolo microfono di riserva prima della partenza, per ogni evenienza;","chinese":"有经验的导游会在出发前随身携带一个微型话筒，以备急用；"},{"italian":"se non ha un microfono, quando il gruppo è poco numeroso può alzare moderatamente la voce. Se il gruppo è numeroso, può sedersi in un posto adatto nella parte centrale del pullman e spiegare da lì, in modo che tutti possano sentire;","chinese":"若没佩戴话筒，在旅游者人数不多的情况下，可以适当提高嗓音，如果人数较多，则应在大巴车车厢中部选择合适座位入座开展讲解，尽量让每一位旅游者都能听见；"},{"italian":"ripetere le informazioni importanti ai turisti più anziani o con problemi di udito.","chinese":"对于年纪稍长、听力不好的旅游者还需重复相关内容。"}]},{"category":"应变能力","number":43,"question":"导游在带团过程中遇天气持续高温，应如何应对？","answer":"（1）应及时向旅行社汇报，合理调整行程安排，减少高温时段团队的户外活动；\n\n（2）提醒团员多喝水，少吃多餐，适当多吃苦味和酸性食物；\n\n（3）提醒团员避免剧烈运动，可用凉水冲洗手腕或温水冲澡；\n\n（4）提醒团员日间适当小睡，以补充体力；\n\n（5）提醒团员注意防晒，携带遮阳伞、太阳帽等预防中暑。","italian_answer":"Se durante il viaggio si verifica un periodo prolungato di temperature molto elevate, la guida deve:\n1. informare tempestivamente l’agenzia di viaggi e modificare ragionevolmente il programma, riducendo le attività all’aperto nelle ore più calde;\n2. ricordare ai turisti di bere molta acqua, mangiare poco e spesso e consumare un po’ più di alimenti dal sapore amaro o acido;\n3. ricordare loro di evitare esercizi intensi; possono rinfrescarsi i polsi con acqua fresca o fare una doccia tiepida;\n4. suggerire un breve riposo durante il giorno per recuperare le energie;\n5. ricordare loro di proteggersi dal sole e di portare ombrelli parasole, cappelli e altri oggetti utili a prevenire il colpo di calore.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"informare tempestivamente l’agenzia di viaggi e modificare ragionevolmente il programma, riducendo le attività all’aperto nelle ore più calde;","chinese":"应及时向旅行社汇报，合理调整行程安排，减少高温时段团队的户外活动；"},{"italian":"ricordare ai turisti di bere molta acqua, mangiare poco e spesso e consumare un po’ più di alimenti dal sapore amaro o acido;","chinese":"提醒团员多喝水，少吃多餐，适当多吃苦味和酸性食物；"},{"italian":"ricordare loro di evitare esercizi intensi; possono rinfrescarsi i polsi con acqua fresca o fare una doccia tiepida;","chinese":"提醒团员避免剧烈运动，可用凉水冲洗手腕或温水冲澡；"},{"italian":"suggerire un breve riposo durante il giorno per recuperare le energie;","chinese":"提醒团员日间适当小睡，以补充体力；"},{"italian":"ricordare loro di proteggersi dal sole e di portare ombrelli parasole, cappelli e altri oggetti utili a prevenire il colpo di calore.","chinese":"提醒团员注意防晒，携带遮阳伞、太阳帽等预防中暑。"}]},{"category":"应变能力","number":44,"question":"导游在带团过程中突遇持续大雪，应如何应对？","answer":"（1）导游应及时向旅行社汇报，调整行程安排，减少团队户外活动；\n\n（2）不要带领团队进入不结实、不安全的建筑物内躲避；\n\n（3）提醒旅游者穿防滑鞋，做好团队冻伤、雪盲症状的防护；\n\n（4）和旅行社保持密切联系，做好后续行程安排。","italian_answer":"Se durante il viaggio si verifica una forte nevicata prolungata, la guida deve:\n1. informare tempestivamente l’agenzia di viaggi, modificare il programma e ridurre le attività all’aperto del gruppo;\n2. non condurre il gruppo a ripararsi in edifici instabili o non sicuri;\n3. ricordare ai turisti di indossare scarpe antiscivolo e di proteggersi dal congelamento e dalla cecità da neve;\n4. mantenere uno stretto contatto con l’agenzia di viaggi e organizzare le tappe successive.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"informare tempestivamente l’agenzia di viaggi, modificare il programma e ridurre le attività all’aperto del gruppo;","chinese":"导游应及时向旅行社汇报，调整行程安排，减少团队户外活动；"},{"italian":"non condurre il gruppo a ripararsi in edifici instabili o non sicuri;","chinese":"不要带领团队进入不结实、不安全的建筑物内躲避；"},{"italian":"ricordare ai turisti di indossare scarpe antiscivolo e di proteggersi dal congelamento e dalla cecità da neve;","chinese":"提醒旅游者穿防滑鞋，做好团队冻伤、雪盲症状的防护；"},{"italian":"mantenere uno stretto contatto con l’agenzia di viaggi e organizzare le tappe successive.","chinese":"和旅行社保持密切联系，做好后续行程安排。"}]},{"category":"应变能力","number":45,"question":"团队当中有国内旅游者因受伤必须住院治疗，需要延长旅游期限，导游应如何处理？","answer":"（1）由旅游者提出书面申请，报请旅行社同意；\n\n（2）协助旅游者办理延长旅游期相关事宜，如重新订房、订交通票等；\n\n（3）导游应关心受伤滞留的旅游者；\n\n（4）延长旅游期内所发生的一切费用由旅游者自理。","italian_answer":"Se un turista cinese del gruppo deve essere ricoverato a causa di un infortunio e ha bisogno di prolungare il soggiorno, la guida deve:\n1. chiedere al turista di presentare una domanda scritta e sottoporla all’approvazione dell’agenzia di viaggi;\n2. aiutarlo nelle pratiche per prolungare il soggiorno, come la nuova prenotazione della camera e dei biglietti di trasporto;\n3. prestare attenzione e assistenza al turista ferito che deve rimanere sul posto;\n4. tutte le spese sostenute durante il prolungamento del soggiorno sono a carico del turista.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"chiedere al turista di presentare una domanda scritta e sottoporla all’approvazione dell’agenzia di viaggi;","chinese":"由旅游者提出书面申请，报请旅行社同意；"},{"italian":"aiutarlo nelle pratiche per prolungare il soggiorno, come la nuova prenotazione della camera e dei biglietti di trasporto;","chinese":"协助旅游者办理延长旅游期相关事宜，如重新订房、订交通票等；"},{"italian":"prestare attenzione e assistenza al turista ferito che deve rimanere sul posto;","chinese":"导游应关心受伤滞留的旅游者；"},{"italian":"tutte le spese sostenute durante il prolungamento del soggiorno sono a carico del turista.","chinese":"延长旅游期内所发生的一切费用由旅游者自理。"}]},{"category":"应变能力","number":46,"question":"入境旅游者向导游咨询消费支付和货币兑换方式，导游应如何处理？","answer":"（1）导游应向旅游者说明，在中国旅游期间可以使用现金、数字人民币、信用卡、微信、支付宝等多种支付方式；\n\n（2）导游可现场演示微信或支付宝绑定外卡的操作流程；\n\n（3）如果入境旅游者需要人民币现金，导游应告知可以通过银行卡在标有对应清算组织标志的ATM机上提取，也可以在标有货币兑换标志的银行网点、外币兑换机构和自助兑换机直接用外币现金兑换人民币现金。","italian_answer":"Se un turista in entrata chiede informazioni sui pagamenti e sul cambio valuta in Cina, la guida deve:\n1. spiegare che durante il viaggio in Cina si possono utilizzare diversi metodi di pagamento, tra cui contanti, renminbi digitale, carte di credito, WeChat e Alipay;\n2. può mostrare sul posto come collegare una carta bancaria straniera a WeChat o Alipay;\n3. se il turista desidera contanti in renminbi, spiegare che può prelevarli da un bancomat che espone il logo del circuito della sua carta, oppure cambiare direttamente valuta estera in contanti in renminbi presso filiali bancarie, uffici di cambio e distributori automatici di cambio che espongono l’apposito simbolo.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"spiegare che durante il viaggio in Cina si possono utilizzare diversi metodi di pagamento, tra cui contanti, renminbi digitale, carte di credito, WeChat e Alipay;","chinese":"导游应向旅游者说明，在中国旅游期间可以使用现金、数字人民币、信用卡、微信、支付宝等多种支付方式；"},{"italian":"può mostrare sul posto come collegare una carta bancaria straniera a WeChat o Alipay;","chinese":"导游可现场演示微信或支付宝绑定外卡的操作流程；"},{"italian":"se il turista desidera contanti in renminbi, spiegare che può prelevarli da un bancomat che espone il logo del circuito della sua carta, oppure cambiare direttamente valuta estera in contanti in renminbi presso filiali bancarie, uffici di cambio e distributori automatici di cambio che espongono l’apposito simbolo.","chinese":"如果入境旅游者需要人民币现金，导游应告知可以通过银行卡在标有对应清算组织标志的ATM机上提取，也可以在标有货币兑换标志的银行网点、外币兑换机构和自助兑换机直接用外币现金兑换人民币现金。"}]},{"category":"应变能力","number":47,"question":"一天的游览结束后，旅游者邀请导游去娱乐场所聚会，导游应如何处理？","answer":"（1）在没有特别约定的前提下，去娱乐场所纯属旅游者的额外消费，不在导游的工作范围之内，导游可婉言谢绝；\n\n（2）如果双方关系确实相处融洽，对方再三盛情邀请，导游可大方参与，但要把握好交往尺度，保持清醒的头脑和得体的交际距离；\n\n（3）当第二天工作开始后，导游应回到自己的角色和状态中。","italian_answer":"Se, al termine delle visite della giornata, i turisti invitano la guida a partecipare a un incontro in un locale di intrattenimento, la guida deve:\n1. se non ci sono accordi particolari, la visita a un locale è una spesa extra dei turisti e non rientra nei compiti della guida, che può quindi rifiutare con cortesia;\n2. se il rapporto è davvero cordiale e i turisti insistono con gentilezza, la guida può partecipare, ma deve mantenere i giusti limiti, restare lucida e conservare una distanza appropriata;\n3. quando il lavoro riprende il giorno successivo, deve tornare al proprio ruolo e mantenere un comportamento professionale.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"se non ci sono accordi particolari, la visita a un locale è una spesa extra dei turisti e non rientra nei compiti della guida, che può quindi rifiutare con cortesia;","chinese":"在没有特别约定的前提下，去娱乐场所纯属旅游者的额外消费，不在导游的工作范围之内，导游可婉言谢绝；"},{"italian":"se il rapporto è davvero cordiale e i turisti insistono con gentilezza, la guida può partecipare, ma deve mantenere i giusti limiti, restare lucida e conservare una distanza appropriata;","chinese":"如果双方关系确实相处融洽，对方再三盛情邀请，导游可大方参与，但要把握好交往尺度，保持清醒的头脑和得体的交际距离；"},{"italian":"quando il lavoro riprende il giorno successivo, deve tornare al proprio ruolo e mantenere un comportamento professionale.","chinese":"当第二天工作开始后，导游应回到自己的角色和状态中。"}]},{"category":"应变能力","number":48,"question":"行程中的景点因故不能正常参观，地陪导游应如何处理？","answer":"（1）首先应明确不能参观的真实原因，并向旅游者如实说明；\n\n（2）如果只是暂时不能参观，地陪导游可以适当调整行程顺序，尽量保障行程的完整性；\n\n（3）如果确实在行程日期中无法实现，应及时安慰旅游者，并报告旅行社协商补偿措施。","italian_answer":"Se un’attrazione prevista dal programma non può essere visitata per qualche motivo, la guida locale deve:\n1. chiarire innanzitutto il vero motivo e spiegarlo con sincerità ai turisti;\n2. se l’impossibilità è temporanea, modificare opportunamente l’ordine delle visite per mantenere il programma il più completo possibile;\n3. se la visita non può essere effettuata in nessuno dei giorni previsti per il viaggio, rassicurare tempestivamente i turisti e riferire la situazione all’agenzia di viaggi per concordare misure compensative.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"chiarire innanzitutto il vero motivo e spiegarlo con sincerità ai turisti;","chinese":"首先应明确不能参观的真实原因，并向旅游者如实说明；"},{"italian":"se l’impossibilità è temporanea, modificare opportunamente l’ordine delle visite per mantenere il programma il più completo possibile;","chinese":"如果只是暂时不能参观，地陪导游可以适当调整行程顺序，尽量保障行程的完整性；"},{"italian":"se la visita non può essere effettuata in nessuno dei giorni previsti per il viaggio, rassicurare tempestivamente i turisti e riferire la situazione all’agenzia di viaggi per concordare misure compensative.","chinese":"如果确实在行程日期中无法实现，应及时安慰旅游者，并报告旅行社协商补偿措施。"}]},{"category":"应变能力","number":49,"question":"旅游团到达目的地，全陪与地陪核对行程时发现有较大差异，应如何处理？","answer":"（1）双方应冷静分析，本着同行之间友好合作的态度开展工作；\n\n（2）各自向所属旅行社计调部核实，然后迅速更正、达成共识，继续后续行程；\n\n（3）处理分歧过程中，应避开团队，以免导致旅游者产生不安和不信任。","italian_answer":"Se, all’arrivo del gruppo a destinazione, la guida accompagnatrice e la guida locale scoprono differenze importanti confrontando i rispettivi programmi, devono:\n1. analizzare la situazione con calma e collaborare in modo amichevole e professionale;\n2. ciascuna deve verificare le informazioni con l’ufficio di programmazione e coordinamento della propria agenzia di viaggi; poi devono correggere rapidamente le differenze, raggiungere un accordo e proseguire con il programma;\n3. durante la gestione delle divergenze, devono allontanarsi dal gruppo per evitare di provocare nei turisti preoccupazione o sfiducia.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"analizzare la situazione con calma e collaborare in modo amichevole e professionale;","chinese":"双方应冷静分析，本着同行之间友好合作的态度开展工作；"},{"italian":"ciascuna deve verificare le informazioni con l’ufficio di programmazione e coordinamento della propria agenzia di viaggi; poi devono correggere rapidamente le differenze, raggiungere un accordo e proseguire con il programma;","chinese":"各自向所属旅行社计调部核实，然后迅速更正、达成共识，继续后续行程；"},{"italian":"durante la gestione delle divergenze, devono allontanarsi dal gruppo per evitare di provocare nei turisti preoccupazione o sfiducia.","chinese":"处理分歧过程中，应避开团队，以免导致旅游者产生不安和不信任。"}]},{"category":"应变能力","number":50,"question":"导游带团在酒店入住后遇到突发强震，应该如何应对？","answer":"（1）导游应沉着冷静，安慰团员。地震发生时立即引导团员就地避险；待震动停止后，再组织团员有序向酒店底楼空旷地带转移，避免发生踩踏；\n\n（2）如逃生通道阻塞，应让团员选择室内三角形空间或管道多的空间躲避，并保护好头部；\n\n（3）提醒旅游者切勿跳楼或乘坐电梯逃生；\n\n（4）及时发出相关求救信息，努力开辟逃生通道；\n\n（5）如暂时不能逃生则应保存体力，防止窒息，等待救援。","italian_answer":"Se, dopo che il gruppo ha fatto il check-in in albergo, si verifica improvvisamente un forte terremoto, la guida deve:\n1. mantenere la calma e rassicurare i turisti. Durante la scossa, guidarli subito a proteggersi sul posto; quando la scossa termina, organizzare il trasferimento ordinato verso uno spazio aperto al piano terra dell’albergo, evitando il rischio che le persone vengano calpestate;\n2. se le vie di fuga sono bloccate, far riparare i turisti in uno spazio triangolare all’interno dell’edificio o in un ambiente con molte tubature e ricordare loro di proteggere la testa;\n3. ricordare ai turisti di non saltare dalle finestre e di non usare gli ascensori per fuggire;\n4. inviare tempestivamente richieste di soccorso e cercare di aprire una via di fuga;\n5. se non è possibile uscire subito, conservare le energie, evitare il soffocamento e attendere i soccorsi.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"mantenere la calma e rassicurare i turisti. Durante la scossa, guidarli subito a proteggersi sul posto; quando la scossa termina, organizzare il trasferimento ordinato verso uno spazio aperto al piano terra dell’albergo, evitando il rischio che le persone vengano calpestate;","chinese":"导游应沉着冷静，安慰团员。地震发生时立即引导团员就地避险；待震动停止后，再组织团员有序向酒店底楼空旷地带转移，避免发生踩踏；"},{"italian":"se le vie di fuga sono bloccate, far riparare i turisti in uno spazio triangolare all’interno dell’edificio o in un ambiente con molte tubature e ricordare loro di proteggere la testa;","chinese":"如逃生通道阻塞，应让团员选择室内三角形空间或管道多的空间躲避，并保护好头部；"},{"italian":"ricordare ai turisti di non saltare dalle finestre e di non usare gli ascensori per fuggire;","chinese":"提醒旅游者切勿跳楼或乘坐电梯逃生；"},{"italian":"inviare tempestivamente richieste di soccorso e cercare di aprire una via di fuga;","chinese":"及时发出相关求救信息，努力开辟逃生通道；"},{"italian":"se non è possibile uscire subito, conservare le energie, evitare il soffocamento e attendere i soccorsi.","chinese":"如暂时不能逃生则应保存体力，防止窒息，等待救援。"}]},{"category":"应变能力","number":51,"question":"导游带团乘坐内河游轮遇突发水运事故，船只倾覆，应如何应对？","answer":"（1）导游应沉着冷静，安慰团员，第一时间发出求救信息并组织团员利用救生设备逃生；\n\n（2）如需跳水逃生，应提醒旅游者穿戴救生衣，多抛撒能漂浮的物品如空木箱、木板、泡沫等，从船舱低层跳水；\n\n（3）跳水后，应让团员尽快游离将沉没的船只，让团队集中漂浮，不要脱掉衣物，保持体力和体温，等待救援；\n\n（4）及时清点团队人数。","italian_answer":"Se durante una crociera fluviale la nave si capovolge, la guida deve:\n1. mantenere la calma, rassicurare i turisti, inviare subito una richiesta di soccorso e organizzare l’evacuazione usando le attrezzature di salvataggio;\n2. se è necessario tuffarsi in acqua, ricordare ai turisti di indossare i giubbotti di salvataggio e di lanciare in acqua oggetti galleggianti, come casse vuote, tavole o materiali espansi; il salto deve avvenire dai livelli inferiori della nave;\n3. dopo il salto, far nuotare rapidamente i turisti lontano dalla nave che sta affondando e tenerli riuniti in acqua. Non devono togliersi i vestiti, ma conservare le energie e il calore corporeo in attesa dei soccorsi;\n4. contare tempestivamente tutti i membri del gruppo.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"mantenere la calma, rassicurare i turisti, inviare subito una richiesta di soccorso e organizzare l’evacuazione usando le attrezzature di salvataggio;","chinese":"导游应沉着冷静，安慰团员，第一时间发出求救信息并组织团员利用救生设备逃生；"},{"italian":"se è necessario tuffarsi in acqua, ricordare ai turisti di indossare i giubbotti di salvataggio e di lanciare in acqua oggetti galleggianti, come casse vuote, tavole o materiali espansi; il salto deve avvenire dai livelli inferiori della nave;","chinese":"如需跳水逃生，应提醒旅游者穿戴救生衣，多抛撒能漂浮的物品如空木箱、木板、泡沫等，从船舱低层跳水；"},{"italian":"dopo il salto, far nuotare rapidamente i turisti lontano dalla nave che sta affondando e tenerli riuniti in acqua. Non devono togliersi i vestiti, ma conservare le energie e il calore corporeo in attesa dei soccorsi;","chinese":"跳水后，应让团员尽快游离将沉没的船只，让团队集中漂浮，不要脱掉衣物，保持体力和体温，等待救援；"},{"italian":"contare tempestivamente tutti i membri del gruppo.","chinese":"及时清点团队人数。"}]},{"category":"应变能力","number":52,"question":"导游带团游览过程中，有旅游者不小心被毒虫蜇伤，应如何处理？","answer":"（1）提醒旅游者尽快离开事发点，以免再次被咬；\n\n（2）记下事发地环境及毒虫样貌，以便后续告诉医生；\n\n（3）判断伤情状况；\n\n（4）清理并冲洗伤口；\n\n（5）就近寻找医疗帮助；\n\n（6）尽快送医救治。","italian_answer":"Se durante la visita un turista viene punto o morso da un insetto velenoso, la guida deve:\n1. ricordargli di allontanarsi rapidamente dal luogo per evitare un’altra puntura o un altro morso;\n2. annotare l’ambiente in cui è avvenuto l’incidente e l’aspetto dell’insetto, così da poter informare il medico;\n3. valutare le condizioni della ferita e la gravità della situazione;\n4. pulire e sciacquare la ferita;\n5. cercare assistenza medica nelle vicinanze;\n6. accompagnare il turista in ospedale il prima possibile.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"ricordargli di allontanarsi rapidamente dal luogo per evitare un’altra puntura o un altro morso;","chinese":"提醒旅游者尽快离开事发点，以免再次被咬；"},{"italian":"annotare l’ambiente in cui è avvenuto l’incidente e l’aspetto dell’insetto, così da poter informare il medico;","chinese":"记下事发地环境及毒虫样貌，以便后续告诉医生；"},{"italian":"valutare le condizioni della ferita e la gravità della situazione;","chinese":"判断伤情状况；"},{"italian":"pulire e sciacquare la ferita;","chinese":"清理并冲洗伤口；"},{"italian":"cercare assistenza medica nelle vicinanze;","chinese":"就近寻找医疗帮助；"},{"italian":"accompagnare il turista in ospedale il prima possibile.","chinese":"尽快送医救治。"}]},{"category":"应变能力","number":53,"question":"导游带团游览过程中突遇洪水袭来，应如何应对？","answer":"（1）导游应沉着冷静，第一时间召集团员向周围高处有序撤离；\n\n（2）应设法尽快发出求救信息，寻求救援；\n\n（3）如有旅游者落水，应呼叫旅游者努力抓住漂浮物或树干，不要靠近电线杆或高压线塔；\n\n（4）如旅游车进入水淹区，应注意水位不应超过汽车底盘，在可行的前提下，要提醒司机尽快迎着水流驶向高处，不能让水流从侧面冲击车体。","italian_answer":"Se durante la visita il gruppo viene sorpreso da un’alluvione, la guida deve:\n1. mantenere la calma e radunare subito i turisti, guidandoli ordinatamente verso i punti più alti nelle vicinanze;\n2. inviare al più presto una richiesta di soccorso;\n3. se un turista cade in acqua, gridargli di afferrare oggetti galleggianti o tronchi; deve evitare di avvicinarsi ai pali elettrici o ai tralicci dell’alta tensione;\n4. se il pullman entra in una zona allagata, fare attenzione che il livello dell’acqua non superi il telaio del veicolo. Se possibile, ricordare all’autista di dirigersi rapidamente verso un luogo più alto procedendo controcorrente, evitando che l’acqua colpisca lateralmente il pullman.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"mantenere la calma e radunare subito i turisti, guidandoli ordinatamente verso i punti più alti nelle vicinanze;","chinese":"导游应沉着冷静，第一时间召集团员向周围高处有序撤离；"},{"italian":"inviare al più presto una richiesta di soccorso;","chinese":"应设法尽快发出求救信息，寻求救援；"},{"italian":"se un turista cade in acqua, gridargli di afferrare oggetti galleggianti o tronchi; deve evitare di avvicinarsi ai pali elettrici o ai tralicci dell’alta tensione;","chinese":"如有旅游者落水，应呼叫旅游者努力抓住漂浮物或树干，不要靠近电线杆或高压线塔；"},{"italian":"se il pullman entra in una zona allagata, fare attenzione che il livello dell’acqua non superi il telaio del veicolo. Se possibile, ricordare all’autista di dirigersi rapidamente verso un luogo più alto procedendo controcorrente, evitando che l’acqua colpisca lateralmente il pullman.","chinese":"如旅游车进入水淹区，应注意水位不应超过汽车底盘，在可行的前提下，要提醒司机尽快迎着水流驶向高处，不能让水流从侧面冲击车体。"}]},{"category":"应变能力","number":54,"question":"导游带团在山区游览过程中突遇泥石流或山体滑坡，应如何应对？","answer":"（1）导游应沉着冷静，召集团员向两侧稳定区撤离，不要沿着山体向上或向下方撤离；\n\n（2）团队不要躲在有滚石或大量堆积物的山坡下方；\n\n（3）团队不要停留在低洼处，也不要爬到树上躲避；\n\n（4）如所处房屋正好在滑坡带，一定要设法从房屋内快速撤离至开阔地带；\n\n（5）应设法尽快发出求救信息，寻求救援。","italian_answer":"Se durante una visita in montagna il gruppo viene sorpreso da una colata detritica o da una frana, la guida deve:\n1. mantenere la calma e far evacuare i turisti verso zone stabili ai lati. Non devono fuggire né verso l’alto né verso il basso lungo il pendio;\n2. non farli riparare sotto pendii con massi in caduta o grandi accumuli di detriti;\n3. non farli sostare in zone basse né salire sugli alberi;\n4. se l’edificio in cui si trovano è nella zona interessata dalla frana, farli uscire rapidamente e raggiungere uno spazio aperto;\n5. inviare al più presto una richiesta di soccorso.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"mantenere la calma e far evacuare i turisti verso zone stabili ai lati. Non devono fuggire né verso l’alto né verso il basso lungo il pendio;","chinese":"导游应沉着冷静，召集团员向两侧稳定区撤离，不要沿着山体向上或向下方撤离；"},{"italian":"non farli riparare sotto pendii con massi in caduta o grandi accumuli di detriti;","chinese":"团队不要躲在有滚石或大量堆积物的山坡下方；"},{"italian":"non farli sostare in zone basse né salire sugli alberi;","chinese":"团队不要停留在低洼处，也不要爬到树上躲避；"},{"italian":"se l’edificio in cui si trovano è nella zona interessata dalla frana, farli uscire rapidamente e raggiungere uno spazio aperto;","chinese":"如所处房屋正好在滑坡带，一定要设法从房屋内快速撤离至开阔地带；"},{"italian":"inviare al più presto una richiesta di soccorso.","chinese":"应设法尽快发出求救信息，寻求救援。"}]},{"category":"应变能力","number":55,"question":"导游带团在山区游览过程中突遇持续大暴雨，应如何应对？","answer":"（1）导游应沉着冷静，召集团员向安全区撤离；\n\n（2）应设法尽快发出求救信息，寻求救援；\n\n（3）团队在积水中行走时，应注意观察，尽量贴近稳固的建筑物；\n\n（4）当上游来水突然浑浊、水位上涨较快时，应注意防范山洪或泥石流。","italian_answer":"Se durante una visita in montagna il gruppo viene sorpreso da piogge molto intense e prolungate, la guida deve:\n1. mantenere la calma, radunare i turisti e guidarli verso una zona sicura;\n2. inviare al più presto una richiesta di soccorso;\n3. se il gruppo deve camminare nell’acqua, osservare attentamente l’ambiente e restare il più vicino possibile agli edifici stabili;\n4. se l’acqua proveniente da monte diventa improvvisamente torbida e il livello sale rapidamente, prestare attenzione al rischio di piena improvvisa o colata detritica.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"mantenere la calma, radunare i turisti e guidarli verso una zona sicura;","chinese":"导游应沉着冷静，召集团员向安全区撤离；"},{"italian":"inviare al più presto una richiesta di soccorso;","chinese":"应设法尽快发出求救信息，寻求救援；"},{"italian":"se il gruppo deve camminare nell’acqua, osservare attentamente l’ambiente e restare il più vicino possibile agli edifici stabili;","chinese":"团队在积水中行走时，应注意观察，尽量贴近稳固的建筑物；"},{"italian":"se l’acqua proveniente da monte diventa improvvisamente torbida e il livello sale rapidamente, prestare attenzione al rischio di piena improvvisa o colata detritica.","chinese":"当上游来水突然浑浊、水位上涨较快时，应注意防范山洪或泥石流。"}]},{"category":"应变能力","number":56,"question":"如果旅游者在自由活动中买到假冒伪劣商品，导游应该如何处理？","answer":"（1）应积极协助旅游者退货并索赔，努力维护旅游者的合法权益；\n\n（2）事后，将经过向旅行社作扼要汇报；\n\n（3）后续行程中多向旅游者宣讲自由活动时购物的注意事项，多做提醒工作。","italian_answer":"Se durante un’attività libera un turista acquista un prodotto contraffatto o di qualità scadente, la guida deve:\n1. aiutarlo attivamente a restituire il prodotto e a chiedere un risarcimento, tutelando i suoi diritti legittimi;\n2. riferire brevemente l’accaduto all’agenzia di viaggi;\n3. durante le tappe successive, spiegare ai turisti le precauzioni da osservare quando fanno acquisti nel tempo libero e ricordare loro di prestare attenzione.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"aiutarlo attivamente a restituire il prodotto e a chiedere un risarcimento, tutelando i suoi diritti legittimi;","chinese":"应积极协助旅游者退货并索赔，努力维护旅游者的合法权益；"},{"italian":"riferire brevemente l’accaduto all’agenzia di viaggi;","chinese":"事后，将经过向旅行社作扼要汇报；"},{"italian":"durante le tappe successive, spiegare ai turisti le precauzioni da osservare quando fanno acquisti nel tempo libero e ricordare loro di prestare attenzione.","chinese":"后续行程中多向旅游者宣讲自由活动时购物的注意事项，多做提醒工作。"}]},{"category":"应变能力","number":57,"question":"旅游者提出想邀请其亲友随团旅游，导游应如何处理？","answer":"（1）在条件允许(如车上有空位)，不影响其他人的情况下，可满足旅游者要求，但事先要征得领队和旅游团其他成员的同意；\n\n（2）导游协助旅游者办理入团手续，并交付各种费用；\n\n（3）导游对旅游者随团活动的亲友应热心服务，一视同仁，并根据情况给予照顾。\n\n（4）如果旅游者亲友不办理手续、不交纳费用就直接随团活动，导游应礼貌地向旅游者及其亲友解释旅行社的有关规定，并做好解释工作。","italian_answer":"Se un turista chiede di invitare un proprio familiare o amico a partecipare al viaggio con il gruppo, la guida deve:\n1. se le condizioni lo permettono, per esempio se ci sono posti liberi sul pullman, e senza creare disagi agli altri, accogliere la richiesta solo dopo aver ottenuto il consenso del capogruppo e degli altri membri del gruppo;\n2. aiutare il turista a completare le procedure per l’inserimento nel gruppo e a pagare tutte le spese;\n3. offrire al familiare o amico lo stesso servizio premuroso riservato agli altri turisti e prestargli attenzione secondo le necessità;\n4. se il familiare o amico partecipa senza completare le procedure e senza pagare, spiegare con cortesia al turista e al familiare o amico le regole dell’agenzia di viaggi.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"se le condizioni lo permettono, per esempio se ci sono posti liberi sul pullman, e senza creare disagi agli altri, accogliere la richiesta solo dopo aver ottenuto il consenso del capogruppo e degli altri membri del gruppo;","chinese":"在条件允许(如车上有空位)，不影响其他人的情况下，可满足旅游者要求，但事先要征得领队和旅游团其他成员的同意；"},{"italian":"aiutare il turista a completare le procedure per l’inserimento nel gruppo e a pagare tutte le spese;","chinese":"导游协助旅游者办理入团手续，并交付各种费用；"},{"italian":"offrire al familiare o amico lo stesso servizio premuroso riservato agli altri turisti e prestargli attenzione secondo le necessità;","chinese":"导游对旅游者随团活动的亲友应热心服务，一视同仁，并根据情况给予照顾。"},{"italian":"se il familiare o amico partecipa senza completare le procedure e senza pagare, spiegare con cortesia al turista e al familiare o amico le regole dell’agenzia di viaggi.","chinese":"如果旅游者亲友不办理手续、不交纳费用就直接随团活动，导游应礼貌地向旅游者及其亲友解释旅行社的有关规定，并做好解释工作。"}]},{"category":"应变能力","number":58,"question":"在与旅游车司机的工作协作中，导游应注意哪些关键细节？","answer":"（1）尊重司机，行程安排多商量；\n\n（2）提醒司机，沿途状况多互通；\n\n（3）协助司机，遇到困难多帮忙；\n\n（4）理解司机，出现纰漏多体谅。","italian_answer":"Nella collaborazione con l’autista del pullman turistico, la guida deve prestare attenzione a questi aspetti:\n1. rispettare l’autista e consultarlo spesso sull’organizzazione del programma;\n2. ricordargli di tenersi reciprocamente aggiornati sulle condizioni lungo il percorso;\n3. aiutarlo quando incontra difficoltà;\n4. comprenderlo e mostrarsi tollerante quando commette errori.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"rispettare l’autista e consultarlo spesso sull’organizzazione del programma;","chinese":"尊重司机，行程安排多商量；"},{"italian":"ricordargli di tenersi reciprocamente aggiornati sulle condizioni lungo il percorso;","chinese":"提醒司机，沿途状况多互通；"},{"italian":"aiutarlo quando incontra difficoltà;","chinese":"协助司机，遇到困难多帮忙；"},{"italian":"comprenderlo e mostrarsi tollerante quando commette errori.","chinese":"理解司机，出现纰漏多体谅。"}]},{"category":"应变能力","number":59,"question":"酒店火灾事故中，如果团队被大火和浓烟包围，导游引导旅游者自救的主要方法有哪些？","answer":"（1）引导旅游者就地开展自救，告诫旅游者不要搭乘电梯或随意跳楼；\n\n（2）应尽快找毛巾沾湿并捂住口鼻，身体尽量贴近地面行走；\n\n（3）若身上着火，不可奔跑，应就地打滚或用厚重衣物压灭火苗；\n\n（4）若大火已封闭逃生通道，则应立即退回室内，用湿被褥塞住门缝，并向窗外发出求救信号，等待救援。","italian_answer":"Se, durante un incendio in albergo, il gruppo è circondato da fiamme e fumo, la guida deve indicare ai turisti i principali metodi di autosoccorso:\n1. guidarli a mettersi al sicuro sul posto e ricordare loro di non usare l’ascensore né di saltare dalle finestre;\n2. bagnare rapidamente un asciugamano, coprire naso e bocca e camminare tenendo il corpo il più vicino possibile al pavimento;\n3. se i vestiti prendono fuoco, non correre: rotolare a terra o soffocare le fiamme con indumenti pesanti;\n4. se il fuoco blocca già le vie di fuga, rientrare subito nella stanza, chiudere le fessure della porta con coperte o lenzuola bagnate, chiedere aiuto dalla finestra e attendere i soccorsi.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"guidarli a mettersi al sicuro sul posto e ricordare loro di non usare l’ascensore né di saltare dalle finestre;","chinese":"引导旅游者就地开展自救，告诫旅游者不要搭乘电梯或随意跳楼；"},{"italian":"bagnare rapidamente un asciugamano, coprire naso e bocca e camminare tenendo il corpo il più vicino possibile al pavimento;","chinese":"应尽快找毛巾沾湿并捂住口鼻，身体尽量贴近地面行走；"},{"italian":"se i vestiti prendono fuoco, non correre: rotolare a terra o soffocare le fiamme con indumenti pesanti;","chinese":"若身上着火，不可奔跑，应就地打滚或用厚重衣物压灭火苗；"},{"italian":"se il fuoco blocca già le vie di fuga, rientrare subito nella stanza, chiudere le fessure della porta con coperte o lenzuola bagnate, chiedere aiuto dalla finestra e attendere i soccorsi.","chinese":"若大火已封闭逃生通道，则应立即退回室内，用湿被褥塞住门缝，并向窗外发出求救信号，等待救援。"}]},{"category":"应变能力","number":60,"question":"为防止旅游者溺水事故的发生，导游应如何做好预防工作？","answer":"（1）做好防溺水措施；\n\n（2）做好热身运动；\n\n（3）做到“五不玩水”。不在身体不舒服时玩水，不在饥饿或过饱时玩水，不独自一人玩水，不去情况不明或禁止的水域玩水，不逞强跳水或潜水；\n\n（4）做到及时上岸。一旦在玩水过程中感觉身体突然不舒服，就应立即上岸休息或结束玩水。","italian_answer":"Per prevenire gli incidenti di annegamento, la guida deve:\n1. adottare misure di prevenzione contro l’annegamento;\n2. far fare esercizi di riscaldamento prima di entrare in acqua;\n3. rispettare le «cinque regole per evitare i rischi in acqua»: non entrare in acqua se ci si sente poco bene; non entrare quando si ha fame o si è troppo sazi; non entrare da soli; non entrare in acque sconosciute o vietate; non tuffarsi né immergersi per mettersi alla prova;\n4. uscire dall’acqua tempestivamente. Se durante il bagno ci si sente improvvisamente male, bisogna uscire subito e riposare o interrompere l’attività.","bilingual_pairing":"逐点对应","bilingual_pairs":[{"italian":"adottare misure di prevenzione contro l’annegamento;","chinese":"做好防溺水措施；"},{"italian":"far fare esercizi di riscaldamento prima di entrare in acqua;","chinese":"做好热身运动；"},{"italian":"rispettare le «cinque regole per evitare i rischi in acqua»: non entrare in acqua se ci si sente poco bene; non entrare quando si ha fame o si è troppo sazi; non entrare da soli; non entrare in acque sconosciute o vietate; non tuffarsi né immergersi per mettersi alla prova;","chinese":"做到“五不玩水”。不在身体不舒服时玩水，不在饥饿或过饱时玩水，不独自一人玩水，不去情况不明或禁止的水域玩水，不逞强跳水或潜水；"},{"italian":"uscire dall’acqua tempestivament
