e. Se durante il bagno ci si sente improvvisamente male, bisogna uscire subito e riposare o interrompere l’attività.","chinese":"做到及时上岸。一旦在玩水过程中感觉身体突然不舒服，就应立即上岸休息或结束玩水。"}]},{"category":"综合知识","number":1,"question":"习近平总书记在庆祝中国共产党成立100周年大会上首次正式提出“两个结合”重大论断，具体内容是什么？","answer":"“两个结合”是习近平文化思想的重要组成部分。2021年7月1日，在庆祝中国共产党成立100周年大会上，习近平总书记首次正式提出“两个结合”重大论断，即“坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合”。","italian_answer":"Il 1° luglio 2021, durante la celebrazione del centenario della fondazione del Partito Comunista Cinese, il Segretario generale Xi Jinping ha formulato per la prima volta in modo ufficiale il principio fondamentale delle «due integrazioni». Questo principio è una parte importante del Pensiero di Xi Jinping sulla cultura e significa: «integrare i principi fondamentali del marxismo con la realtà concreta della Cina e con l’eccellente cultura tradizionale cinese».","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il 1° luglio 2021, durante la celebrazione del centenario della fondazione del Partito Comunista Cinese, il Segretario generale Xi Jinping ha formulato per la prima volta in modo ufficiale il principio fondamentale delle «due integrazioni». Questo principio è una parte importante del Pensiero di Xi Jinping sulla cultura e significa: «integrare i principi fondamentali del marxismo con la realtà concreta della Cina e con l’eccellente cultura tradizionale cinese».","chinese":"“两个结合”是习近平文化思想的重要组成部分。2021年7月1日，在庆祝中国共产党成立100周年大会上，习近平总书记首次正式提出“两个结合”重大论断，即“坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合”。"}]},{"category":"综合知识","number":2,"question":"习近平文化思想强调要推动中华优秀传统文化创造性转化和创新性发展，其具体内涵是什么？","answer":"创造性转化，就是要按照时代特点和要求，对仍有借鉴价值的内涵和陈旧表现形式加以改造，赋予新的时代内涵和现代表达形式。创新性发展，就是要按照时代新进步新进展，对优秀传统文化内涵加以补充、拓展、完善，增强影响力和感召力。","italian_answer":"La trasformazione creativa significa modificare, secondo le caratteristiche e le esigenze della nostra epoca, i contenuti della cultura tradizionale che conservano un valore di riferimento e le forme di espressione ormai superate, attribuendo loro nuovi significati per l’epoca attuale e forme espressive moderne.\nLo sviluppo innovativo significa integrare, ampliare e perfezionare i contenuti dell’eccellente cultura tradizionale, seguendo i nuovi progressi della nostra epoca, per rafforzarne l’influenza e la capacità di ispirare e attrarre.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La trasformazione creativa significa modificare, secondo le caratteristiche e le esigenze della nostra epoca, i contenuti della cultura tradizionale che conservano un valore di riferimento e le forme di espressione ormai superate, attribuendo loro nuovi significati per l’epoca attuale e forme espressive moderne.\nLo sviluppo innovativo significa integrare, ampliare e perfezionare i contenuti dell’eccellente cultura tradizionale, seguendo i nuovi progressi della nostra epoca, per rafforzarne l’influenza e la capacità di ispirare e attrarre.","chinese":"创造性转化，就是要按照时代特点和要求，对仍有借鉴价值的内涵和陈旧表现形式加以改造，赋予新的时代内涵和现代表达形式。创新性发展，就是要按照时代新进步新进展，对优秀传统文化内涵加以补充、拓展、完善，增强影响力和感召力。"}]},{"category":"综合知识","number":3,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》指出，推进文化和旅游深度融合发展具有什么重大意义？","answer":"推进文化和旅游深度融合发展，是以习近平同志为核心的党中央着眼建设文化强国旅游强国作出的重大战略部署，对于增强文化自信、服务人民群众美好生活、促进高质量发展具有重大意义。","italian_answer":"Promuovere una profonda integrazione tra cultura e turismo è una importante decisione strategica del Comitato Centrale del Partito Comunista Cinese, con il compagno Xi Jinping al centro, in vista della costruzione di una grande potenza culturale e turistica. Questa integrazione è di grande importanza per rafforzare la fiducia culturale, rispondere al desiderio della popolazione di una vita migliore e promuovere uno sviluppo di alta qualità.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Promuovere una profonda integrazione tra cultura e turismo è una importante decisione strategica del Comitato Centrale del Partito Comunista Cinese, con il compagno Xi Jinping al centro, in vista della costruzione di una grande potenza culturale e turistica. Questa integrazione è di grande importanza per rafforzare la fiducia culturale, rispondere al desiderio della popolazione di una vita migliore e promuovere uno sviluppo di alta qualità.","chinese":"推进文化和旅游深度融合发展，是以习近平同志为核心的党中央着眼建设文化强国旅游强国作出的重大战略部署，对于增强文化自信、服务人民群众美好生活、促进高质量发展具有重大意义。"}]},{"category":"综合知识","number":4,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》明确，2027年、2030年分两步走建设文化强省和旅游强省。其中，到2027年的阶段性目标是什么？","answer":"到2027年，全省文化和旅游发展格局进一步优化，引育一批竞争力和带动力强的文旅链主企业，形成一批具有四川特色和优势的文旅融合业态，文化及相关产业增加值、旅游总花费分别达到3800亿元、2万亿元左右，文旅产业成为战略性支柱产业。","italian_answer":"Entro il 2027, il modello di sviluppo della cultura e del turismo in tutta la provincia sarà ulteriormente ottimizzato. Saranno attratte e formate imprese leader di filiera nel settore culturale e turistico, con forte competitività e capacità di traino, e saranno sviluppate attività integrate che riflettano le caratteristiche e i vantaggi del Sichuan. Il valore aggiunto delle industrie culturali e dei settori correlati e la spesa turistica totale raggiungeranno rispettivamente circa 380 miliardi e 2.000 miliardi di yuan. L’industria culturale e turistica diventerà un settore strategico portante.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Entro il 2027, il modello di sviluppo della cultura e del turismo in tutta la provincia sarà ulteriormente ottimizzato. Saranno attratte e formate imprese leader di filiera nel settore culturale e turistico, con forte competitività e capacità di traino, e saranno sviluppate attività integrate che riflettano le caratteristiche e i vantaggi del Sichuan. Il valore aggiunto delle industrie culturali e dei settori correlati e la spesa turistica totale raggiungeranno rispettivamente circa 380 miliardi e 2.000 miliardi di yuan. L’industria culturale e turistica diventerà un settore strategico portante.","chinese":"到2027年，全省文化和旅游发展格局进一步优化，引育一批竞争力和带动力强的文旅链主企业，形成一批具有四川特色和优势的文旅融合业态，文化及相关产业增加值、旅游总花费分别达到3800亿元、2万亿元左右，文旅产业成为战略性支柱产业。"}]},{"category":"综合知识","number":5,"question":"《决定》明确，到2030年，文化和旅游深度融合发展要达到什么目标？","answer":"到2030年，文化和旅游深度融合发展体制机制更加健全，巴蜀文化影响力、四川旅游吸引力、文旅产业竞争力显著提升，文化强省旅游强省建设迈上新台阶。","italian_answer":"Entro il 2030, il sistema e i meccanismi per la profonda integrazione tra cultura e turismo saranno più completi. L’influenza della cultura Bashu, l’attrattiva turistica del Sichuan e la competitività dell’industria culturale e turistica aumenteranno notevolmente. La costruzione del Sichuan come provincia forte nella cultura e nel turismo raggiungerà un nuovo livello.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Entro il 2030, il sistema e i meccanismi per la profonda integrazione tra cultura e turismo saranno più completi. L’influenza della cultura Bashu, l’attrattiva turistica del Sichuan e la competitività dell’industria culturale e turistica aumenteranno notevolmente. La costruzione del Sichuan come provincia forte nella cultura e nel turismo raggiungerà un nuovo livello.","chinese":"到2030年，文化和旅游深度融合发展体制机制更加健全，巴蜀文化影响力、四川旅游吸引力、文旅产业竞争力显著提升，文化强省旅游强省建设迈上新台阶。"}]},{"category":"综合知识","number":6,"question":"“锦绣天府·安逸四川”是四川全力打造的文旅品牌。请简述这一品牌的核心内涵。","answer":"“锦绣”既代指四川非物质文化遗产代表性蜀锦蜀绣，又蕴含锦绣河山、锦绣华章等多重寓意，展现了“天府之国”的美好意象；“安逸”是四川最为广泛使用的方言词汇，具有很强的四川辨识度，习近平总书记曾深情地祝福四川人民生活越来越安逸。“锦绣”与“安逸”相映，充分绽放出四川独特的自然生态之美、多彩人文之韵，也向世界展示出中国式现代化的四川篇章的万千气象。","italian_answer":"«Jinxiu» richiama sia il broccato Shu e il ricamo Shu, rappresentativi del patrimonio culturale immateriale del Sichuan, sia immagini come paesaggi splendidi e grandi opere culturali. Esprime la bella immagine della «Terra dell’Abbondanza».\n«Anyi» è una parola dialettale molto diffusa in Sichuan e rappresenta fortemente l’identità locale. Il Segretario generale Xi Jinping ha espresso con affetto l’augurio che la vita del popolo del Sichuan diventi sempre più serena e piacevole.\nL’unione di «Jinxiu» e «Anyi» mette pienamente in risalto la bellezza naturale ed ecologica e la ricchezza culturale del Sichuan, mostrando al mondo il magnifico panorama dello sviluppo del Sichuan nel quadro della modernizzazione in stile cinese.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"«Jinxiu» richiama sia il broccato Shu e il ricamo Shu, rappresentativi del patrimonio culturale immateriale del Sichuan, sia immagini come paesaggi splendidi e grandi opere culturali. Esprime la bella immagine della «Terra dell’Abbondanza».\n«Anyi» è una parola dialettale molto diffusa in Sichuan e rappresenta fortemente l’identità locale. Il Segretario generale Xi Jinping ha espresso con affetto l’augurio che la vita del popolo del Sichuan diventi sempre più serena e piacevole.\nL’unione di «Jinxiu» e «Anyi» mette pienamente in risalto la bellezza naturale ed ecologica e la ricchezza culturale del Sichuan, mostrando al mondo il magnifico panorama dello sviluppo del Sichuan nel quadro della modernizzazione in stile cinese.","chinese":"“锦绣”既代指四川非物质文化遗产代表性蜀锦蜀绣，又蕴含锦绣河山、锦绣华章等多重寓意，展现了“天府之国”的美好意象；“安逸”是四川最为广泛使用的方言词汇，具有很强的四川辨识度，习近平总书记曾深情地祝福四川人民生活越来越安逸。“锦绣”与“安逸”相映，充分绽放出四川独特的自然生态之美、多彩人文之韵，也向世界展示出中国式现代化的四川篇章的万千气象。"}]},{"category":"综合知识","number":7,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》提出建设世界级文旅地标，具体包括哪些内容？","answer":"扩大标志性品牌国际影响力，提升三星堆—金沙、九寨沟—黄龙、大熊猫、峨眉山—乐山大佛、青城山—都江堰、翠云廊—剑门关品牌知名度，培育若尔盖湿地、稻城亚丁等世界级文旅新地标，打造享誉全球、来川必游的文旅旗舰项目。","italian_answer":"La decisione propone di ampliare l’influenza internazionale dei marchi più rappresentativi e di aumentare la notorietà di Sanxingdui-Jinsha, Jiuzhaigou-Huanglong, del panda gigante, del Monte Emei-Buddha gigante di Leshan, di Qingchengshan-Dujiangyan e del Corridoio Cuiyun-Jianmenguan. Propone inoltre di sviluppare nuovi punti di riferimento turistici di livello mondiale, come le zone umide di Ruoergai e Daocheng Yading, e di creare progetti turistici di punta, famosi in tutto il mondo e imperdibili per chi visita il Sichuan.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La decisione propone di ampliare l’influenza internazionale dei marchi più rappresentativi e di aumentare la notorietà di Sanxingdui-Jinsha, Jiuzhaigou-Huanglong, del panda gigante, del Monte Emei-Buddha gigante di Leshan, di Qingchengshan-Dujiangyan e del Corridoio Cuiyun-Jianmenguan. Propone inoltre di sviluppare nuovi punti di riferimento turistici di livello mondiale, come le zone umide di Ruoergai e Daocheng Yading, e di creare progetti turistici di punta, famosi in tutto il mondo e imperdibili per chi visita il Sichuan.","chinese":"扩大标志性品牌国际影响力，提升三星堆—金沙、九寨沟—黄龙、大熊猫、峨眉山—乐山大佛、青城山—都江堰、翠云廊—剑门关品牌知名度，培育若尔盖湿地、稻城亚丁等世界级文旅新地标，打造享誉全球、来川必游的文旅旗舰项目。"}]},{"category":"综合知识","number":8,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》提出打造世界级文旅风景道，具体包括哪些内容？","answer":"高标准建设国道318/317中国最美景观大道，打造藏羌彝民族风情、蜀道三国文化、大巴山—嘉陵江红色文化、岷江生态文化、天府大道城市文化等主题文旅风景道，推出具有全球吸引力的精品线路。","italian_answer":"La decisione prevede la costruzione, secondo standard elevati, delle strade panoramiche più belle della Cina lungo le strade nazionali 318 e 317. Prevede inoltre itinerari tematici dedicati alle culture etniche tibetana, qiang e yi; alla cultura dei Tre Regni lungo l’antica Via Shu; alla cultura rivoluzionaria dei monti Daba e del fiume Jialing; alla cultura ecologica del fiume Minjiang; e alla cultura urbana del Viale Tianfu. L’obiettivo è proporre itinerari di alta qualità capaci di attrarre visitatori da tutto il mondo.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La decisione prevede la costruzione, secondo standard elevati, delle strade panoramiche più belle della Cina lungo le strade nazionali 318 e 317. Prevede inoltre itinerari tematici dedicati alle culture etniche tibetana, qiang e yi; alla cultura dei Tre Regni lungo l’antica Via Shu; alla cultura rivoluzionaria dei monti Daba e del fiume Jialing; alla cultura ecologica del fiume Minjiang; e alla cultura urbana del Viale Tianfu. L’obiettivo è proporre itinerari di alta qualità capaci di attrarre visitatori da tutto il mondo.","chinese":"高标准建设国道318/317中国最美景观大道，打造藏羌彝民族风情、蜀道三国文化、大巴山—嘉陵江红色文化、岷江生态文化、天府大道城市文化等主题文旅风景道，推出具有全球吸引力的精品线路。"}]},{"category":"综合知识","number":9,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》在强化非物质文化遗产保护传承和活化利用方面提出了哪些措施？","answer":"实施“非遗四川·百城百艺”转化利用工程，办好中国成都国际非物质文化遗产节，推动蜀锦、蜀绣、川剧等代表性项目进景区、进街区、进校园，发展主题文化游和深度研学游、科普游，高标准开展研学旅游基地品质提升试点工作。","italian_answer":"La decisione prevede il progetto «Patrimonio culturale immateriale del Sichuan: cento città e cento arti» per promuovere la trasformazione e l’utilizzo del patrimonio. Prevede di organizzare il Festival internazionale del patrimonio culturale immateriale di Chengdu e di portare progetti rappresentativi come il broccato Shu, il ricamo Shu e l’opera del Sichuan nelle aree panoramiche, nei quartieri e nelle scuole. Inoltre, promuove viaggi culturali tematici, viaggi di studio approfonditi e viaggi di divulgazione scientifica, e realizza progetti pilota per migliorare la qualità delle basi di turismo educativo.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La decisione prevede il progetto «Patrimonio culturale immateriale del Sichuan: cento città e cento arti» per promuovere la trasformazione e l’utilizzo del patrimonio. Prevede di organizzare il Festival internazionale del patrimonio culturale immateriale di Chengdu e di portare progetti rappresentativi come il broccato Shu, il ricamo Shu e l’opera del Sichuan nelle aree panoramiche, nei quartieri e nelle scuole. Inoltre, promuove viaggi culturali tematici, viaggi di studio approfonditi e viaggi di divulgazione scientifica, e realizza progetti pilota per migliorare la qualità delle basi di turismo educativo.","chinese":"实施“非遗四川·百城百艺”转化利用工程，办好中国成都国际非物质文化遗产节，推动蜀锦、蜀绣、川剧等代表性项目进景区、进街区、进校园，发展主题文化游和深度研学游、科普游，高标准开展研学旅游基地品质提升试点工作。"}]},{"category":"综合知识","number":10,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》在丰富特色康养旅游产品方面做出哪些部署？","answer":"依托阳光、温泉、森林、药材等特色资源做强“康（医）养+”产业，发展金沙江—安宁河阳光康养、大巴山森林康养、雅眉乐医药康养、蜀南竹海生态康养，探索打造环成都近距离避暑康养休闲度假旅游带。","italian_answer":"La decisione prevede di rafforzare il settore «salute e benessere» basandosi sulle risorse caratteristiche del Sichuan, come il sole, le sorgenti termali, le foreste e le piante medicinali. Intende sviluppare il turismo del benessere al sole lungo i fiumi Jinsha e Anning, il benessere forestale nei monti Daba, il benessere medico e farmaceutico nell’area Ya’an-Meishan-Leshan e il benessere ecologico nella foresta di bambù del sud del Sichuan. Prevede inoltre di esplorare la creazione di una cintura turistica per vacanze, riposo e benessere estivo nelle zone vicine a Chengdu.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La decisione prevede di rafforzare il settore «salute e benessere» basandosi sulle risorse caratteristiche del Sichuan, come il sole, le sorgenti termali, le foreste e le piante medicinali. Intende sviluppare il turismo del benessere al sole lungo i fiumi Jinsha e Anning, il benessere forestale nei monti Daba, il benessere medico e farmaceutico nell’area Ya’an-Meishan-Leshan e il benessere ecologico nella foresta di bambù del sud del Sichuan. Prevede inoltre di esplorare la creazione di una cintura turistica per vacanze, riposo e benessere estivo nelle zone vicine a Chengdu.","chinese":"依托阳光、温泉、森林、药材等特色资源做强“康（医）养+”产业，发展金沙江—安宁河阳光康养、大巴山森林康养、雅眉乐医药康养、蜀南竹海生态康养，探索打造环成都近距离避暑康养休闲度假旅游带。"}]},{"category":"综合知识","number":11,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》在建设精品旅游度假区方面作出了哪些安排？","answer":"提升天府青城、西岭雪山—花水湾、西昌邛海、峨秀湖等国家级旅游度假区品质，支持九寨华美胜地、广元曾家山、绵阳仙海、遂宁观音湖、阆中嘉陵江山、宜宾李庄等建设国家级旅游度假区。","italian_answer":"La decisione prevede di migliorare la qualità delle aree turistiche di villeggiatura già riconosciute a livello nazionale, come Tianfu Qingcheng, Xiling Snow Mountain-Huashuiwan, il lago Qionghai di Xichang e il lago E'xiu di Emeishan. Sostiene inoltre la realizzazione di aree turistiche di villeggiatura di livello nazionale in località come Jiuzhai Huamei Shengdi, Zengjiashan a Guangyuan, il lago Xianhai a Mianyang, il lago Guanyin a Suining, il paesaggio del fiume Jialing a Langzhong e Lizhuang a Yibin.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La decisione prevede di migliorare la qualità delle aree turistiche di villeggiatura già riconosciute a livello nazionale, come Tianfu Qingcheng, Xiling Snow Mountain-Huashuiwan, il lago Qionghai di Xichang e il lago E'xiu di Emeishan. Sostiene inoltre la realizzazione di aree turistiche di villeggiatura di livello nazionale in località come Jiuzhai Huamei Shengdi, Zengjiashan a Guangyuan, il lago Xianhai a Mianyang, il lago Guanyin a Suining, il paesaggio del fiume Jialing a Langzhong e Lizhuang a Yibin.","chinese":"提升天府青城、西岭雪山—花水湾、西昌邛海、峨秀湖等国家级旅游度假区品质，支持九寨华美胜地、广元曾家山、绵阳仙海、遂宁观音湖、阆中嘉陵江山、宜宾李庄等建设国家级旅游度假区。"}]},{"category":"综合知识","number":12,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》对推进农文旅深度融合发展作出了哪些安排？","answer":"有序提升乡村景区化水平，依托川西林盘、川北民居、藏羌碉楼、彝家新寨等建设乡村旅游特色村镇。丰富乡村文旅业态，发展田园民宿、景观农业、休闲农业，打造非遗村、运动村、音乐村、康养村等主题村庄。开发乡村文旅特色产品，利用乡村文化文物、农业文化遗产、非遗等资源开发乡村文旅商品。","italian_answer":"La decisione prevede di migliorare gradualmente il livello di sviluppo turistico dei villaggi. Intende creare villaggi e borghi caratteristici per il turismo rurale, valorizzando i «linpan» del Sichuan occidentale, le abitazioni tradizionali del Sichuan settentrionale, le torri fortificate tibetane e qiang e i nuovi villaggi yi. Prevede di arricchire le attività culturali e turistiche rurali, sviluppando alloggi in campagna, agricoltura paesaggistica e agricoltura ricreativa, e di creare villaggi tematici dedicati al patrimonio culturale immateriale, allo sport, alla musica e al benessere. Intende inoltre sviluppare prodotti turistici rurali caratteristici utilizzando le risorse culturali dei villaggi, il patrimonio culturale agricolo e il patrimonio culturale immateriale.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La decisione prevede di migliorare gradualmente il livello di sviluppo turistico dei villaggi. Intende creare villaggi e borghi caratteristici per il turismo rurale, valorizzando i «linpan» del Sichuan occidentale, le abitazioni tradizionali del Sichuan settentrionale, le torri fortificate tibetane e qiang e i nuovi villaggi yi. Prevede di arricchire le attività culturali e turistiche rurali, sviluppando alloggi in campagna, agricoltura paesaggistica e agricoltura ricreativa, e di creare villaggi tematici dedicati al patrimonio culturale immateriale, allo sport, alla musica e al benessere. Intende inoltre sviluppare prodotti turistici rurali caratteristici utilizzando le risorse culturali dei villaggi, il patrimonio culturale agricolo e il patrimonio culturale immateriale.","chinese":"有序提升乡村景区化水平，依托川西林盘、川北民居、藏羌碉楼、彝家新寨等建设乡村旅游特色村镇。丰富乡村文旅业态，发展田园民宿、景观农业、休闲农业，打造非遗村、运动村、音乐村、康养村等主题村庄。开发乡村文旅特色产品，利用乡村文化文物、农业文化遗产、非遗等资源开发乡村文旅商品。"}]},{"category":"综合知识","number":13,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》在构建“快旅慢游”交通网络和提升旅游住宿品质方面提出了哪些要求？","answer":"实施交旅融合建设行动，推进大峨眉、大香格里拉、大九寨、大蜀道等重点项目，高质量打造成都国际航空枢纽。建设落地自驾服务体系，优化公交旅游专线、景区小交通。提升旅游住宿品质，培育凸显巴风蜀韵的文化主题旅游饭店，发展和规范房车、帐篷、民宿等特色住宿。","italian_answer":"La decisione prevede un’azione per integrare trasporti e turismo, promuovendo progetti importanti come la Grande area del Monte Emei, la Grande area di Shangri-La, la Grande area di Jiuzhaigou e la Grande Via Shu, e sviluppando con standard elevati il polo aeroportuale internazionale di Chengdu. Prevede di creare un sistema di servizi per i viaggi in auto, ottimizzare le linee speciali di autobus turistici e i trasporti interni delle aree panoramiche. Per migliorare la qualità degli alloggi, intende sviluppare alberghi a tema culturale con caratteristiche Bashu e promuovere e regolamentare sistemazioni particolari come camper, tende e alloggi in famiglia.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La decisione prevede un’azione per integrare trasporti e turismo, promuovendo progetti importanti come la Grande area del Monte Emei, la Grande area di Shangri-La, la Grande area di Jiuzhaigou e la Grande Via Shu, e sviluppando con standard elevati il polo aeroportuale internazionale di Chengdu. Prevede di creare un sistema di servizi per i viaggi in auto, ottimizzare le linee speciali di autobus turistici e i trasporti interni delle aree panoramiche. Per migliorare la qualità degli alloggi, intende sviluppare alberghi a tema culturale con caratteristiche Bashu e promuovere e regolamentare sistemazioni particolari come camper, tende e alloggi in famiglia.","chinese":"实施交旅融合建设行动，推进大峨眉、大香格里拉、大九寨、大蜀道等重点项目，高质量打造成都国际航空枢纽。建设落地自驾服务体系，优化公交旅游专线、景区小交通。提升旅游住宿品质，培育凸显巴风蜀韵的文化主题旅游饭店，发展和规范房车、帐篷、民宿等特色住宿。"}]},{"category":"综合知识","number":14,"question":"2025年6月17日，中国共产党四川省第十二届委员会第七次全体会议召开，审议通过了《中共四川省委关于推进文化和旅游深度融合发展、做大做强文化旅游业的决定》。《决定》在培育“蜀里安逸”消费新场景和激发文旅消费方面作出了哪些部署？","answer":"建好国家文化和旅游消费示范（试点）城市，打造世界级、都市级、区域级标志性商圈，培育200个“蜀里安逸”消费新场景。大力发展首发经济、假日经济、会展经济、夜间经济、低空经济、票根经济，实施“引客入川”计划。","italian_answer":"La decisione prevede di sviluppare città dimostrative o pilota per i consumi culturali e turistici nazionali e di creare aree commerciali emblematiche di livello mondiale, metropolitano e regionale. Intende inoltre sviluppare 200 nuovi scenari di consumo «Shuli Anyi». Promuove l’economia dei lanci di nuovi prodotti, delle festività, delle fiere e mostre, notturna, a bassa quota e legata ai tagliandi dei biglietti, e attua il programma «Portare visitatori nel Sichuan».","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La decisione prevede di sviluppare città dimostrative o pilota per i consumi culturali e turistici nazionali e di creare aree commerciali emblematiche di livello mondiale, metropolitano e regionale. Intende inoltre sviluppare 200 nuovi scenari di consumo «Shuli Anyi». Promuove l’economia dei lanci di nuovi prodotti, delle festività, delle fiere e mostre, notturna, a bassa quota e legata ai tagliandi dei biglietti, e attua il programma «Portare visitatori nel Sichuan».","chinese":"建好国家文化和旅游消费示范（试点）城市，打造世界级、都市级、区域级标志性商圈，培育200个“蜀里安逸”消费新场景。大力发展首发经济、假日经济、会展经济、夜间经济、低空经济、票根经济，实施“引客入川”计划。"}]},{"category":"综合知识","number":15,"question":"《旅游强国建设“十五五”规划》明确了旅游城市和特色旅游地布局，其中四川的哪些地方被纳入？分别是什么定位？","answer":"成都被纳入旅游枢纽城市布局，强化其作为区域旅游组织中心和重要旅游目的地的辐射带动功能。乐山被纳入重点旅游城市布局，支持其提升旅游竞争力和综合服务能力。都江堰、稻城、九寨沟被纳入特色旅游地布局，支持其依托独特资源打造具有核心吸引力的旅游目的地。","italian_answer":"Chengdu è inclusa nella rete delle città-hub turistiche, con il compito di rafforzare il suo ruolo di centro regionale di organizzazione turistica e di importante destinazione, capace di trainare le aree circostanti. Leshan è inclusa tra le principali città turistiche, per migliorare la competitività turistica e la capacità complessiva di fornire servizi. Dujiangyan, Daocheng e Jiuzhaigou sono incluse tra le destinazioni turistiche caratteristiche, che potranno valorizzare le proprie risorse uniche per diventare destinazioni di forte attrattiva.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Chengdu è inclusa nella rete delle città-hub turistiche, con il compito di rafforzare il suo ruolo di centro regionale di organizzazione turistica e di importante destinazione, capace di trainare le aree circostanti. Leshan è inclusa tra le principali città turistiche, per migliorare la competitività turistica e la capacità complessiva di fornire servizi. Dujiangyan, Daocheng e Jiuzhaigou sono incluse tra le destinazioni turistiche caratteristiche, che potranno valorizzare le proprie risorse uniche per diventare destinazioni di forte attrattiva.","chinese":"成都被纳入旅游枢纽城市布局，强化其作为区域旅游组织中心和重要旅游目的地的辐射带动功能。乐山被纳入重点旅游城市布局，支持其提升旅游竞争力和综合服务能力。都江堰、稻城、九寨沟被纳入特色旅游地布局，支持其依托独特资源打造具有核心吸引力的旅游目的地。"}]},{"category":"综合知识","number":16,"question":"《旅游强国建设“十五五”规划》对旅游产品提质升级和融合业态培育分别部署了哪些重点行动？","answer":"旅游产品提质升级工程包括旅游景区强基焕新行动、旅游度假区品质提升行动、乡村旅游提质增效行动、红色旅游提质升级行动。旅游融合业态培育工程包括发展农业旅游、发展工业旅游、发展体育旅游、发展交通旅游、发展康养旅游。","italian_answer":"Il progetto per migliorare la qualità e aggiornare i prodotti turistici comprende quattro azioni: rafforzare e rinnovare le aree panoramiche; migliorare la qualità delle aree turistiche di villeggiatura; aumentare la qualità e l’efficienza del turismo rurale; migliorare e aggiornare il turismo rosso.\nIl progetto per sviluppare attività turistiche integrate comprende: turismo agricolo, industriale, sportivo, dei trasporti e del benessere.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il progetto per migliorare la qualità e aggiornare i prodotti turistici comprende quattro azioni: rafforzare e rinnovare le aree panoramiche; migliorare la qualità delle aree turistiche di villeggiatura; aumentare la qualità e l’efficienza del turismo rurale; migliorare e aggiornare il turismo rosso.\nIl progetto per sviluppare attività turistiche integrate comprende: turismo agricolo, industriale, sportivo, dei trasporti e del benessere.","chinese":"旅游产品提质升级工程包括旅游景区强基焕新行动、旅游度假区品质提升行动、乡村旅游提质增效行动、红色旅游提质升级行动。旅游融合业态培育工程包括发展农业旅游、发展工业旅游、发展体育旅游、发展交通旅游、发展康养旅游。"}]},{"category":"综合知识","number":17,"question":"简要介绍三星堆博物馆新馆的基本情况。","answer":"2023年7月28日，三星堆博物馆新馆正式开放。新馆以“三星伴月”为设计灵感，是目前西南地区建成的最大的遗址类博物馆单体建筑。馆内展陈共分为“世纪逐梦”“巍然王都”“天地人神”三大部分，采用丰富的文物组合和视觉、听觉等多种表现手段，全方位多层次展示三星堆遗址的前 世今生。","italian_answer":"Il nuovo Museo di Sanxingdui è stato aperto ufficialmente il 28 luglio 2023. Il progetto architettonico si ispira all’immagine «Tre stelle accompagnano la luna» ed è il più grande edificio singolo di un museo dedicato a un sito archeologico attualmente costruito nella Cina sud-occidentale. L’esposizione è suddivisa in tre sezioni: «Un sogno di un secolo», «La maestosa capitale» e «Cielo, terra, uomo e divinità». Attraverso ricche combinazioni di reperti e diversi mezzi visivi e sonori, il museo presenta in modo completo e approfondito il passato e il presente del sito di Sanxingdui.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il nuovo Museo di Sanxingdui è stato aperto ufficialmente il 28 luglio 2023. Il progetto architettonico si ispira all’immagine «Tre stelle accompagnano la luna» ed è il più grande edificio singolo di un museo dedicato a un sito archeologico attualmente costruito nella Cina sud-occidentale. L’esposizione è suddivisa in tre sezioni: «Un sogno di un secolo», «La maestosa capitale» e «Cielo, terra, uomo e divinità». Attraverso ricche combinazioni di reperti e diversi mezzi visivi e sonori, il museo presenta in modo completo e approfondito il passato e il presente del sito di Sanxingdui.","chinese":"2023年7月28日，三星堆博物馆新馆正式开放。新馆以“三星伴月”为设计灵感，是目前西南地区建成的最大的遗址类博物馆单体建筑。馆内展陈共分为“世纪逐梦”“巍然王都”“天地人神”三大部分，采用丰富的文物组合和视觉、听觉等多种表现手段，全方位多层次展示三星堆遗址的前 世今生。"}]},{"category":"综合知识","number":18,"question":"2024年6月，文化和旅游部确定22家旅游度假区为国家级旅游度假区，四川上榜的是？目前，四川省的国家级旅游度假区还有哪些？","answer":"成都西岭雪山—花水湾旅游度假区上榜。目前，四川省已入选国家级旅游度假区的还有邛海旅游度假区、天府青城康养休闲旅游度假区、峨眉山市峨秀湖旅游度假区及宜宾蜀南竹海旅游度假区。","italian_answer":"Nel giugno 2024, il Ministero della Cultura e del Turismo ha riconosciuto 22 nuove aree turistiche di villeggiatura di livello nazionale. In Sichuan è stata selezionata l’area turistica di villeggiatura Xiling Snow Mountain-Huashuiwan di Chengdu. Le altre aree del Sichuan già riconosciute a livello nazionale sono l’area turistica del lago Qionghai, l’area di benessere e vacanza Tianfu Qingcheng, l’area turistica del lago E'xiu a Emeishan e l’area turistica della foresta di bambù del sud del Sichuan a Yibin.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Nel giugno 2024, il Ministero della Cultura e del Turismo ha riconosciuto 22 nuove aree turistiche di villeggiatura di livello nazionale. In Sichuan è stata selezionata l’area turistica di villeggiatura Xiling Snow Mountain-Huashuiwan di Chengdu. Le altre aree del Sichuan già riconosciute a livello nazionale sono l’area turistica del lago Qionghai, l’area di benessere e vacanza Tianfu Qingcheng, l’area turistica del lago E'xiu a Emeishan e l’area turistica della foresta di bambù del sud del Sichuan a Yibin.","chinese":"成都西岭雪山—花水湾旅游度假区上榜。目前，四川省已入选国家级旅游度假区的还有邛海旅游度假区、天府青城康养休闲旅游度假区、峨眉山市峨秀湖旅游度假区及宜宾蜀南竹海旅游度假区。"}]},{"category":"综合知识","number":19,"question":"2023年7月，四川省人民政府办公厅印发了《四川省建设世界重要旅游目的地规划（2023—2035年）》，请简要介绍规划的目标定位。","answer":"四川省建设世界重要旅游目的地的总体定位是建设“一省四地”。“一省”即世界重要旅游目的地省；“四地”即国际一流大熊猫生态旅游目的地、世界知名巴蜀文化旅游目的地、安逸四川生活体验旅游目的地、全球极高山最佳山地旅游目的地。","italian_answer":"L’obiettivo generale del Sichuan è costruire una provincia che sia un’importante destinazione turistica mondiale, secondo il modello «una provincia e quattro destinazioni».\n«Una provincia» significa fare del Sichuan una provincia che sia un’importante destinazione turistica mondiale.\nLe «quattro destinazioni» sono: una destinazione internazionale di primo livello per il turismo ecologico del panda gigante; una destinazione famosa nel mondo per il turismo culturale Bashu; una destinazione per vivere l’esperienza dello stile di vita sereno del Sichuan; e la migliore destinazione mondiale per il turismo montano nelle aree di altissima quota.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’obiettivo generale del Sichuan è costruire una provincia che sia un’importante destinazione turistica mondiale, secondo il modello «una provincia e quattro destinazioni».\n«Una provincia» significa fare del Sichuan una provincia che sia un’importante destinazione turistica mondiale.\nLe «quattro destinazioni» sono: una destinazione internazionale di primo livello per il turismo ecologico del panda gigante; una destinazione famosa nel mondo per il turismo culturale Bashu; una destinazione per vivere l’esperienza dello stile di vita sereno del Sichuan; e la migliore destinazione mondiale per il turismo montano nelle aree di altissima quota.","chinese":"四川省建设世界重要旅游目的地的总体定位是建设“一省四地”。“一省”即世界重要旅游目的地省；“四地”即国际一流大熊猫生态旅游目的地、世界知名巴蜀文化旅游目的地、安逸四川生活体验旅游目的地、全球极高山最佳山地旅游目的地。"}]},{"category":"综合知识","number":20,"question":"2026年1月20日，四川省文化和旅游局长会议提出了 “十五五” 时期，全省文旅工作实施“1155”总体发展思路。请简述其具体内涵。","answer":"“1155”总体发展思路是指以共建巴蜀文化旅游走廊为牵引，以打造“锦绣天府·安逸四川”文旅品牌为统领，以构建“五区协同”文旅融合发展布局为支撑，夯实文化根脉、产业体系、服务水平、深化改革、治理能力五大战略支点，坚定推进文旅深度融合发展，加快建设文化强省旅游强省。","italian_answer":"La strategia generale «1155» significa: utilizzare la costruzione congiunta del Corridoio turistico e culturale Bashu come forza trainante; assumere il marchio turistico e culturale «Jinxiu Tianfu·Anyi Sichuan» come guida; sostenere lo sviluppo integrato di cultura e turismo con una struttura di «cinque aree coordinate»; rafforzare cinque pilastri strategici, cioè le radici culturali, il sistema industriale, il livello dei servizi, l’approfondimento delle riforme e la capacità di governance. L’obiettivo è promuovere con determinazione l’integrazione profonda tra cultura e turismo e accelerare la costruzione di una provincia forte nella cultura e nel turismo.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La strategia generale «1155» significa: utilizzare la costruzione congiunta del Corridoio turistico e culturale Bashu come forza trainante; assumere il marchio turistico e culturale «Jinxiu Tianfu·Anyi Sichuan» come guida; sostenere lo sviluppo integrato di cultura e turismo con una struttura di «cinque aree coordinate»; rafforzare cinque pilastri strategici, cioè le radici culturali, il sistema industriale, il livello dei servizi, l’approfondimento delle riforme e la capacità di governance. L’obiettivo è promuovere con determinazione l’integrazione profonda tra cultura e turismo e accelerare la costruzione di una provincia forte nella cultura e nel turismo.","chinese":"“1155”总体发展思路是指以共建巴蜀文化旅游走廊为牵引，以打造“锦绣天府·安逸四川”文旅品牌为统领，以构建“五区协同”文旅融合发展布局为支撑，夯实文化根脉、产业体系、服务水平、深化改革、治理能力五大战略支点，坚定推进文旅深度融合发展，加快建设文化强省旅游强省。"}]},{"category":"综合知识","number":21,"question":"中国旅游日活动时间定于每年哪一天？并简述其渊源。","answer":"每年的5月19日。2011年4月，国务院正式批复同意自2011年起，将每年5月19日《徐霞客游记》的开篇日确定为“中国旅游日”。《徐霞客游记》开篇《游天台山记》记叙：“癸丑之三月晦（1613年5月19日），自宁海出西门，云散日朗，人意山光，俱有喜态。”开篇短短24个字，为后人留下了文化旅游的瑰宝。","italian_answer":"La Giornata cinese del turismo si celebra ogni anno il 19 maggio. Nell’aprile 2011, il Consiglio di Stato ha approvato ufficialmente la scelta del 19 maggio, a partire dal 2011, perché è il giorno in cui inizia il «Diario dei viaggi di Xu Xiake». Il testo iniziale, «Diario di un viaggio sul monte Tiantai», racconta: «L’ultimo giorno del terzo mese dell’anno Guichou (19 maggio 1613), uscii dalla porta occidentale di Ninghai; le nuvole si erano diradate e il sole splendeva, e sia le persone sia il paesaggio montano apparivano pieni di gioia». Questi soli 24 caratteri hanno lasciato ai posteri un prezioso patrimonio del turismo culturale.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La Giornata cinese del turismo si celebra ogni anno il 19 maggio. Nell’aprile 2011, il Consiglio di Stato ha approvato ufficialmente la scelta del 19 maggio, a partire dal 2011, perché è il giorno in cui inizia il «Diario dei viaggi di Xu Xiake». Il testo iniziale, «Diario di un viaggio sul monte Tiantai», racconta: «L’ultimo giorno del terzo mese dell’anno Guichou (19 maggio 1613), uscii dalla porta occidentale di Ninghai; le nuvole si erano diradate e il sole splendeva, e sia le persone sia il paesaggio montano apparivano pieni di gioia». Questi soli 24 caratteri hanno lasciato ai posteri un prezioso patrimonio del turismo culturale.","chinese":"每年的5月19日。2011年4月，国务院正式批复同意自2011年起，将每年5月19日《徐霞客游记》的开篇日确定为“中国旅游日”。《徐霞客游记》开篇《游天台山记》记叙：“癸丑之三月晦（1613年5月19日），自宁海出西门，云散日朗，人意山光，俱有喜态。”开篇短短24个字，为后人留下了文化旅游的瑰宝。"}]},{"category":"综合知识","number":22,"question":"2026年四川省研学旅游推进大会在攀枝花召开。大会发布的“2026暑期十大‘微研学’主题场景”涵盖哪些领域？“微研学”与传统长线研学相比有何特点？","answer":"主题场景涵盖古蜀文明、红色记忆、工业探秘、非遗传承、生态教育、AI科创等领域。与传统长线研学相比，“微研学”以短时长、近距离、重体验为突出特点，让青少年在“小而精”的场景中获得沉浸式学习体验。","italian_answer":"I temi delle dieci principali esperienze di «micro-viaggio di studio» per l’estate 2026 comprendono la civiltà dell’antico Shu, la memoria rivoluzionaria, l’esplorazione industriale, la trasmissione del patrimonio culturale immateriale, l’educazione ecologica e la scienza e tecnologia basate sull’intelligenza artificiale. Rispetto ai tradizionali viaggi di studio di lunga durata, il «micro-viaggio di studio» si distingue per la breve durata, la vicinanza e l’importanza dell’esperienza. Offre ai giovani un apprendimento immersivo in contesti piccoli ma ben curati.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"I temi delle dieci principali esperienze di «micro-viaggio di studio» per l’estate 2026 comprendono la civiltà dell’antico Shu, la memoria rivoluzionaria, l’esplorazione industriale, la trasmissione del patrimonio culturale immateriale, l’educazione ecologica e la scienza e tecnologia basate sull’intelligenza artificiale. Rispetto ai tradizionali viaggi di studio di lunga durata, il «micro-viaggio di studio» si distingue per la breve durata, la vicinanza e l’importanza dell’esperienza. Offre ai giovani un apprendimento immersivo in contesti piccoli ma ben curati.","chinese":"主题场景涵盖古蜀文明、红色记忆、工业探秘、非遗传承、生态教育、AI科创等领域。与传统长线研学相比，“微研学”以短时长、近距离、重体验为突出特点，让青少年在“小而精”的场景中获得沉浸式学习体验。"}]},{"category":"综合知识","number":23,"question":"请介绍2026年四川旅游景区发展大会的基本概况。","answer":"2026年10月28日，以“体制改革赋能、景区提质焕新”为主题的2026四川省旅游景区发展大会在甘孜藏族自治州康定市举行。大会印发《四川省旅游景区强基焕新重点工作指引》，部署国有景区体制机制改革重点任务，推动全省旅游景区由规模扩张向提质增效转型，实现景区发展从 “量的积累” 向 “质的跃升” 转变。","italian_answer":"Il 28 ottobre 2026, con il tema «Riforma del sistema, rafforzamento delle basi e rinnovamento delle aree panoramiche», si è tenuta a Kangding, nella Prefettura autonoma tibetana di Garzê, la Conferenza 2026 sullo sviluppo delle aree panoramiche turistiche del Sichuan. Durante la conferenza è stata diffusa la «Guida ai principali lavori per rafforzare le basi e rinnovare le aree panoramiche turistiche del Sichuan». Sono stati definiti i compiti principali per la riforma del sistema e dei meccanismi delle aree panoramiche statali, con l’obiettivo di passare dall’espansione delle dimensioni al miglioramento della qualità e dell’efficienza, e da una crescita quantitativa a un salto di qualità.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il 28 ottobre 2026, con il tema «Riforma del sistema, rafforzamento delle basi e rinnovamento delle aree panoramiche», si è tenuta a Kangding, nella Prefettura autonoma tibetana di Garzê, la Conferenza 2026 sullo sviluppo delle aree panoramiche turistiche del Sichuan. Durante la conferenza è stata diffusa la «Guida ai principali lavori per rafforzare le basi e rinnovare le aree panoramiche turistiche del Sichuan». Sono stati definiti i compiti principali per la riforma del sistema e dei meccanismi delle aree panoramiche statali, con l’obiettivo di passare dall’espansione delle dimensioni al miglioramento della qualità e dell’efficienza, e da una crescita quantitativa a un salto di qualità.","chinese":"2026年10月28日，以“体制改革赋能、景区提质焕新”为主题的2026四川省旅游景区发展大会在甘孜藏族自治州康定市举行。大会印发《四川省旅游景区强基焕新重点工作指引》，部署国有景区体制机制改革重点任务，推动全省旅游景区由规模扩张向提质增效转型，实现景区发展从 “量的积累” 向 “质的跃升” 转变。"}]},{"category":"综合知识","number":24,"question":"简要介绍四川省巴蜀文化旅游走廊空间格局的主要构成内容。","answer":"根据四川省《巴蜀文化旅游走廊建设规划》实施方案，四川省在形成巴蜀文化旅游走廊空间格局中，应加快打造成都都市核，建设成绵乐世界遗产精品旅游带，共建成渝古道文化旅游带，共建长江上游生态文化旅游带，强化巴蜀文化旅游走廊对省内其他区域的辐射带动。","italian_answer":"Secondo il piano di attuazione del Sichuan per la costruzione del Corridoio turistico e culturale Bashu, la struttura territoriale comprende: accelerare la creazione del nucleo metropolitano di Chengdu; costruire un itinerario turistico di eccellenza dei patrimoni mondiali lungo Chengdu-Mianyang-Leshan; sviluppare congiuntamente l’itinerario culturale e turistico dell’antica strada Chengdu-Chongqing; sviluppare congiuntamente l’itinerario ecologico e culturale dell’alto corso del fiume Yangtze; rafforzare l’influenza e il sostegno del corridoio sulle altre aree della provincia.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Secondo il piano di attuazione del Sichuan per la costruzione del Corridoio turistico e culturale Bashu, la struttura territoriale comprende: accelerare la creazione del nucleo metropolitano di Chengdu; costruire un itinerario turistico di eccellenza dei patrimoni mondiali lungo Chengdu-Mianyang-Leshan; sviluppare congiuntamente l’itinerario culturale e turistico dell’antica strada Chengdu-Chongqing; sviluppare congiuntamente l’itinerario ecologico e culturale dell’alto corso del fiume Yangtze; rafforzare l’influenza e il sostegno del corridoio sulle altre aree della provincia.","chinese":"根据四川省《巴蜀文化旅游走廊建设规划》实施方案，四川省在形成巴蜀文化旅游走廊空间格局中，应加快打造成都都市核，建设成绵乐世界遗产精品旅游带，共建成渝古道文化旅游带，共建长江上游生态文化旅游带，强化巴蜀文化旅游走廊对省内其他区域的辐射带动。"}]},{"category":"综合知识","number":25,"question":"什么是历史文化名城？四川现有国家历史文化名城几座，它们分别是哪些？","answer":"《中华人民共和国文物保护法》规定：保存文物特别丰富并且具有重大历史价值或者革命纪念意义的城市，由国务院核定公布为历史文化名城。四川现有成都、宜宾、自贡、阆中、乐山、都江堰、泸州、会理、眉山共9座国家历史文化名城。","italian_answer":"Secondo la Legge della Repubblica Popolare Cinese sulla protezione dei beni culturali, una città che conserva un numero particolarmente elevato di beni culturali e possiede un importante valore storico o un significato commemorativo rivoluzionario può essere riconosciuta e annunciata dal Consiglio di Stato come città storica e culturale. Attualmente il Sichuan ha nove città storiche e culturali riconosciute a livello nazionale: Chengdu, Yibin, Zigong, Langzhong, Leshan, Dujiangyan, Luzhou, Huili e Meishan.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Secondo la Legge della Repubblica Popolare Cinese sulla protezione dei beni culturali, una città che conserva un numero particolarmente elevato di beni culturali e possiede un importante valore storico o un significato commemorativo rivoluzionario può essere riconosciuta e annunciata dal Consiglio di Stato come città storica e culturale. Attualmente il Sichuan ha nove città storiche e culturali riconosciute a livello nazionale: Chengdu, Yibin, Zigong, Langzhong, Leshan, Dujiangyan, Luzhou, Huili e Meishan.","chinese":"《中华人民共和国文物保护法》规定：保存文物特别丰富并且具有重大历史价值或者革命纪念意义的城市，由国务院核定公布为历史文化名城。四川现有成都、宜宾、自贡、阆中、乐山、都江堰、泸州、会理、眉山共9座国家历史文化名城。"}]},{"category":"综合知识","number":26,"question":"简要介绍“四川”得名及“四川省”建制的由来。","answer":"北宋真宗咸平四年（1001年），中央在蜀地设益州路、利州路、梓州路、夔州路，统称“川峡四路”，简称“四川路”。元灭宋后，实行行省制度，在原“川峡四路”的基础上设置“四川行中书省”，简称“四川省”。","italian_answer":"Nel quarto anno dell’era Xianping dell’imperatore Zhenzong della dinastia Song settentrionale, cioè nel 1001, il governo centrale istituì nella regione dello Shu quattro circuiti amministrativi: Yizhou, Lizhou, Zizhou e Kuizhou. Insieme erano chiamati «Quattro circuiti del Sichuan e delle Gole», abbreviato in «Circuito del Sichuan». Dopo la conquista della dinastia Song da parte degli Yuan, fu introdotto il sistema delle province. Sulla base dei quattro circuiti fu istituita la «Provincia di Sichuan», abbreviata in «Sichuan».","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Nel quarto anno dell’era Xianping dell’imperatore Zhenzong della dinastia Song settentrionale, cioè nel 1001, il governo centrale istituì nella regione dello Shu quattro circuiti amministrativi: Yizhou, Lizhou, Zizhou e Kuizhou. Insieme erano chiamati «Quattro circuiti del Sichuan e delle Gole», abbreviato in «Circuito del Sichuan». Dopo la conquista della dinastia Song da parte degli Yuan, fu introdotto il sistema delle province. Sulla base dei quattro circuiti fu istituita la «Provincia di Sichuan», abbreviata in «Sichuan».","chinese":"北宋真宗咸平四年（1001年），中央在蜀地设益州路、利州路、梓州路、夔州路，统称“川峡四路”，简称“四川路”。元灭宋后，实行行省制度，在原“川峡四路”的基础上设置“四川行中书省”，简称“四川省”。"}]},{"category":"综合知识","number":27,"question":"简要介绍“交子”。","answer":"交子是中国北宋时期在四川流通的纸币，是举世公认的世界上最早的纸币，是中国古代的一项伟大发明，交子诞生日以益州交子务设立的时间为准，即天圣元年十一月二十八日（公元1024年1月12日）。这一创举比西方国家早约600年，是人类货币史上的里程碑。","italian_answer":"Lo jiaozi era una banconota in circolazione nel Sichuan durante la dinastia Song settentrionale. È riconosciuto in tutto il mondo come la prima banconota della storia ed è una grande invenzione dell’antica Cina. La data di nascita dello jiaozi è quella dell’istituzione dell’Ufficio dello Jiaozi di Yizhou: il ventottesimo giorno dell’undicesimo mese del primo anno dell’era Tiansheng, cioè il 12 gennaio 1024. Questa innovazione precedette di circa 600 anni le iniziative dei Paesi occidentali e rappresentò una pietra miliare nella storia della moneta umana.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Lo jiaozi era una banconota in circolazione nel Sichuan durante la dinastia Song settentrionale. È riconosciuto in tutto il mondo come la prima banconota della storia ed è una grande invenzione dell’antica Cina. La data di nascita dello jiaozi è quella dell’istituzione dell’Ufficio dello Jiaozi di Yizhou: il ventottesimo giorno dell’undicesimo mese del primo anno dell’era Tiansheng, cioè il 12 gennaio 1024. Questa innovazione precedette di circa 600 anni le iniziative dei Paesi occidentali e rappresentò una pietra miliare nella storia della moneta umana.","chinese":"交子是中国北宋时期在四川流通的纸币，是举世公认的世界上最早的纸币，是中国古代的一项伟大发明，交子诞生日以益州交子务设立的时间为准，即天圣元年十一月二十八日（公元1024年1月12日）。这一创举比西方国家早约600年，是人类货币史上的里程碑。"}]},{"category":"综合知识","number":28,"question":"驷马桥的得名与成都历史上哪位名人有关？有何典故？","answer":"驷马桥距成都旧城北门约三千余米,古名升仙桥,又曾名清远桥。现在桥名的由来与西汉大才子司马相如有关。《华阳国志》载:司马相如初入长安，行经此桥，题其门曰“不乘赤车驷马，不过汝下”。故事流传千年，为蜀中父老乐道，因此在南宋时此桥改名为驷马桥，沿用至今。","italian_answer":"Il ponte Simǎ, a poco più di tre chilometri dalla porta settentrionale della vecchia città di Chengdu, era anticamente chiamato Ponte Shengxian e in seguito anche Ponte Qingyuan. Il nome attuale è legato al grande letterato della dinastia Han occidentale Sima Xiangru. Secondo la «Cronaca dello Huayang», quando Sima Xiangru partì per la capitale Chang’an, passando sul ponte scrisse sulla sua porta: «Se non tornerò con una carrozza rossa trainata da quattro cavalli, non passerò mai più sotto questo ponte». La storia è stata tramandata per mille anni e, durante la dinastia Song meridionale, il ponte fu rinominato Simǎ Qiao, nome che conserva ancora oggi.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il ponte Simǎ, a poco più di tre chilometri dalla porta settentrionale della vecchia città di Chengdu, era anticamente chiamato Ponte Shengxian e in seguito anche Ponte Qingyuan. Il nome attuale è legato al grande letterato della dinastia Han occidentale Sima Xiangru. Secondo la «Cronaca dello Huayang», quando Sima Xiangru partì per la capitale Chang’an, passando sul ponte scrisse sulla sua porta: «Se non tornerò con una carrozza rossa trainata da quattro cavalli, non passerò mai più sotto questo ponte». La storia è stata tramandata per mille anni e, durante la dinastia Song meridionale, il ponte fu rinominato Simǎ Qiao, nome che conserva ancora oggi.","chinese":"驷马桥距成都旧城北门约三千余米,古名升仙桥,又曾名清远桥。现在桥名的由来与西汉大才子司马相如有关。《华阳国志》载:司马相如初入长安，行经此桥，题其门曰“不乘赤车驷马，不过汝下”。故事流传千年，为蜀中父老乐道，因此在南宋时此桥改名为驷马桥，沿用至今。"}]},{"category":"综合知识","number":29,"question":"成都在历史上有几个偏安一隅的地方政权（列举不少于5个）？","answer":"成都先后建立过七个偏安一隅的地方性政权。按年代顺序为：公孙述在西汉末年建立的“大成”政权，刘备在东汉末年建立的“蜀汉”政权，李雄在西晋末年建立的“成汉”政权，王建在五代十国时建立的“前蜀”政权，孟知祥在五代十国时建立的“后蜀”政权，李顺在北宋初年建立的“大蜀”农民政权，张献忠在明朝末年建立的“大西”政权。","italian_answer":"Nel corso della storia, a Chengdu furono fondati sette regimi locali indipendenti dal potere centrale. In ordine cronologico: il regime «Dacheng», fondato da Gongsun Shu alla fine della dinastia Han occidentale; il «Regno Shu Han», fondato da Liu Bei alla fine della dinastia Han orientale; il «Cheng Han», fondato da Li Xiong alla fine della dinastia Jin occidentale; il «Primo Shu», fondato da Wang Jian durante il periodo delle Cinque Dinastie e Dieci Regni; il «Secondo Shu», fondato da Meng Zhixiang nello stesso periodo; il regime contadino «Dashu», fondato da Li Shun all’inizio della dinastia Song settentrionale; e il regime «Daxi», fondato da Zhang Xianzhong alla fine della dinastia Ming.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Nel corso della storia, a Chengdu furono fondati sette regimi locali indipendenti dal potere centrale. In ordine cronologico: il regime «Dacheng», fondato da Gongsun Shu alla fine della dinastia Han occidentale; il «Regno Shu Han», fondato da Liu Bei alla fine della dinastia Han orientale; il «Cheng Han», fondato da Li Xiong alla fine della dinastia Jin occidentale; il «Primo Shu», fondato da Wang Jian durante il periodo delle Cinque Dinastie e Dieci Regni; il «Secondo Shu», fondato da Meng Zhixiang nello stesso periodo; il regime contadino «Dashu», fondato da Li Shun all’inizio della dinastia Song settentrionale; e il regime «Daxi», fondato da Zhang Xianzhong alla fine della dinastia Ming.","chinese":"成都先后建立过七个偏安一隅的地方性政权。按年代顺序为：公孙述在西汉末年建立的“大成”政权，刘备在东汉末年建立的“蜀汉”政权，李雄在西晋末年建立的“成汉”政权，王建在五代十国时建立的“前蜀”政权，孟知祥在五代十国时建立的“后蜀”政权，李顺在北宋初年建立的“大蜀”农民政权，张献忠在明朝末年建立的“大西”政权。"}]},{"category":"综合知识","number":30,"question":"成都“宽巷子”地名由何而来？","answer":"作为西部重镇，清代在成都设立满城，是出于平定准噶尔之乱后稳定西南边疆的军事需要，同时推行旗汉分治政策，在此修建八旗官兵及家眷的专属驻地。宽巷子前身即为满城中镶红旗驻地“兴仁胡同”。民国时期，“胡同”改称“巷子”，因其较相邻的“太平胡同”更宽，故更名为“宽巷子”。","italian_answer":"Essendo un importante centro militare della Cina occidentale, durante la dinastia Qing Chengdu ospitò una città riservata ai Manciù. La sua costruzione rispondeva all’esigenza militare di stabilizzare la frontiera sud-occidentale dopo la repressione della rivolta degli Zunghar e alla politica di separazione tra Manciù e Han. Era la residenza esclusiva degli ufficiali e delle famiglie degli Otto Stendardi. L’attuale Kuan Xiangzi era in origine il vicolo Xingren, residenza dello Stendardo Rosso Bordato. Durante il periodo della Repubblica di Cina, il termine «hutong» fu sostituito da «xiangzi»; poiché era più largo del vicino vicolo Taiping, fu chiamato Kuan Xiangzi, cioè «Vicolo Largo».","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Essendo un importante centro militare della Cina occidentale, durante la dinastia Qing Chengdu ospitò una città riservata ai Manciù. La sua costruzione rispondeva all’esigenza militare di stabilizzare la frontiera sud-occidentale dopo la repressione della rivolta degli Zunghar e alla politica di separazione tra Manciù e Han. Era la residenza esclusiva degli ufficiali e delle famiglie degli Otto Stendardi. L’attuale Kuan Xiangzi era in origine il vicolo Xingren, residenza dello Stendardo Rosso Bordato. Durante il periodo della Repubblica di Cina, il termine «hutong» fu sostituito da «xiangzi»; poiché era più largo del vicino vicolo Taiping, fu chiamato Kuan Xiangzi, cioè «Vicolo Largo».","chinese":"作为西部重镇，清代在成都设立满城，是出于平定准噶尔之乱后稳定西南边疆的军事需要，同时推行旗汉分治政策，在此修建八旗官兵及家眷的专属驻地。宽巷子前身即为满城中镶红旗驻地“兴仁胡同”。民国时期，“胡同”改称“巷子”，因其较相邻的“太平胡同”更宽，故更名为“宽巷子”。"}]},{"category":"综合知识","number":31,"question":"简要介绍成都天府国际机场的概况。","answer":"成都天府国际机场位于四川省成都简阳市芦葭镇，北距成都市中心50千米，西北距成都双流国际机场50千米，为4F级国际机场、国际航空枢纽、丝绸之路经济带中等级最高的航空港之一、成都国际航空枢纽的主枢纽。","italian_answer":"L’aeroporto internazionale di Chengdu Tianfu si trova nel villaggio di Lucià, nella città di Jianyang, a Chengdu, nel Sichuan. Dista 50 chilometri a nord dal centro di Chengdu e 50 chilometri a nord-ovest dall’aeroporto internazionale di Chengdu Shuangliu. È un aeroporto internazionale di classe 4F, un hub dell’aviazione internazionale e uno degli aeroporti di livello più alto della Via della Seta economica. È anche il principale hub del sistema aeroportuale internazionale di Chengdu.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’aeroporto internazionale di Chengdu Tianfu si trova nel villaggio di Lucià, nella città di Jianyang, a Chengdu, nel Sichuan. Dista 50 chilometri a nord dal centro di Chengdu e 50 chilometri a nord-ovest dall’aeroporto internazionale di Chengdu Shuangliu. È un aeroporto internazionale di classe 4F, un hub dell’aviazione internazionale e uno degli aeroporti di livello più alto della Via della Seta economica. È anche il principale hub del sistema aeroportuale internazionale di Chengdu.","chinese":"成都天府国际机场位于四川省成都简阳市芦葭镇，北距成都市中心50千米，西北距成都双流国际机场50千米，为4F级国际机场、国际航空枢纽、丝绸之路经济带中等级最高的航空港之一、成都国际航空枢纽的主枢纽。"}]},{"category":"综合知识","number":32,"question":"“天府之国”中的“天府”有何寓意？历史上，谁第一次将四川称为“天府”？","answer":"“天府”原为周朝时的官职名称，是掌管周天子府库珍宝的官员。后人用来借喻自然条件优越、地势险要、物产丰富的地方。历史上第一次将四川与“天府”一词相提并论的人是三国时期的一代贤相诸葛亮。","italian_answer":"In origine, «Tianfu» era il nome di una carica ufficiale durante la dinastia Zhou: indicava il funzionario responsabile del tesoro e dei preziosi del sovrano. In seguito, il termine è stato usato per descrivere un luogo con condizioni naturali eccellenti, posizione strategica e prodotti abbondanti. La prima persona nella storia ad associare il Sichuan al termine «Tianfu» fu Zhuge Liang, famoso primo ministro del periodo dei Tre Regni.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"In origine, «Tianfu» era il nome di una carica ufficiale durante la dinastia Zhou: indicava il funzionario responsabile del tesoro e dei preziosi del sovrano. In seguito, il termine è stato usato per descrivere un luogo con condizioni naturali eccellenti, posizione strategica e prodotti abbondanti. La prima persona nella storia ad associare il Sichuan al termine «Tianfu» fu Zhuge Liang, famoso primo ministro del periodo dei Tre Regni.","chinese":"“天府”原为周朝时的官职名称，是掌管周天子府库珍宝的官员。后人用来借喻自然条件优越、地势险要、物产丰富的地方。历史上第一次将四川与“天府”一词相提并论的人是三国时期的一代贤相诸葛亮。"}]},{"category":"综合知识","number":33,"question":"简要介绍《华阳国志》。","answer":"《华阳国志》是中国现存最早、最完整的地方志书，有“方志之祖”之誉。作者是东晋时期四川崇州人常璩。《华阳国志》全书12卷，11万余字，记载从远古至东晋时期西南地区的史事。","italian_answer":"La «Cronaca dello Huayang» è la più antica e completa opera di storia locale conservata in Cina ed è conosciuta come «l’antenata delle gazzette locali». Il suo autore è Chang Qu, originario di Chongzhou, nel Sichuan, vissuto durante la dinastia Jin orientale. L’opera è composta da 12 volumi e contiene oltre 110.000 caratteri; racconta la storia delle regioni sud-occidentali dalla preistoria fino alla dinastia Jin orientale.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La «Cronaca dello Huayang» è la più antica e completa opera di storia locale conservata in Cina ed è conosciuta come «l’antenata delle gazzette locali». Il suo autore è Chang Qu, originario di Chongzhou, nel Sichuan, vissuto durante la dinastia Jin orientale. L’opera è composta da 12 volumi e contiene oltre 110.000 caratteri; racconta la storia delle regioni sud-occidentali dalla preistoria fino alla dinastia Jin orientale.","chinese":"《华阳国志》是中国现存最早、最完整的地方志书，有“方志之祖”之誉。作者是东晋时期四川崇州人常璩。《华阳国志》全书12卷，11万余字，记载从远古至东晋时期西南地区的史事。"}]},{"category":"综合知识","number":34,"question":"南充陈寿纪念馆正门有“并迁双固”匾，这四个字有什么含义？","answer":"“迁”是指司马迁，“固”是指班固。前者是纪传体通史《史记》的作者，后者是断代史《汉书》的作者。匾额的意思是陈寿在历史学上取得的成就可以和司马迁、班固相媲美。","italian_answer":"Nella targa «Bing Qian Shuang Gu», posta all’ingresso del Memoriale di Chen Shou a Nanchong, «Qian» si riferisce a Sima Qian e «Gu» a Ban Gu. Il primo è l’autore delle «Memorie di uno storico», una storia generale in forma biografica; il secondo è l’autore del «Libro degli Han», una storia dinastica. La targa significa che i risultati di Chen Shou nel campo della storiografia possono essere paragonati a quelli di Sima Qian e Ban Gu.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Nella targa «Bing Qian Shuang Gu», posta all’ingresso del Memoriale di Chen Shou a Nanchong, «Qian» si riferisce a Sima Qian e «Gu» a Ban Gu. Il primo è l’autore delle «Memorie di uno storico», una storia generale in forma biografica; il secondo è l’autore del «Libro degli Han», una storia dinastica. La targa significa che i risultati di Chen Shou nel campo della storiografia possono essere paragonati a quelli di Sima Qian e Ban Gu.","chinese":"“迁”是指司马迁，“固”是指班固。前者是纪传体通史《史记》的作者，后者是断代史《汉书》的作者。匾额的意思是陈寿在历史学上取得的成就可以和司马迁、班固相媲美。"}]},{"category":"综合知识","number":35,"question":"被李白、杜甫所推崇的“天下文宗”是谁？他的代表作是什么？","answer":"“天下文宗”是指被李白、杜甫所推崇的四川射洪人陈子昂。他的代表作是《登幽州台歌》：“前不见古人，后不见来者。念天地之悠悠，独怆然而涕下。”诗文采用了长短交错的楚辞体句法，意境雄浑，极具“汉魏风骨”。","italian_answer":"Il titolo di «grande maestro della letteratura» si riferisce a Chen Zi’ang, originario di Shehong, nel Sichuan, apprezzato da Li Bai e Du Fu. La sua opera più rappresentativa è «Canto della Torre di Youzhou»: «Davanti a me non vedo gli uomini del passato, dietro di me non vedo quelli del futuro. Pensando all’immensità del cielo e della terra, mi sento solo e scoppio in lacrime». La poesia utilizza la struttura dei versi del genere Chu Ci, con versi di lunghezza diversa, e presenta un’atmosfera solenne e uno stile vigoroso, caratteristico della letteratura Han e Wei.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il titolo di «grande maestro della letteratura» si riferisce a Chen Zi’ang, originario di Shehong, nel Sichuan, apprezzato da Li Bai e Du Fu. La sua opera più rappresentativa è «Canto della Torre di Youzhou»: «Davanti a me non vedo gli uomini del passato, dietro di me non vedo quelli del futuro. Pensando all’immensità del cielo e della terra, mi sento solo e scoppio in lacrime». La poesia utilizza la struttura dei versi del genere Chu Ci, con versi di lunghezza diversa, e presenta un’atmosfera solenne e uno stile vigoroso, caratteristico della letteratura Han e Wei.","chinese":"“天下文宗”是指被李白、杜甫所推崇的四川射洪人陈子昂。他的代表作是《登幽州台歌》：“前不见古人，后不见来者。念天地之悠悠，独怆然而涕下。”诗文采用了长短交错的楚辞体句法，意境雄浑，极具“汉魏风骨”。"}]},{"category":"综合知识","number":36,"question":"简要介绍唐代“扬一益二”的说法。","answer":"“扬”是指扬州，“益”是指成都。“扬一益二”说明，在唐代中晚期，扬州、成都以商业繁盛、富庶丰饶成为天下数一数二的名都会。成都作为内陆腹地城市，当时已成为中国仅次于扬州的第二大繁华之地。“扬一益二”主要是从商业贸易角度对当时扬州、成都的一种民间评价，而不是对两座城市的综合性评判。","italian_answer":"«Yang uno, Yi due» si riferisce a Yangzhou e Chengdu. L’espressione indica che, nella parte centrale e finale della dinastia Tang, Yangzhou e Chengdu erano tra le città più famose e prospere del Paese, grazie al commercio fiorente e alla ricchezza. Chengdu, pur trovandosi nell’entroterra, era diventata la seconda città più prospera della Cina dopo Yangzhou. Questa espressione è soprattutto una valutazione popolare delle due città dal punto di vista del commercio, non un giudizio complessivo su tutti gli aspetti.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"«Yang uno, Yi due» si riferisce a Yangzhou e Chengdu. L’espressione indica che, nella parte centrale e finale della dinastia Tang, Yangzhou e Chengdu erano tra le città più famose e prospere del Paese, grazie al commercio fiorente e alla ricchezza. Chengdu, pur trovandosi nell’entroterra, era diventata la seconda città più prospera della Cina dopo Yangzhou. Questa espressione è soprattutto una valutazione popolare delle due città dal punto di vista del commercio, non un giudizio complessivo su tutti gli aspetti.","chinese":"“扬”是指扬州，“益”是指成都。“扬一益二”说明，在唐代中晚期，扬州、成都以商业繁盛、富庶丰饶成为天下数一数二的名都会。成都作为内陆腹地城市，当时已成为中国仅次于扬州的第二大繁华之地。“扬一益二”主要是从商业贸易角度对当时扬州、成都的一种民间评价，而不是对两座城市的综合性评判。"}]},{"category":"综合知识","number":37,"question":"安仁古镇是四川重要的文旅地标，简述其核心景区特色。","answer":"安仁古镇位于成都市大邑县，是国家5A级旅游景区、中国历史文化名镇。其特色主要为：刘氏庄园为代表的川西近代庄园建筑群，建川博物馆聚落，以及中西合璧的公馆老街。古镇以“文博、文旅、文创”三文融合为发展模式，是四川古镇文化旅游的重要代表。","italian_answer":"La città antica di Anren si trova nella contea di Dayi, a Chengdu. È un’attrazione turistica nazionale di livello 5A e una città storica e culturale della Cina. Le sue caratteristiche principali sono il complesso di residenze signorili moderne del Sichuan occidentale, rappresentato dal Maniero della famiglia Liu; il complesso dei musei Jianchuan; e la vecchia strada delle residenze, che unisce elementi architettonici cinesi e occidentali. La città sviluppa un modello che integra musei, turismo e creatività culturale, ed è un importante esempio di turismo culturale nelle antiche città del Sichuan.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La città antica di Anren si trova nella contea di Dayi, a Chengdu. È un’attrazione turistica nazionale di livello 5A e una città storica e culturale della Cina. Le sue caratteristiche principali sono il complesso di residenze signorili moderne del Sichuan occidentale, rappresentato dal Maniero della famiglia Liu; il complesso dei musei Jianchuan; e la vecchia strada delle residenze, che unisce elementi architettonici cinesi e occidentali. La città sviluppa un modello che integra musei, turismo e creatività culturale, ed è un importante esempio di turismo culturale nelle antiche città del Sichuan.","chinese":"安仁古镇位于成都市大邑县，是国家5A级旅游景区、中国历史文化名镇。其特色主要为：刘氏庄园为代表的川西近代庄园建筑群，建川博物馆聚落，以及中西合璧的公馆老街。古镇以“文博、文旅、文创”三文融合为发展模式，是四川古镇文化旅游的重要代表。"}]},{"category":"综合知识","number":38,"question":"2025年，联合国旅游组织公布了2025年“最佳旅游乡村”名单，我国有几个乡村入选，并简要介绍。","answer":"4个，分别是：保存着世界上最完整的“桑基鱼塘系统”，孕育了中国蚕桑丝织技艺的浙江荻港村；嘉绒东女文化重要发源地，将川西高原民族文化与生态旅游融合的四川基卡依村；坐落于水上森林与千垛菜花景区之间，身处世界灌溉工程遗产——兴化垛田核心区域的江苏东罗村；侗族古老“稻鱼鸭”生物工程农耕文化保留地，至今保存和延续着上千年的侗族传统生产生活习俗的贵州黄岗村。","italian_answer":"Quattro villaggi cinesi sono stati selezionati. Sono: il villaggio di Digang, nello Zhejiang, che conserva il sistema di stagni di gelsi e pesci più completo al mondo e ha dato origine all’arte cinese della sericoltura e della tessitura della seta; il villaggio di Jikayi, nel Sichuan, importante luogo d’origine della cultura delle donne Jiarong Dong, che integra la cultura etnica dell’altopiano del Sichuan occidentale con il turismo ecologico; il villaggio di Dongluo, nel Jiangsu, situato tra foreste acquatiche e campi di colza a terrazze, nel cuore dell’area di Xinghua Duotian, patrimonio mondiale dell’irrigazione; e il villaggio di Huanggang, nel Guizhou, dove si conserva l’antica cultura agricola dong del sistema «riso-pesce-anatra» e continuano tradizioni di vita e produzione tramandate da oltre mille anni.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Quattro villaggi cinesi sono stati selezionati. Sono: il villaggio di Digang, nello Zhejiang, che conserva il sistema di stagni di gelsi e pesci più completo al mondo e ha dato origine all’arte cinese della sericoltura e della tessitura della seta; il villaggio di Jikayi, nel Sichuan, importante luogo d’origine della cultura delle donne Jiarong Dong, che integra la cultura etnica dell’altopiano del Sichuan occidentale con il turismo ecologico; il villaggio di Dongluo, nel Jiangsu, situato tra foreste acquatiche e campi di colza a terrazze, nel cuore dell’area di Xinghua Duotian, patrimonio mondiale dell’irrigazione; e il villaggio di Huanggang, nel Guizhou, dove si conserva l’antica cultura agricola dong del sistema «riso-pesce-anatra» e continuano tradizioni di vita e produzione tramandate da oltre mille anni.","chinese":"4个，分别是：保存着世界上最完整的“桑基鱼塘系统”，孕育了中国蚕桑丝织技艺的浙江荻港村；嘉绒东女文化重要发源地，将川西高原民族文化与生态旅游融合的四川基卡依村；坐落于水上森林与千垛菜花景区之间，身处世界灌溉工程遗产——兴化垛田核心区域的江苏东罗村；侗族古老“稻鱼鸭”生物工程农耕文化保留地，至今保存和延续着上千年的侗族传统生产生活习俗的贵州黄岗村。"}]},{"category":"综合知识","number":39,"question":"《“四个跟着游四川”实施方案》是由哪些部门联合制定的？“四个跟着”具体指什么？","answer":"2025年8月，四川省文化和旅游厅、省商务厅、省体育局、省广播电视局联合制定《“四个跟着游四川”实施方案》。“四个跟着”分别是“跟着赛事游四川”“跟着演出游四川”“跟着美食游四川”“跟着影视游四川”。","italian_answer":"Nell’agosto 2025, il Dipartimento della Cultura e del Turismo del Sichuan, il Dipartimento del Commercio, l’Ufficio provinciale dello Sport e l’Ufficio provinciale della Radio e Televisione hanno elaborato congiuntamente il «Piano di attuazione dei quattro modi per viaggiare nel Sichuan». I quattro modi sono: viaggiare nel Sichuan seguendo gli eventi sportivi, gli spettacoli, la gastronomia e le produzioni cinematografiche e televisive.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Nell’agosto 2025, il Dipartimento della Cultura e del Turismo del Sichuan, il Dipartimento del Commercio, l’Ufficio provinciale dello Sport e l’Ufficio provinciale della Radio e Televisione hanno elaborato congiuntamente il «Piano di attuazione dei quattro modi per viaggiare nel Sichuan». I quattro modi sono: viaggiare nel Sichuan seguendo gli eventi sportivi, gli spettacoli, la gastronomia e le produzioni cinematografiche e televisive.","chinese":"2025年8月，四川省文化和旅游厅、省商务厅、省体育局、省广播电视局联合制定《“四个跟着游四川”实施方案》。“四个跟着”分别是“跟着赛事游四川”“跟着演出游四川”“跟着美食游四川”“跟着影视游四川”。"}]},{"category":"综合知识","number":40,"question":"都江堰放水节是四川重要的传统节庆活动，请简述其由来及文化内涵。","answer":"都江堰放水节源于古蜀先民“祀水”习俗，北宋太平兴国三年（978年）正式定为“都江堰放水节”。每年清明，通过砍杩槎、放水入渠等仪式，纪念李冰父子修建都江堰的功绩，祈求五谷丰登。该节庆体现了“道法自然、天人合一”的治水智慧，于2006年被列入第一批国家级非物质文化遗产名录。","italian_answer":"La Festa dell’apertura delle acque di Dujiangyan deriva dall’antica usanza degli abitanti dello Shu di offrire sacrifici all’acqua. Nel terzo anno dell’era Taiping Xingguo della dinastia Song settentrionale, cioè nel 978, fu ufficialmente istituita come festa. Ogni anno, durante la Festa di Qingming, si svolgono cerimonie come il taglio delle barriere di bambù e l’apertura dell’acqua nei canali, per commemorare Li Bing e suo figlio, che costruirono Dujiangyan, e pregare per un buon raccolto. La festa esprime la saggezza idraulica del «seguire la natura» e dell’«armonia tra uomo e natura». Nel 2006 è stata inserita nel primo elenco nazionale del patrimonio culturale immateriale.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La Festa dell’apertura delle acque di Dujiangyan deriva dall’antica usanza degli abitanti dello Shu di offrire sacrifici all’acqua. Nel terzo anno dell’era Taiping Xingguo della dinastia Song settentrionale, cioè nel 978, fu ufficialmente istituita come festa. Ogni anno, durante la Festa di Qingming, si svolgono cerimonie come il taglio delle barriere di bambù e l’apertura dell’acqua nei canali, per commemorare Li Bing e suo figlio, che costruirono Dujiangyan, e pregare per un buon raccolto. La festa esprime la saggezza idraulica del «seguire la natura» e dell’«armonia tra uomo e natura». Nel 2006 è stata inserita nel primo elenco nazionale del patrimonio culturale immateriale.","chinese":"都江堰放水节源于古蜀先民“祀水”习俗，北宋太平兴国三年（978年）正式定为“都江堰放水节”。每年清明，通过砍杩槎、放水入渠等仪式，纪念李冰父子修建都江堰的功绩，祈求五谷丰登。该节庆体现了“道法自然、天人合一”的治水智慧，于2006年被列入第一批国家级非物质文化遗产名录。"}]},{"category":"综合知识","number":41,"question":"如何正确看待民谚“少不入川”？","answer":"“少不入川”旧指天府之国有好山好水，是富庶温柔之乡。年轻人当胸怀天下，建功立业，若早年入川，意志不坚定者难免流连忘返、乐不思归。事实上，四川人生活、工作两不误，慢中有快，是生命本真状态和豁达闲适的自由表达。","italian_answer":"Come interpretare correttamente il proverbio «I giovani non dovrebbero andare nel Sichuan»? In passato, l’espressione indicava che il Sichuan, la Terra dell’Abbondanza, offriva paesaggi splendidi e una vita agiata e piacevole. I giovani dovrebbero avere ambizioni, guardare al mondo e costruire la propria carriera; se arrivano nel Sichuan troppo presto, chi non ha una volontà forte può lasciarsi sedurre da una vita comoda e non voler più partire. In realtà, gli abitanti del Sichuan riescono a conciliare vita e lavoro: il loro ritmo è tranquillo ma anche dinamico, ed esprime un modo di vivere autentico, libero e sereno.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Come interpretare correttamente il proverbio «I giovani non dovrebbero andare nel Sichuan»? In passato, l’espressione indicava che il Sichuan, la Terra dell’Abbondanza, offriva paesaggi splendidi e una vita agiata e piacevole. I giovani dovrebbero avere ambizioni, guardare al mondo e costruire la propria carriera; se arrivano nel Sichuan troppo presto, chi non ha una volontà forte può lasciarsi sedurre da una vita comoda e non voler più partire. In realtà, gli abitanti del Sichuan riescono a conciliare vita e lavoro: il loro ritmo è tranquillo ma anche dinamico, ed esprime un modo di vivere autentico, libero e sereno.","chinese":"“少不入川”旧指天府之国有好山好水，是富庶温柔之乡。年轻人当胸怀天下，建功立业，若早年入川，意志不坚定者难免流连忘返、乐不思归。事实上，四川人生活、工作两不误，慢中有快，是生命本真状态和豁达闲适的自由表达。"}]},{"category":"综合知识","number":42,"question":"简要介绍“川江号子”。","answer":"川江号子是川江船工们为统一动作和节奏，由号工领唱,众船工帮腔、合唱的一种一领众和式民间歌唱形式。重庆市和四川东部是川江号子的主要发源地和传承地。2006年，川江号子被列入第一批国家级非物质文化遗产名录。","italian_answer":"Il «Canto dei barcaioli del fiume Chuan» è una forma di canto popolare usata dai barcaioli per coordinare i movimenti e il ritmo del lavoro. Un cantore guida intona il canto e gli altri barcaioli rispondono e cantano insieme. Chongqing e la parte orientale del Sichuan sono le principali zone d’origine e di trasmissione di questa tradizione. Nel 2006 il canto è stato inserito nel primo elenco nazionale del patrimonio culturale immateriale.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il «Canto dei barcaioli del fiume Chuan» è una forma di canto popolare usata dai barcaioli per coordinare i movimenti e il ritmo del lavoro. Un cantore guida intona il canto e gli altri barcaioli rispondono e cantano insieme. Chongqing e la parte orientale del Sichuan sono le principali zone d’origine e di trasmissione di questa tradizione. Nel 2006 il canto è stato inserito nel primo elenco nazionale del patrimonio culturale immateriale.","chinese":"川江号子是川江船工们为统一动作和节奏，由号工领唱,众船工帮腔、合唱的一种一领众和式民间歌唱形式。重庆市和四川东部是川江号子的主要发源地和传承地。2006年，川江号子被列入第一批国家级非物质文化遗产名录。"}]},{"category":"综合知识","number":43,"question":"简要介绍“泸顺起义”。","answer":"1926年12月1日，为配合北伐战争的胜利进军，中国共产党重庆地方执行委员会在四川的泸州、顺庆（今南充）地区独立领导和策动部分四川军阀部队举行了一次大规模的武装起义——泸顺起义，在中共党史上被誉为“是八一南昌起义的先声，是中国共产党人独立领导武装起义的尝试”。","italian_answer":"Il 1° dicembre 1926, per sostenere l’avanzata vittoriosa della Spedizione del Nord, il Comitato esecutivo locale di Chongqing del Partito Comunista Cinese guidò e organizzò in modo indipendente una grande insurrezione armata di alcune unità militari dei signori della guerra del Sichuan nelle zone di Luzhou e Shunqing, oggi Nanchong. L’evento è chiamato «Insurrezione di Lu-Sun» ed è considerato nella storia del Partito Comunista Cinese un precursore dell’Insurrezione di Nanchang del 1° agosto e un tentativo di insurrezione armata guidata autonomamente dai comunisti cinesi.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il 1° dicembre 1926, per sostenere l’avanzata vittoriosa della Spedizione del Nord, il Comitato esecutivo locale di Chongqing del Partito Comunista Cinese guidò e organizzò in modo indipendente una grande insurrezione armata di alcune unità militari dei signori della guerra del Sichuan nelle zone di Luzhou e Shunqing, oggi Nanchong. L’evento è chiamato «Insurrezione di Lu-Sun» ed è considerato nella storia del Partito Comunista Cinese un precursore dell’Insurrezione di Nanchang del 1° agosto e un tentativo di insurrezione armata guidata autonomamente dai comunisti cinesi.","chinese":"1926年12月1日，为配合北伐战争的胜利进军，中国共产党重庆地方执行委员会在四川的泸州、顺庆（今南充）地区独立领导和策动部分四川军阀部队举行了一次大规模的武装起义——泸顺起义，在中共党史上被誉为“是八一南昌起义的先声，是中国共产党人独立领导武装起义的尝试”。"}]},{"category":"综合知识","number":44,"question":"简要介绍红军长征在四川的情况。","answer":"红军长征行程二万五千里，其中一万五千里在四川，历时一年零八个月，途经近70个县，是经过的14个省中，自然环境最险恶、敌我战斗最惨烈、党内斗争最激烈的省份，留下了四渡赤水河、巧渡金沙江、强渡大渡河、飞夺泸定桥、翻越夹金山、穿越大草地等辉煌诗篇。","italian_answer":"Durante la Lunga Marcia, l’Armata Rossa percorse 25.000 li, di cui 15.000 nel Sichuan. Rimase nella provincia per un anno e otto mesi e attraversò quasi 70 contee. Tra le 14 province attraversate, il Sichuan fu quella con l’ambiente naturale più difficile, i combattimenti più aspri tra le forze nemiche e le lotte interne al Partito più intense. Qui si svolsero episodi memorabili, come i quattro attraversamenti del fiume Chishui, l’attraversamento a sorpresa del fiume Jinsha, il passaggio forzato del fiume Dadu, la conquista del ponte di Luding, il superamento del monte Jiajin e l’attraversamento delle grandi praterie paludose.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Durante la Lunga Marcia, l’Armata Rossa percorse 25.000 li, di cui 15.000 nel Sichuan. Rimase nella provincia per un anno e otto mesi e attraversò quasi 70 contee. Tra le 14 province attraversate, il Sichuan fu quella con l’ambiente naturale più difficile, i combattimenti più aspri tra le forze nemiche e le lotte interne al Partito più intense. Qui si svolsero episodi memorabili, come i quattro attraversamenti del fiume Chishui, l’attraversamento a sorpresa del fiume Jinsha, il passaggio forzato del fiume Dadu, la conquista del ponte di Luding, il superamento del monte Jiajin e l’attraversamento delle grandi praterie paludose.","chinese":"红军长征行程二万五千里，其中一万五千里在四川，历时一年零八个月，途经近70个县，是经过的14个省中，自然环境最险恶、敌我战斗最惨烈、党内斗争最激烈的省份，留下了四渡赤水河、巧渡金沙江、强渡大渡河、飞夺泸定桥、翻越夹金山、穿越大草地等辉煌诗篇。"}]},{"category":"综合知识","number":45,"question":"简要介绍四川保路运动。","answer":"保路运动也称作“铁路风潮”，是人民反对清政府将铁路出卖给帝国主义的群众运动。其中所说的路，指的是广州到武昌的粤汉铁路、成都到汉口的川汉铁路。孙中山评价说，若没有四川保路同志会的起义，武昌革命或者要迟一年半载的。","italian_answer":"Il Movimento per la protezione delle ferrovie, chiamato anche «crisi ferroviaria», fu un movimento popolare contro la decisione del governo Qing di cedere le ferrovie alle potenze imperialiste. Le linee in questione erano la ferrovia Yuehan, da Guangzhou a Wuchang, e la ferrovia Chuanhan, da Chengdu a Hankou. Sun Yat-sen affermò che, senza la rivolta del movimento per la protezione delle ferrovie nel Sichuan, la Rivoluzione di Wuchang sarebbe forse stata ritardata di un anno o un anno e mezzo.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il Movimento per la protezione delle ferrovie, chiamato anche «crisi ferroviaria», fu un movimento popolare contro la decisione del governo Qing di cedere le ferrovie alle potenze imperialiste. Le linee in questione erano la ferrovia Yuehan, da Guangzhou a Wuchang, e la ferrovia Chuanhan, da Chengdu a Hankou. Sun Yat-sen affermò che, senza la rivolta del movimento per la protezione delle ferrovie nel Sichuan, la Rivoluzione di Wuchang sarebbe forse stata ritardata di un anno o un anno e mezzo.","chinese":"保路运动也称作“铁路风潮”，是人民反对清政府将铁路出卖给帝国主义的群众运动。其中所说的路，指的是广州到武昌的粤汉铁路、成都到汉口的川汉铁路。孙中山评价说，若没有四川保路同志会的起义，武昌革命或者要迟一年半载的。"}]},{"category":"综合知识","number":46,"question":"简要介绍翠云廊。","answer":"翠云廊是古蜀道剑门蜀道的一段。古称剑州路柏，民间又称“皇柏”“张飞柏”。古道两旁古柏参天，蜿蜒三百里，号称“三百里程十万树”。翠云廊古柏始于秦汉、完备于明，是罕见的人工造植古老行道树群体，被誉为“蜀道灵魂”“国之珍宝”。","italian_answer":"Il Corridoio Cuiyun è una sezione dell’antica Via Shu, parte dell’antica strada di Jianmen. In passato era chiamato «Via Jianzhou con cipressi» e, tra la gente, anche «Cipressi imperiali» o «Cipressi di Zhang Fei». Lungo l’antica strada crescono cipressi secolari, che si snodano per 300 li; si dice che vi siano «diecimila alberi lungo trecento li». I cipressi del Corridoio Cuiyun risalgono alle dinastie Qin e Han e raggiunsero una struttura completa durante la dinastia Ming. Formano un raro insieme di antichi alberi piantati lungo una strada e sono chiamati «l’anima della Via Shu» e «tesoro nazionale».","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il Corridoio Cuiyun è una sezione dell’antica Via Shu, parte dell’antica strada di Jianmen. In passato era chiamato «Via Jianzhou con cipressi» e, tra la gente, anche «Cipressi imperiali» o «Cipressi di Zhang Fei». Lungo l’antica strada crescono cipressi secolari, che si snodano per 300 li; si dice che vi siano «diecimila alberi lungo trecento li». I cipressi del Corridoio Cuiyun risalgono alle dinastie Qin e Han e raggiunsero una struttura completa durante la dinastia Ming. Formano un raro insieme di antichi alberi piantati lungo una strada e sono chiamati «l’anima della Via Shu» e «tesoro nazionale».","chinese":"翠云廊是古蜀道剑门蜀道的一段。古称剑州路柏，民间又称“皇柏”“张飞柏”。古道两旁古柏参天，蜿蜒三百里，号称“三百里程十万树”。翠云廊古柏始于秦汉、完备于明，是罕见的人工造植古老行道树群体，被誉为“蜀道灵魂”“国之珍宝”。"}]},{"category":"综合知识","number":47,"question":"简要介绍碧峰峡景区。","answer":"碧峰峡景区位于四川省雅安市雨城区，森林覆盖率达95%以上，由野生动物世界、生态峡谷景区、大熊猫基地三部分构成。景区先后被评为全国科普教育基地、全国旅游服务标准化示范试点单位、国家5A级旅游景区、国家级文明旅游示范单位。","italian_answer":"L’area panoramica di Bifengxia si trova nel distretto di Yucheng, nella città di Ya’an, nel Sichuan. La copertura forestale supera il 95%. L’area comprende tre parti: il mondo degli animali selvatici, il canyon ecologico e la base dei panda giganti. È stata riconosciuta come base nazionale per l’educazione scientifica, sito pilota nazionale per la standardizzazione dei servizi turistici, area panoramica nazionale di livello 5A e unità dimostrativa nazionale per il turismo civile.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"L’area panoramica di Bifengxia si trova nel distretto di Yucheng, nella città di Ya’an, nel Sichuan. La copertura forestale supera il 95%. L’area comprende tre parti: il mondo degli animali selvatici, il canyon ecologico e la base dei panda giganti. È stata riconosciuta come base nazionale per l’educazione scientifica, sito pilota nazionale per la standardizzazione dei servizi turistici, area panoramica nazionale di livello 5A e unità dimostrativa nazionale per il turismo civile.","chinese":"碧峰峡景区位于四川省雅安市雨城区，森林覆盖率达95%以上，由野生动物世界、生态峡谷景区、大熊猫基地三部分构成。景区先后被评为全国科普教育基地、全国旅游服务标准化示范试点单位、国家5A级旅游景区、国家级文明旅游示范单位。"}]},{"category":"综合知识","number":48,"question":"从2006年起，国务院将每年的哪天设立为“文化遗产日”？2016年9月，国务院决定把“文化遗产日”更名为什么？2026年文化和旅游部确定的该日活动主题是什么？","answer":"从2006年起，国务院将每年6月的第二个星期六设立为“文化遗产日”。2016年9月，国务院决定把“文化遗产日”调整设立为“文化和自然遗产日”。2026年文化和旅游部确定的活动主题为“非遗，让生活更美好！”。","italian_answer":"Dal 2006, il Consiglio di Stato ha istituito la Giornata del patrimonio culturale il secondo sabato di giugno di ogni anno. Nel settembre 2016 ha deciso di rinominarla «Giornata del patrimonio culturale e naturale». Il tema delle attività del 2026, stabilito dal Ministero della Cultura e del Turismo, è «Il patrimonio culturale immateriale rende la vita più bella!».","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Dal 2006, il Consiglio di Stato ha istituito la Giornata del patrimonio culturale il secondo sabato di giugno di ogni anno. Nel settembre 2016 ha deciso di rinominarla «Giornata del patrimonio culturale e naturale». Il tema delle attività del 2026, stabilito dal Ministero della Cultura e del Turismo, è «Il patrimonio culturale immateriale rende la vita più bella!».","chinese":"从2006年起，国务院将每年6月的第二个星期六设立为“文化遗产日”。2016年9月，国务院决定把“文化遗产日”调整设立为“文化和自然遗产日”。2026年文化和旅游部确定的活动主题为“非遗，让生活更美好！”。"}]},{"category":"综合知识","number":49,"question":"简要介绍入选2024年度全国十大考古新发现的四川考古遗址？","answer":"资阳濛溪河遗址群入选2024年度全国十大考古新发现。该遗址群距今10万年至5万年，遗址群第一地点（濛溪河遗址）距今8万年至6万年，处在现代人演化扩散的关键时期，填补了东亚现代人演化瓶颈期空白。","italian_answer":"Il gruppo di siti archeologici di Mengxihe, a Ziyang, è stato selezionato tra le dieci principali scoperte archeologiche nazionali del 2024. Il gruppo risale a un periodo compreso tra 100.000 e 50.000 anni fa; il primo sito, quello di Mengxihe, risale a 80.000-60.000 anni fa. Si trova in un periodo cruciale dell’evoluzione e della diffusione degli esseri umani moderni e colma una lacuna nella conoscenza della fase critica dell’evoluzione degli esseri umani moderni nell’Asia orientale.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il gruppo di siti archeologici di Mengxihe, a Ziyang, è stato selezionato tra le dieci principali scoperte archeologiche nazionali del 2024. Il gruppo risale a un periodo compreso tra 100.000 e 50.000 anni fa; il primo sito, quello di Mengxihe, risale a 80.000-60.000 anni fa. Si trova in un periodo cruciale dell’evoluzione e della diffusione degli esseri umani moderni e colma una lacuna nella conoscenza della fase critica dell’evoluzione degli esseri umani moderni nell’Asia orientale.","chinese":"资阳濛溪河遗址群入选2024年度全国十大考古新发现。该遗址群距今10万年至5万年，遗址群第一地点（濛溪河遗址）距今8万年至6万年，处在现代人演化扩散的关键时期，填补了东亚现代人演化瓶颈期空白。"}]},{"category":"综合知识","number":50,"question":"简要介绍窦圌山飞天藏。","answer":"飞天藏是存放经书的巨型木雕构件。窦圌山飞天藏于南宋淳熙八年（1181年）建造，整个藏身不施一颗铁钉，全由珍贵楠木穿斗而成。是全国仅有的两处宋代木质转轮经藏之一，也是我国唯一现存的宋代道教转轮经藏，为全国重点文物保护单位。","italian_answer":"Il «contenitore volante delle scritture» è una grande struttura lignea scolpita, utilizzata per conservare i testi buddhisti. Quello del monte Douquan fu costruito nell’ottavo anno dell’era Chunxi della dinastia Song meridionale, cioè nel 1181. La struttura non utilizza neppure un chiodo di ferro: è realizzata interamente con legno di nanmu pregiato, assemblato con il sistema a incastri. È uno dei soli due contenitori rotanti in legno dell’epoca Song ancora esistenti in Cina ed è l’unico contenitore rotante taoista dell’epoca Song conservato nel Paese. È un’unità nazionale di protezione dei beni culturali di grande importanza.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"Il «contenitore volante delle scritture» è una grande struttura lignea scolpita, utilizzata per conservare i testi buddhisti. Quello del monte Douquan fu costruito nell’ottavo anno dell’era Chunxi della dinastia Song meridionale, cioè nel 1181. La struttura non utilizza neppure un chiodo di ferro: è realizzata interamente con legno di nanmu pregiato, assemblato con il sistema a incastri. È uno dei soli due contenitori rotanti in legno dell’epoca Song ancora esistenti in Cina ed è l’unico contenitore rotante taoista dell’epoca Song conservato nel Paese. È un’unità nazionale di protezione dei beni culturali di grande importanza.","chinese":"飞天藏是存放经书的巨型木雕构件。窦圌山飞天藏于南宋淳熙八年（1181年）建造，整个藏身不施一颗铁钉，全由珍贵楠木穿斗而成。是全国仅有的两处宋代木质转轮经藏之一，也是我国唯一现存的宋代道教转轮经藏，为全国重点文物保护单位。"}]},{"category":"综合知识","number":51,"question":"成都武侯祠内“攻心联”素有“诸联之冠”的美誉。请说出该联的完整内容并简述其核心思想。","answer":"上联：能攻心则反侧自消，从古知兵非好战；下联：不审势即宽严皆误，后来治蜀要深思。该联由清代赵藩撰写，借诸葛亮治蜀的历史经验，阐述了“攻心为上”的治国理政智慧。上联强调真正的善用兵者不崇尚武力，而以攻心取胜；下联强调治理者须审时度势，宽严皆须因势而定，否则便会失误。全联既是对诸葛亮治蜀方略的精辟总结，也蕴含了深刻的治国理政哲理，是讲解三国文化和蜀汉历史的重要知识点。","italian_answer":"La «Lega dell’attacco al cuore» è considerata una delle migliori iscrizioni della Cina. Il testo completo è:\nParte superiore: «Se si riesce a conquistare il cuore, i ribelli si placano da soli; fin dall’antichità, chi conosce l’arte militare non ama la guerra».\nParte inferiore: «Se non si comprende la situazione, sia la clemenza sia la severità portano all’errore; chi governerà il Sichuan in futuro dovrà riflettere profondamente».\nLa coppia fu composta da Zhao Fan durante la dinastia Qing. Attraverso l’esperienza storica di Zhuge Liang nel governo dello Shu, esprime la saggezza politica secondo cui «conquistare il cuore è la cosa più importante». La parte superiore sottolinea che un vero esperto militare non ama la forza, ma vince conquistando il cuore delle persone. La parte inferiore sottolinea che chi governa deve comprendere la situazione e adattare clemenza e severità alle circostanze. L’intera iscrizione riassume in modo profondo il metodo di governo di Zhuge Liang e offre importanti riflessioni sull’arte di governare.","bilingual_pairing":"整段对照","bilingual_pairs":[{"italian":"La «Lega dell’attacco al cuore» è considerata una delle migliori iscrizioni della Cina. Il testo completo è:\nParte superiore: «Se si riesce a conquistare il cuore, i ribelli si placano da soli; fin dall’antichità, chi conosce l’arte militare non ama la guerra».\nParte inferiore: «Se non si comprende la situazione, sia la clemenza sia la severità portano all’errore; chi governerà il Sichuan in futuro dovrà riflettere profondamente».\nLa coppia fu composta da Zhao Fan durante la dinastia Qing. Attraverso l’esperienza storica di Zhuge Liang nel governo dello Shu, esprime la saggezza politica secondo cui «conquistare il cuore è la cosa più importante». La parte superiore sottolinea che un vero esperto militare non ama la forza, ma vince conquistando il cuore delle persone. La parte inferiore sottolinea che chi governa deve comprendere la sit
